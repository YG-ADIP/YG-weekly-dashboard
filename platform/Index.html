  function teamCalCard() {
    const card = sectionShell(false);
    card.appendChild(sectionHead(secNum("teamcal"), secTitle("teamcal"), false, TEAM_CAL_LABEL));
    // 헤더 옆 좁은 칸에 끼워 넣으면 텍스트가 길 때 잘려서, 헤더 아래 별도 줄로 뺌(자연스럽게 줄바꿈).
    const area = el("div", null);
    area.id = "teamcalInsightArea";
    card.appendChild(area);
    return card;
  }

  function eventDateRange(ev) {
    const s = ev.start && (ev.start.dateTime || ev.start.date);
    if (!s) return null;
    const isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
    const start = new Date(s);
    const eRaw = ev.end && (ev.end.dateTime || ev.end.date);
    let end = eRaw ? new Date(eRaw) : new Date(s);
    if (isAllDay) end = new Date(end.getTime() - 86400000); // end.date는 exclusive라 하루 뺌
    return { start, end, isAllDay };
  }

  function buildTeamCalWeeks(year, month, events) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, item) => { (byDay[day] = byDay[day] || []).push(item); };
    events.forEach(ev => {
      const range = eventDateRange(ev);
      if (!range) return;
      const title = ev.summary || "(제목 없음)";
      const timeLabel = range.isAllDay ? null : range.start.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
      let d = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
      const last = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
      let guard = 0;
      while (d <= last && guard < 366) {
        if (d.getFullYear() === year && d.getMonth() === month - 1) {
          push(d.getDate(), { title, time: timeLabel });
        }
        d.setDate(d.getDate() + 1);
        guard++;
      }
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dow: (firstDow + d - 1) % 7, entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  const TEAMCAL_MAX_VISIBLE = 3;

  function teamEventEl(cls, e) {
    const item = el(cls === "hp" ? "div" : "div", cls === "hp" ? "teamcal-hp-event2" : "teamcal-event2");
    if (e.time) item.appendChild(elText("b", null, e.time + " "));
    item.appendChild(document.createTextNode(e.title));
    item.title = e.title;
    return item;
  }

  function renderTeamCalGrid(weeks) {
    const grid = el("div", "teamcal-grid2");
    CAL_DOW.forEach(d => grid.appendChild(elText("div", "cal-dow2", d)));
    weeks.forEach(week => {
      week.forEach(cellData => {
        if (!cellData) { grid.appendChild(el("div", "teamcal-cell2 empty2")); return; }
        const hasEvents = cellData.entries.length > 0;
        const cell = el("div", "teamcal-cell2" + (hasEvents ? " has-events2" : ""));
        const inner = el("div", "teamcal-cell-inner2");
        const dayEl = elText("div", "cal-daynum2", String(cellData.day));
        dayEl.style.color = cellData.dow === 0 ? "#a2453c" : cellData.dow === 6 ? "#416180" : "#5d5d60";
        inner.appendChild(dayEl);
        cellData.entries.slice(0, TEAMCAL_MAX_VISIBLE).forEach(e => inner.appendChild(teamEventEl("visible", e)));
        const hidden = cellData.entries.length - TEAMCAL_MAX_VISIBLE;
        if (hidden > 0) inner.appendChild(elText("span", "teamcal-more2", `+${hidden}개 더`));
        cell.appendChild(inner);
        if (hasEvents) {
          const panel = el("div", "teamcal-hover-panel2");
          const dayEl2 = elText("div", "cal-daynum2", String(cellData.day));
          panel.appendChild(dayEl2);
          cellData.entries.forEach(e => panel.appendChild(teamEventEl("hp", e)));
          cell.appendChild(panel);
        }
        grid.appendChild(cell);
      });
    });
    return grid;
  }

        gridSlot.appendChild(elText("p", "teamcal-caption2", "칸에 마우스를 올리면 그날 전체 일정이 펼쳐집니다. 사업 일정(◈ 표시·촬영·전시·SNS 게시일·시딩일·서비스 운영종료 등, 04에서 직접 추가·제외한 일정 반영)은 04 사업 캘린더에 표시됩니다."));
      } catch (err) {

    nextBtn.onclick = () => { month++; if (month > 12) { month = 1; year++; } render(); };
    teamCalRerender = render;

    slotEl.innerHTML = "";
    slotEl.appendChild(card);
    await Promise.all([render(), loadWeeklyInsightBadge()]);
  }

  // ============================================================
  // 최상단 AI 인사이트 바 — 9월부터 하드코딩 대신, 이번 주 신규 실적 + 하반기 기여 상위 프로젝트를
  // 시트 데이터에서 자동으로 뽑아 문장으로 조합해서 보여줌(Apps Script "insight" 섹션 응답 사용).
  // 2026-09-11부터 KPI/AGENDA/트렌드와 같은 전체 주차 토글을 공유 — 과거 주차를 골라도 그 주차
  // 자신의 인사이트가 뜨고, "확정" 버튼으로 그 주차 화면 그대로를 고정해둘 수 있음.
  // ============================================================
  let insightData = null;
  let insightEditing = false; // 인사이트 문구 수동 수정

  function buildAutoInsightText(data) {
    if (!data || (!data.thisWeek.length && !data.topAnnual.length)) {
      return "데이터가 쌓이면 이번 주 신규 실적과 하반기 기여 상위 프로젝트를 자동으로 분석해서 보여드려요.";
    }
    const parts = [];
    if (data.thisWeek.length) {
      const items = data.thisWeek.map(w => `${w.project}(${fmtAmt(w.actual)}억)`).join(", ");
      parts.push(`${data.weekLabel} 신규 실적은 ${items}입니다.`);
    } else if (data.weekLabel) {
      parts.push(`${data.weekLabel}엔 새로 반영된 실적이 아직 없어요.`);
    }
    if (data.topAnnual.length) {
      const top = data.topAnnual.slice(0, 3).map(p => `${p.name}(${fmtAmt(p.amount)}억)`).join(", ");
      parts.push(`하반기 실적에 가장 큰 영향을 미치고 있는 프로젝트는 ${top} 순이에요.`);
    }
    return parts.join(" ");
  }

  // 사람이 저장해둔 수정본이 있으면(같은 주차일 때만 유효 — 백엔드에서 이미 주차 불일치 시 null로
  // 내려줌) 그걸 우선 보여주고, 없으면 AI 자동 분석 문구를 보여줌.
  function currentInsightText(data) {
    if (data && data.overrideText) return data.overrideText;
    return buildAutoInsightText(data);
  }

  function fmtEditedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())} 확정`;
  }

  // 빈 문자열을 넘기면(되돌리기 버튼) 백엔드가 확정 내용을 지우고 AI 자동 문구로 되돌림.
  // weekKey는 항상 "지금 화면에 뜬 주차" 기준 — 주차별로 독립 저장되므로 다른 주차로 넘어가도
  // 이 주차의 확정 내용은 그대로 유지된다.
  async function saveInsightEdit(text) {
    const trimmed = (text || "").trim();
    const weekKey = insightData ? insightData.weekKey : selectedWeekKey;
    try {
      const res = await callBackend("saveInsight", { text: trimmed, weekKey: weekKey || "" });
      if (!res.ok) throw new Error(res.message || res.error || "알 수 없는 오류");
    } catch (err) {
      alert("저장에 실패했어요: " + err.message);
      return;
    }
    insightEditing = false;
    // 방금 저장한 확정 내용을 다른 주차로 넘어갔을 때도 계속 보려면 캐시를 새로 받아야 함.
    try {
      const fresh = await callBackend("insight");
      if (fresh.ok) sectionCache.insight = fresh;
    } catch (err) { /* 캐시 갱신 실패해도 방금 저장은 이미 반영됐으니 무시 */ }
    loadInsightForWeek(selectedWeekKey);
  }

  // KPI/AGENDA/트렌드와 같은 by-week 패턴 — sectionCache.insight.byWeek[key]에서 그 주차 원본
  // 수치(thisWeek/topAnnual)와 확정본(overrideText)을 꺼내 렌더용 insightData로 조립.
  function loadInsightForWeek(key) {
    const entry = sectionCache.insight && sectionCache.insight.byWeek && sectionCache.insight.byWeek[key];
    if (!entry) {
      insightData = null;
    } else {
      insightData = {
        weekKey: key,
        weekLabel: weekLabel(entry, key),
        thisWeek: (entry.data && entry.data.thisWeek) || [],
        topAnnual: (entry.data && entry.data.topAnnual) || [],
        overrideText: entry.overrideText || null,
        overrideEditedAt: entry.overrideEditedAt || null,
      };
    }
    insightEditing = false;
    renderInsightBar();
  }

  // ============================================================
  // 전체 주차 토글 — KPI/팀 AGENDA/트렌드 리포트 3개 카드가 공유하는 단일 주차 선택
  // ============================================================
  const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  function weekOrder(monthAbbr, weekNum) { return MONTH_ABBR.indexOf(monthAbbr) * 100 + weekNum; }
  function krMonth(monthAbbr) { return MONTH_ABBR.indexOf(monthAbbr) + 1; }
  function weekLabel(entry, fallbackKey) {
    return entry ? `${krMonth(entry.monthAbbr)}월 ${entry.weekNum}주차` : (fallbackKey || "");
  }

  let GLOBAL_WEEKS = []; // [{key:"SEP_1", monthAbbr, weekNum, title}], 최신 순
  let selectedWeekKey = null;
  const sectionCache = { kpi: null, agenda: null, trend: null, insight: null };
  const globalWeekSelect = document.getElementById("globalWeekSelect");

  async function initGlobalWeeks() {
    // 로그인 검증 때 이미 kpi를 한 번 받았으면 그걸 재사용(중복 호출 방지, 리디자인 버그 4번).
    const kpiPromise = cachedKpiData ? Promise.resolve(cachedKpiData) : callBackend("kpi");
    cachedKpiData = null;
    const [kpiData, agendaData, trendData, insightData] = await Promise.all([
      kpiPromise, callBackend("agenda"), callBackend("trend"), callBackend("insight"),
    ]);
    if (!kpiData.ok) throw new Error(kpiData.message || kpiData.error || "알 수 없는 오류");
    sectionCache.kpi = kpiData;
    sectionCache.agenda = agendaData;
    sectionCache.trend = trendData;
    sectionCache.insight = insightData;
    KPI_GOAL = { goal: kpiData.goal, h2Goal: kpiData.h2Goal, goalBase: kpiData.goalBase, h2GoalBase: kpiData.h2GoalBase };

    // 네 섹션(KPI/AGENDA/트렌드/인사이트) 중 어느 하나라도 그 주차 시트가 있으면 토글에 포함 —
    // 월+주차 조합 키를 쓰기 때문에 다음 달 시트("SEP_1" 등)가 새로 생기면 코드 수정 없이
    // 자동으로 새 옵션이 나타난다.
    const keyMap = new Map();
    [kpiData, agendaData, trendData, insightData].forEach(d => {
      Object.keys(d.byWeek || {}).forEach(k => {
        const e = d.byWeek[k];
        keyMap.set(k, { monthAbbr: e.monthAbbr, weekNum: e.weekNum });
      });
    });
    GLOBAL_WEEKS = Array.from(keyMap.entries())
      .map(([key, v]) => ({ key, monthAbbr: v.monthAbbr, weekNum: v.weekNum, title: `${krMonth(v.monthAbbr)}월 ${v.weekNum}주차` }))
      .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
  }

  function renderGlobalWeekOptions() {
    globalWeekSelect.innerHTML = "";
    GLOBAL_WEEKS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w.key;
      opt.textContent = w.title;
      globalWeekSelect.appendChild(opt);
    });
  }

  function findDefaultWeekKey() {
    const kpiData = sectionCache.kpi;
    if (kpiData) {
      const sorted = Object.keys(kpiData.byWeek || {})
        .map(k => kpiData.byWeek[k])
        .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
      for (const e of sorted) {
        if (e.data && e.data.annual && !isNaN(e.data.annual.actual)) return `${e.monthAbbr}_${e.weekNum}`;
      }
    }
    return GLOBAL_WEEKS.length ? GLOBAL_WEEKS[0].key : null;
  }

  function renderForWeek(key) {
    if (key == null) return;
    selectedWeekKey = key;
    globalWeekSelect.value = key;
    loadKpiForWeek(key);
    loadAgendaForWeek(key);
    loadTrendForWeek(key);
    loadInsightForWeek(key);
  }

  globalWeekSelect.addEventListener("change", () => {
    renderForWeek(globalWeekSelect.value);
  });

  // ============================================================
  // 로딩 진행률 오버레이 — 7개 섹션이 각자 다른 속도로 채워지는 동안 "뭘 기다리는지"
  // 체크리스트로 보여줌(로딩이 오래 걸린다는 민원 대응, 시안 검토 후 "오버레이 체크리스트"
  // 방향으로 확정됨). initGlobalWeeks() 하나가 KPI/팀 AGENDA/트렌드/인사이트 4개 카드를 한 번에
  // 채우므로 그 작업 하나가 끝나면 체크리스트 4칸이 동시에 켜진다(실제로 그 넷이 같은 순간에
  // 준비되는 게 맞아서 오해 소지 없음).
  // ============================================================
  const LOADING_NAME_BY_KEY = { kpi: "KPI 실적", agenda: "팀 AGENDA", bizcal: "사업 캘린더", trend: "트렌드 리포트", teamcal: "팀 일정 캘린더" };
  const LOADING_SECTIONS2 = ["인사이트"].concat(VISIBLE_SECTIONS.map(sec => LOADING_NAME_BY_KEY[sec.key]));
  const CHECK_SVG2 = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>';
  let loadingOverlayEl2 = null;
  let loadingDoneSet2 = new Set();

  function ensureLoadingOverlay2() {
    if (loadingOverlayEl2) return loadingOverlayEl2;
    const overlay = el("div", null);
    overlay.id = "loadingOverlay";
    const card = el("div", "loading-card2");
    ["tl", "tr", "bl", "br"].forEach(pos => card.appendChild(el("i", "corner " + pos)));

    LOADING_SECTIONS2.forEach(name => {

      row.appendChild(el("span", "loading-dot2", CHECK_SVG2));

      checklist.appendChild(row);
    });
    card.appendChild(checklist);
    const track = el("div", "loading-track2");
    const fill = el("div", "loading-fill2");
    fill.id = "loadingFill2";
    track.appendChild(fill);
    card.appendChild(track);
    const count = elText("div", "loading-count2", `0 / ${LOADING_SECTIONS2.length} 완료`);
    count.id = "loadingCount2";
    card.appendChild(count);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    loadingOverlayEl2 = overlay;
    return overlay;
  }

  function showLoadingOverlay2() {
    loadingDoneSet2 = new Set();
    const overlay = ensureLoadingOverlay2();
    overlay.classList.remove("hide2");
    overlay.querySelectorAll(".loading-check-row2").forEach(r => r.classList.remove("done2"));
    document.getElementById("loadingFill2").style.width = "0%";
    document.getElementById("loadingCount2").textContent = `0 / ${LOADING_SECTIONS2.length} 완료`;
  }

  function markSectionsDone2(names) {
    names = names.filter(n => LOADING_SECTIONS2.includes(n)); // 숨긴 섹션은 진행률에서 제외
    names.forEach(n => loadingDoneSet2.add(n));
    const done = loadingDoneSet2.size;
    const pct = Math.round((done / LOADING_SECTIONS2.length) * 100);
    names.forEach(n => {
      const row = loadingOverlayEl2 && loadingOverlayEl2.querySelector(`.loading-check-row2[data-section="${n}"]`);
      if (row) row.classList.add("done2");
    });
    const fillEl = document.getElementById("loadingFill2");
    const countEl = document.getElementById("loadingCount2");
    if (fillEl) fillEl.style.width = pct + "%";
    if (countEl) countEl.textContent = `${done} / ${LOADING_SECTIONS2.length} 완료`;
  }

  function hideLoadingOverlay2() {
    if (loadingOverlayEl2) loadingOverlayEl2.classList.add("hide2");
  }

  async function loadAll() {
    document.getElementById("connState").textContent = "불러오는 중…";
    showLoadingOverlay2();
    const tasks = [];
    tasks.push((async () => {
      try {
        await initGlobalWeeks();
        renderGlobalWeekOptions();
        let target = (selectedWeekKey != null && GLOBAL_WEEKS.some(w => w.key === selectedWeekKey))
          ? selectedWeekKey
          : findDefaultWeekKey();
        renderForWeek(target);
      } catch (err) {
        const kpiSlot = document.getElementById("kpiSlot");
        kpiSlot.innerHTML = "";
        const errCard = kpiHeader("오류");
        errCard.classList.add("error-card2");
        errCard.appendChild(elText("p", "err-title2", "불러오지 못했어요: " + err.message));
        errCard.appendChild(elText("p", "err-sub2", "시트 구조가 바뀌었을 수 있어요. 새로고침해도 같으면 담당자에게 알려주세요."));
        kpiSlot.appendChild(errCard);
      } finally {
        markSectionsDone2(["KPI 실적", "팀 AGENDA", "트렌드 리포트", "인사이트"]);
      }
    })());
    if (secVisible("bizcal")) tasks.push(loadCalSection(document.getElementById("calSlot")).then(() => markSectionsDone2(["사업 캘린더"])));
    if (secVisible("teamcal")) tasks.push(loadTeamCalSection(document.getElementById("teamCalSlot")).then(() => markSectionsDone2(["팀 일정 캘린더"])));
    await Promise.all(tasks);
    document.getElementById("connState").textContent = "";
    hideLoadingOverlay2();
  }

  // 사업 원장 입력 양식 묶음
  // 사업 원장 입력 양식: 꼭 필요한 칸만 먼저 보이고, 나머지는 [추가 정보]에 접어 둠. 자동 계산 칸은 맨 위 한 줄 요약.
  const DEAL_CORE_GROUPS = [
    ["어떤 사업인가요?", ["part", "group", "artist", "brand", "name", "ckind"]],
    ["진행 단계", ["stage", "reason"]],
    ["금액 · 계약 기간", ["cur", "amount", "startDate", "endDate", "kpiHalfManual"]],
    ["입금 (회계 확인 후 입력)", ["paidKrw", "paidDate"]],
  ];
  const DEAL_EXTRA_KEYS = ["year", "ctype", "item", "country", "cond", "shortDate", "decidedDate", "startStatus", "endStatus", "months", "owner", "note"];
  const MONEY_REQUIRED_WEIGHT = 70; // 03 최종 압축(경영진 승인 완료)부터 통화·금액 필수 — 서버(Db.gs)와 같은 값
  function stageWeight(name) { const s = (COLLAB.meta.codes.stages || []).find(x => x.name === name); return s ? s.weight : 0; }
  // 칸에 무엇을 적을지 모를 때 보여 줄 회색 예시: 기존 입력값에서 자주 쓰인 값 2개, 없으면 기본 예시
  const STATIC_EXAMPLES = {
    artist: "아현, 로라", brand: "로레알 가르니에", name: "가르니에 광고 모델 1년", country: "한국", cond: "1년 · SNS 3회 · 오프라인 행사 1회",
    reason: "광고주 예산 축소로 보류", owner: "담당자 이름", note: "11/20 경영진 보고 완료", amount: "300000000 (계약통화 기준 금액, 숫자만)",
    paidKrw: "295000000 (회계 확인 후)", months: "12", project: "프로젝트 이름", content: "핵심 내용 한 줄씩", team: "광고팀",
  };
  function exampleFor(table, key, filter) {
    const rows = (COLLAB.rows[table] || []).filter(r => !filter || filter(r));
    const freq = {};
    rows.forEach(r => { const v = String(r[key] == null ? "" : r[key]).trim(); if (v && v.length <= 40 && !/확인 필요|^\d{4}-\d{2}/.test(v)) freq[v] = (freq[v] || 0) + 1; });
    const top = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 2);
    if (top.length) return "예) " + top.join(" / ");
    return STATIC_EXAMPLES[key] ? "예) " + STATIC_EXAMPLES[key] : "";
  }
  // 사업별 '다음 할 일' — 목록·입력 양식에서 같은 기준으로 표시
  function dealTodos(r) {
    const w = stageWeight(r.stage), out = [];
    const add = (t, who) => out.push({ t, who: who || "작성자" });
    if (/확인 필요/.test(r.note || "")) add("브랜드·사업명 확인 필요(시트 이관)");
    if (r.group === "기타" && !r.artist) add("아티스트 확인 필요");
    if (w === 0 && /불발/.test(r.stage || "") && !r.reason) add("불발 사유 입력 필요");
    if (w === 0 && /보류/.test(r.stage || "") && !r.reason) add("보류 사유 입력 필요");
    if (w >= MONEY_REQUIRED_WEIGHT && (!r.cur || r.amount === "" || r.amount == null)) add("계약통화·금액 입력 필요");
    else if (r.kpiKrw === "KPI 환율 없음") add(`KPI 고정환율 등록 필요(${r.cur})`, "관리자");
    if (w >= 90 && !r.startDate) add("계약 시작일 확인 필요");
    if (w >= 90 && !r.endDate) add("계약 종료일 확인 필요");
    if (w >= 100 && !r.startDate && !r.kpiHalfManual) add("KPI 인정 반기 지정 필요");
    if (w >= 100 && r.approval === "승인 대기" && !out.length) add("관리자 KPI 승인 대기", "관리자");
    // 입금 확인은 계약이 시작된 뒤에만(시작 전 건까지 띄우면 목록이 온통 '확인 필요'가 됨)
    const today = new Date(), ym = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    if (w >= 100 && (r.paidKrw === "" || r.paidKrw == null) && r.startDate && String(r.startDate).slice(0, 7) <= ym) add("실입금액 확인 필요", "회계");
    return out;
  }
  // 단계별 안내(할 일이 없을 때 다음 단계로 가려면 무엇을 하면 되는지)
  function stageGuide(stage) {
    const w = stageWeight(stage);
    if (w === 0) return "종료된 건입니다. 사유만 남겨 두면 됩니다.";
    if (w < MONEY_REQUIRED_WEIGHT) return "경영진 보고·승인이 끝나면 '03 최종 압축'으로 바꾸고 계약통화·금액을 입력하세요.";
    if (w < 90) return "경영진 승인 완료 건 — 계약통화·금액을 넣으면 KPI가 자동 계산됩니다. 계약서 작업이 시작되면 '04 계약 진행 중'으로.";
    if (w < 100) return "계약 체결되면 '05 진행 확정'으로 바꾸고 계약 시작일·종료일을 확인하세요.";
    return "확정 건 — 관리자가 KPI 승인하면 실적으로 집계됩니다. 입금되면 회계 확인 후 실입금액을 입력하세요.";
  }

  function callDb(action, payload) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(text => { try { resolve(JSON.parse(text)); } catch (e) { reject(e); } })
        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String((err && err.message) || err))))
        .dbApi(action, storedPw(), COLLAB.user, JSON.stringify(Object.assign({}, payload || {}, COLLAB.adminPw ? { adminPw: COLLAB.adminPw } : {})));
    });
  }
  function tableDef(key) { return COLLAB.meta.tables.find(t => t.key === key); }
  function colDef(table, key) { return tableDef(table).cols.find(c => c.key === key); }
  function codeNames(codeKey) { return (COLLAB.meta.codes[codeKey] || []).map(x => (typeof x === "string" ? x : x.name)); }
  function fmtNum(v) { return typeof v === "number" ? v.toLocaleString("ko-KR") : (v == null ? "" : String(v)); }
  function weekTitle(key) { const p = String(key || "").split("_"); return p.length === 2 ? `${krMonth(p[0])}월 ${p[1]}주차` : key; }
  function cellText(table, key, v) {
    if (v === "" || v == null) return "";
    if (key === "week") return weekTitle(v);
    if (key === "weight") return Math.round(v * 100) + "%";
    if (["amount", "kpiKrw", "weighted", "paidKrw", "rate"].includes(key)) return fmtNum(v);
    return String(v);
  }

  function updateAdminChip() {

  // 지난 연도는 조회용: 대시보드·입력 탭 모두 그 해 데이터로 바뀜(입력은 각 레코드의 연도 칸 기준)
  function changeViewYear(y) {
    CFG_YEAR = y;

    if (COLLAB.view === "dashboard") loadAll(); else { COLLAB.dashDirty = true; renderDataView(COLLAB.view); }

  function openAdminLogin() {
    const m = openModal("관리자 모드");
    m.body.appendChild(elText("p", "modal-desc2", "관리자 비밀번호를 입력하면 이 창에서 KPI 목표·환율, KPI 승인, 엑셀 업로드, 팀원, 기준 정보(운영 연도·진행 단계)를 바꿀 수 있습니다. 5회 틀리면 30분 잠깁니다."));

  // 기준 정보: 운영 연도 전환 + 진행 단계·가중치 + 드롭다운 목록(관리자 모드에서만 수정)
  function renderSettingsView() {
    const wrap = el("div", "settings-wrap2");

    if (admin) {

      const btn = elText("button", "btn-primary2", "운영 연도 전환"); btn.type = "button";
      btn.addEventListener("click", async () => {
        const y = parseInt(inp.value, 10);
        if (!confirm(`운영 연도를 ${COLLAB.meta.operatingYear}년 → ${y}년으로 바꿀까요?\n모든 팀원의 기본 화면이 ${y}년으로 바뀝니다. ${y}년 KPI 목표·환율도 입력해 주세요.`)) return;
        const res = await callDb("setYear", { year: y });

      const btn = elText("button", "btn-primary2", "기존 시트 데이터 가져오기"); btn.type = "button";
      btn.addEventListener("click", async () => {
        if (!confirm("기존 시트 데이터를 가져올까요? (1분 가까이 걸릴 수 있습니다)")) return;

    // 진행 단계

    stageBox.appendChild(elText("p", "data-desc2", "가중치 100 = 진행 확정(관리자 KPI 승인 후 실적 집계) · 1~99 = 진행 중(가중 예상) · 0 = 불발·보류"));
    const t = el("table", "data-table2");
    const hr = el("tr", null); ["단계", "가중치", "설명"].forEach(h => hr.appendChild(elText("th", null, h)));
    const th = el("thead", null); th.appendChild(hr); t.appendChild(th);
    const tb = el("tbody", null);
    codes.stages.forEach(st => { const tr = el("tr", null); tr.append(elText("td", null, st.name), elText("td", null, st.weight + "%"), elText("td", "long2", st.desc || "")); tb.appendChild(tr); });
    t.appendChild(tb);
    const tw = el("div", "data-table-wrap2"); tw.appendChild(t); stageBox.appendChild(tw);
    wrap.appendChild(stageBox);
    // 드롭다운 목록
    const lists = [["groups", "아티스트 그룹"], ["ctypes", "계약유형"], ["ckinds", "계약구분"], ["items", "품목"], ["currencies", "계약통화"]];
    const listBox = el("div", "settings-block2");
    listBox.appendChild(elText("h3", "data-table-title2", "선택 목록"));

  async function loadRows(table, force) {
    if (!force && COLLAB.rows[table]) return COLLAB.rows[table];
    const res = await callDb("list", { table });
    if (!res.ok) throw new Error(res.message || res.error);
    COLLAB.rows[table] = res.rows;
    return res.rows;
  }

  function defaultFilters(table) {
    const f = COLLAB.filters[table] || (COLLAB.filters[table] = { q: "", year: String(CFG_YEAR), week: "", part: "", stage: "" });
    if ((table === "agenda" || table === "trend") && !f.week) f.week = COLLAB.meta.currentWeek;
    return f;
  }

  function filteredRows(table, rows) {
    const f = defaultFilters(table);
    const q = f.q.trim().toLowerCase();
    return rows.filter(r => {
      if (f.year && r.year !== undefined && r.year !== "" && String(r.year) !== f.year && table !== "log" && table !== "members") return false;
      if (f.week && r.week !== undefined && r.week !== f.week) return false;
      if (f.part && r.part !== f.part) return false;
      if (f.stage && r.stage !== f.stage) return false;
      if (f.approval && r.approval !== f.approval) return false;
      if (f.todo && table === "deals") { const need = dealTodos(r).some(x => x.who !== "관리자"); if ((f.todo === "확인 필요") !== need) return false; }
      if (q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
      return true;
    });
  }

  async function renderTableBlock(section, table, showTitle) {
    const def = tableDef(table);
    section.innerHTML = "";
    if (showTitle) section.appendChild(elText("h3", "data-table-title2", def.sheet.replace(/_/g, " ")));
    const toolbar = el("div", "data-toolbar2");
    section.appendChild(toolbar);
    const summary = el("div", "data-summary2");
    section.appendChild(summary);
    const tableWrap = el("div", "data-table-wrap2");
    section.appendChild(tableWrap);
    tableWrap.appendChild(elText("p", "state-msg2", "불러오는 중…"));
    let rows;
    try { rows = await loadRows(table, true); } catch (err) {
      tableWrap.innerHTML = ""; tableWrap.appendChild(elText("p", "state-msg2 err2", "불러오지 못했어요: " + err.message)); return;
    }
    const f = defaultFilters(table);
    const rerender = () => renderTableBlock(section, table, showTitle);
    const redraw = () => drawTable(tableWrap, summary, table, rows);

    // 필터
    const search = document.createElement("input");
    search.type = "search"; search.placeholder = "검색"; search.value = f.q; search.className = "data-search2";
    search.addEventListener("input", () => { f.q = search.value; redraw(); });
    toolbar.appendChild(search);
    const addSelect = (label, options, value, onChange) => {
      const s = document.createElement("select");
      s.className = "data-filter2";
      s.appendChild(new Option(label + ": 전체", ""));
      options.forEach(o => s.appendChild(new Option(typeof o === "string" ? o : o.label, typeof o === "string" ? o : o.value)));
      s.value = value;
      s.addEventListener("change", () => { onChange(s.value); redraw(); });
      toolbar.appendChild(s);
    };
    if (def.cols.some(c => c.key === "year")) {
      const years = Array.from(new Set(rows.map(r => String(r.year)).filter(Boolean).concat(String(COLLAB.meta.year), String(CFG_YEAR)))).sort().reverse();
      addSelect("연도", years, f.year, v => { f.year = v; });
    }
    if (def.cols.some(c => c.key === "week")) {
      const weeks = Array.from(new Set(rows.map(r => r.week).filter(Boolean).concat(COLLAB.meta.currentWeek)))
        .sort((a, b) => { const pa = a.split("_"), pb = b.split("_"); return weekOrder(pb[0], +pb[1]) - weekOrder(pa[0], +pa[1]); });
      addSelect("주차", weeks.map(w => ({ value: w, label: weekTitle(w) + (w === COLLAB.meta.currentWeek ? " (이번 주)" : "") })), f.week, v => { f.week = v; });
    }
    if (table === "deals") {
      addSelect("파트", codeNames("parts"), f.part, v => { f.part = v; });
      addSelect("단계", codeNames("stages"), f.stage, v => { f.stage = v; });
      addSelect("KPI 승인", ["승인 대기", "승인"], f.approval || "", v => { f.approval = v; });
      addSelect("다음 할 일", ["확인 필요", "없음"], f.todo || "", v => { f.todo = v; });
    }
    const spacer = el("span", "data-spacer2");
    toolbar.appendChild(spacer);
    if (canEdit(table)) {
      const add = elText("button", "btn-primary2", "＋ 새로 추가"); add.type = "button";
      add.addEventListener("click", () => openRecordForm(table, null, rerender));
      toolbar.appendChild(add);
    }
    if (def.editable && isAdminMode()) {
      const up = elText("button", "btn-line2", "엑셀 업로드"); up.type = "button";
      up.addEventListener("click", () => pickExcel(table, rerender));
      toolbar.appendChild(up);
    }
    if (table === "deals" && isAdminMode()) {
      const appr = elText("button", "btn-approve2", "승인 대기 일괄 승인"); appr.type = "button";
      appr.addEventListener("click", async () => {
        const targets = filteredRows(table, rows).filter(r => r.approval === "승인 대기");
        if (!targets.length) { alert("지금 목록에 승인 대기 건이 없어요."); return; }
        const sum = targets.reduce((a, r) => a + (typeof r.kpiKrw === "number" ? r.kpiKrw : 0), 0);
        if (!confirm(`지금 목록의 승인 대기 ${targets.length}건(KPI ${(sum / 1e8).toFixed(2)}억)을 승인할까요?\n승인하면 각 건의 KPI 기준연도·인정 반기 실적으로 집계됩니다.`)) return;
        const res = await callDb("approve", { ids: targets.map(r => r.id), approve: true });
        if (!res.ok) { alert("실패: " + (res.message || res.error)); return; }
        alert(`${res.done}건 승인했습니다.` + (res.skipped.length ? `\n제외 ${res.skipped.length}건:\n` + res.skipped.slice(0, 10).join("\n") : ""));
        COLLAB.dashDirty = true; rerender();
      });
      toolbar.appendChild(appr);
    }
    const down = elText("button", "btn-line2", "엑셀 다운로드"); down.type = "button";
    down.addEventListener("click", () => downloadExcel([table], filteredRows(table, rows)));
    toolbar.appendChild(down);
    if (table === "deals") {
      const all = elText("button", "btn-line2", "전체 DB 엑셀"); all.type = "button";
      all.addEventListener("click", () => downloadAllDb());
      toolbar.appendChild(all);
    }
    redraw();
  }

  function drawTable(wrap, summary, table, rows) {
    const def = tableDef(table);
    const list = filteredRows(table, rows);
    summary.innerHTML = "";
    if (table === "deals") {
      const byStage = {};
      list.forEach(r => { const s = byStage[r.stage] || (byStage[r.stage] = { n: 0, krw: 0 }); s.n++; if (typeof r.kpiKrw === "number") s.krw += r.kpiKrw; });
      codeNames("stages").forEach(st => {
        if (!byStage[st]) return;
        const chip = el("button", "stage-chip2" + (defaultFilters(table).stage === st ? " on2" : ""));
        chip.type = "button";
        chip.appendChild(elText("b", null, st));
        chip.appendChild(document.createTextNode(` ${byStage[st].n}건 · ${(byStage[st].krw / 1e8).toFixed(1)}억`));
        chip.addEventListener("click", () => { const f = defaultFilters(table); f.stage = f.stage === st ? "" : st; drawTable(wrap, summary, table, rows); });
        summary.appendChild(chip);
      });
    }
    if (table === "deals") {
      const pending = list.filter(r => r.approval === "승인 대기");
      if (pending.length) {
        const chip = el("button", "stage-chip2 pending2" + (defaultFilters(table).approval === "승인 대기" ? " on2" : ""));
        chip.type = "button";
        chip.appendChild(elText("b", null, "KPI 승인 대기"));
        chip.appendChild(document.createTextNode(` ${pending.length}건`));
        chip.addEventListener("click", () => { const f = defaultFilters(table); f.approval = f.approval === "승인 대기" ? "" : "승인 대기"; drawTable(wrap, summary, table, rows); });
        summary.appendChild(chip);
      }
    }
    if (table === "deals") {
      const need = list.filter(r => dealTodos(r).some(x => x.who !== "관리자"));
      if (need.length) {
        const chip = el("button", "stage-chip2 todo2" + (defaultFilters(table).todo === "확인 필요" ? " on2" : ""));
        chip.type = "button";
        chip.appendChild(elText("b", null, "확인 필요"));
        chip.appendChild(document.createTextNode(` ${need.length}건`));
        chip.addEventListener("click", () => { const f = defaultFilters(table); f.todo = f.todo === "확인 필요" ? "" : "확인 필요"; drawTable(wrap, summary, table, rows); });
        summary.appendChild(chip);
      }
    }
    summary.appendChild(elText("span", "data-count2", `${list.length}건${list.length !== rows.length ? ` / 전체 ${rows.length}건` : ""}`));
    wrap.innerHTML = "";
    if (!list.length) { wrap.appendChild(elText("p", "state-msg2", "조건에 맞는 항목이 없어요." + (def.editable ? " [＋ 새로 추가]로 입력하세요." : ""))); return; }
    const t = el("table", "data-table2");
    const thead = el("thead", null), hr = el("tr", null);
    LIST_COLS[table].forEach(k => hr.appendChild(elText("th", null, k === "todo" ? "다음 할 일" : colDef(table, k).label)));
    if (table === "log") hr.appendChild(elText("th", null, ""));
    thead.appendChild(hr); t.appendChild(thead);
    const tbody = el("tbody", null);
    const sorted = list.slice().sort((a, b) => String(b.updatedAt || b.at || b.recordedAt || "").localeCompare(String(a.updatedAt || a.at || a.recordedAt || "")));
    sorted.slice(0, 500).forEach(r => {
      const tr = el("tr", canEdit(table) ? "clickable2" : null);
      if (r.id) tr.title = "ID " + r.id;
      LIST_COLS[table].forEach(k => {
        if (k === "todo") { const td = el("td", "todo-cell2"); todoChips(td, dealTodos(r)); tr.appendChild(td); return; }
        const td = elText("td", ["content", "before", "after", "name"].includes(k) ? "long2" : null, cellText(table, k, r[k]));
        if (k === "approval" && r.approval) td.classList.add(r.approval === "승인" ? "appr-ok2" : "appr-wait2");
        if (k === "stage" && r.stage) td.dataset.weight = String(((COLLAB.meta.codes.stages.find(s => s.name === r.stage) || {}).weight) || 0);
        tr.appendChild(td);
      });
      if (table === "log") {
        const td = el("td", null);
        if (r.action === "삭제") {
          const b = elText("button", "btn-line2 small2", "복원"); b.type = "button";
          b.addEventListener("click", async e => {
            e.stopPropagation();
            if (!confirm("이 항목을 복원할까요?")) return;
            const res = await callDb("restore", { logId: r.id });
            alert(res.ok ? "복원했습니다." : "복원 실패: " + (res.message || res.error));
            if (res.ok) { COLLAB.dashDirty = true; renderDataView(COLLAB.view); }
          });
          td.appendChild(b);
        }
        tr.appendChild(td);
      }
      if (canEdit(table)) tr.addEventListener("click", () => openRecordForm(table, r, () => renderDataView(COLLAB.view)));
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    if (sorted.length > 500) wrap.appendChild(elText("p", "state-msg2", "최근 500건만 표시합니다. 검색·필터로 좁혀 보세요."));
  }

  // ---------------- 입력 양식 ----------------
  function newRecordDefaults(table) {
    const f = defaultFilters(table);
    const year = COLLAB.meta.operatingYear || COLLAB.meta.year;
    if (table === "deals") return { part: "광고", year, stage: codeNames("stages")[0], cur: "KRW", ctype: "신규계약" };
    if (table === "agenda") return { year, week: f.week || COLLAB.meta.currentWeek, kind: "WIN" };
    if (table === "trend") return { year, week: f.week || COLLAB.meta.currentWeek, kind: "외부" };
    if (table === "kpiGoals") return { year, part: "전체", period: "연간" };
    if (table === "fx") return { year, unit: 1 };
    if (table === "members") return { role: "팀원", active: "사용" };
    return {};
  }

  function todoChips(box, todos) {
    box.innerHTML = "";
    if (!todos.length) { box.appendChild(elText("span", "todo-none2", "—")); return; }
    todos.forEach(x => box.appendChild(elText("span", "todo-chip2" + (x.who === "관리자" ? " admin2" : x.who === "회계" ? " acct2" : ""), x.t)));
  }
  // 날짜 칸: [일자 | 월만 | 미정] 중 고르고 달력으로 선택. 실제 저장값은 숨은 칸(data-key)에 'YYYY-MM-DD'/'YYYY-MM'/''로.
  function flexDateInput(col, value) {
    const box = el("div", "flexdate2");
    box.dataset.for = col.key;
    const hidden = document.createElement("input");
    hidden.type = "hidden"; hidden.dataset.key = col.key;
    const v = String(value == null ? "" : value);
    let mode = /^\d{4}-\d{2}-\d{2}$/.test(v) ? "day" : /^\d{4}-\d{2}$/.test(v) ? "month" : "none";
    const seg = el("div", "seg2");
    const pick = document.createElement("input");
    const sync = () => { hidden.value = mode === "none" ? "" : pick.value; hidden.dispatchEvent(new Event("change", { bubbles: true })); };
    const btns = {};
    const setMode = m => {
      const old = pick.value;
      mode = m;
      Object.keys(btns).forEach(k => btns[k].classList.toggle("on2", k === m));
      pick.hidden = m === "none";
      if (m !== "none") {
        pick.type = m === "day" ? "date" : "month";
        pick.value = m === "month" ? old.slice(0, 7) : (/^\d{4}-\d{2}-\d{2}$/.test(old) ? old : "");
      }
      sync();
    };
    [["day", "일자"], ["month", "월만"], ["none", "미정"]].forEach(([k, t]) => {
      const b = elText("button", "seg-btn2", t); b.type = "button"; b.dataset.mode = k;
      b.addEventListener("click", e => { e.preventDefault(); setMode(k); });
      btns[k] = b; seg.appendChild(b);
    });
    pick.type = mode === "month" ? "month" : "date";
    pick.className = "date-pick2";
    pick.value = mode === "none" ? "" : v;
    pick.hidden = mode === "none";
    pick.addEventListener("change", sync);
    // 칸을 누르면 바로 달력이 열리도록(지원 브라우저)
    pick.addEventListener("click", () => { try { pick.showPicker && pick.showPicker(); } catch (e) {} });
    pick.addEventListener("input", sync);
    Object.keys(btns).forEach(k => btns[k].classList.toggle("on2", k === mode));
    hidden.value = mode === "none" ? "" : v;
    box.append(seg, pick, hidden);
    return box;
  }

  function fieldInput(table, col, value) {
    // 날짜 칸은 버튼이 들어 있어 label로 감싸면 글자 클릭 시 첫 버튼이 눌리므로 div 사용
    const wrap = el(col.type === "flexdate" ? "div" : "label", "form-field2" + (col.type === "longtext" ? " full2" : ""));
    wrap.dataset.field = col.key;
    const label = elText("span", "form-label2", col.label);
    const req = elText("span", "req2", col.required ? " *" : "");
    label.appendChild(req);
    wrap.appendChild(label);
    let input;
    if (col.type === "flexdate") {
      wrap.appendChild(flexDateInput(col, value));
      wrap.appendChild(elText("span", "form-hint2", "날짜를 알면 [일자], 월만 알면 [월만], 모르면 [미정]"));
      return wrap;
    }
    if (col.type === "auto") {
      input = elText("div", "form-auto2", cellText(table, col.key, value) || "—(자동)");
    } else if (col.type === "select") {
      input = document.createElement("select");
      if (!col.required) input.appendChild(new Option("—", ""));
      const names = col.codes === "weeks" ? COLLAB.meta.codes.weeks : codeNames(col.codes);

  // ---------------- 엑셀 ----------------
  let xlsxLoading = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxLoading) xlsxLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => { xlsxLoading = null; reject(new Error("엑셀 도구를 불러오지 못했어요(네트워크 확인)")); };
      document.head.appendChild(s);
    });
    return xlsxLoading;
  }
  function sheetFor(XLSX, table, rows) {
    const cols = tableDef(table).cols;
    const aoa = [cols.map(c => c.label)].concat(rows.map(r => cols.map(c => (r[c.key] === undefined ? "" : r[c.key]))));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = cols.map(c => ({ wch: Math.max(10, Math.min(40, c.label.length * 2 + 2)) }));
    ws["!freeze"] = { xSplit: 0, ySplit: 1 };
    return ws;
  }
  async function downloadExcel(tables, rowsOverride) {
    try {
      const XLSX = await loadXlsx();
      const wb = XLSX.utils.book_new();
      for (const t of tables) {
        const rows = rowsOverride && tables.length === 1 ? rowsOverride : await loadRows(t, true);
        XLSX.utils.book_append_sheet(wb, sheetFor(XLSX, t, rows), tableDef(t).sheet.slice(0, 31));
      }
      const stamp = new Date().toISOString().slice(0, 10);
      saveWorkbook(XLSX, wb, `${PLATFORM_UI.general.title.replace(/\s+/g, "_")}_${tables.length === 1 ? tableDef(tables[0]).sheet : "전체DB"}_${stamp}.xlsx`);
    } catch (err) { alert("다운로드 실패: " + err.message); }
  }
  // 파일 이름이 확실히 붙도록 Blob + download 링크로 직접 저장
  function saveWorkbook(XLSX, wb, fileName) {
    const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const url = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function downloadAllDb() { downloadExcel(COLLAB.meta.tables.map(t => t.key)); }

  // 엑셀 업로드(관리자): 파일 선택 즉시 진행 창을 띄워 "읽는 중 → 서버 확인 중 → 미리보기 → 반영 결과"를 단계별로 보여줌.
  // 어느 단계에서 실패해도 창 안에 원인을 표시(멈춘 듯 보이지 않게).
  function pickExcel(table, onDone) {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".xlsx,.xls,.csv";
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!COLLAB.user) { openUserPicker(false); return; }
      const m = openModal("엑셀 업로드 — " + file.name, true, true);
      const step = text => { m.body.innerHTML = ""; m.body.appendChild(elText("p", "state-msg2", text)); };
      step("① 엑셀 파일 읽는 중…");
      try {
        const XLSX = await loadXlsx();
        const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
        const want = tableDef(table).sheet;
        const ws = wb.Sheets[want] || wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
        // 머리글 행 찾기: 처음 10행 중 글자 칸이 가장 많은 행(BIS 엑셀처럼 위에 제목이 있어도 됨)
        let hIdx = 0, best = -1;
        aoa.slice(0, 10).forEach((r, i) => { const n = r.filter(v => typeof v === "string" && v.trim()).length; if (n > best) { best = n; hIdx = i; } });
        if (!aoa.length) throw new Error("빈 파일이에요.");
        const header = aoa[hIdx].map(h => String(h).trim());
        const pad = n => String(n).padStart(2, "0");
        const toCell = v => (v instanceof Date ? `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}` : v);
        const rows = aoa.slice(hIdx + 1).filter(r => r.some(v => v !== "" && v != null))
          .map(r => { const o = {}; header.forEach((h, j) => { if (h) o[h] = toCell(r[j]); }); return o; });
        if (!rows.length) throw new Error("머리글 아래에 데이터 행이 없어요.");
        await previewImport(table, rows, m, onDone, hIdx + 1);
      } catch (err) {
        showUploadError(m, table, err.message);
      }
    });
    input.click();
  }

  function showUploadError(m, table, message) {
    m.body.innerHTML = "";
    m.body.appendChild(elText("p", "err2", "업로드하지 못했어요: " + message));

    actions.appendChild(close);
    m.body.appendChild(actions);

      m.body.innerHTML = "";
      const box = el("div", "import-done2");
      box.appendChild(elText("p", "ok-big2", `✅ 반영 완료 — 신규 ${done.result.added}건 · 변경 ${done.result.updated}건`));
      if (done.result.errors) box.appendChild(elText("p", "err2", `오류 ${done.result.errors}건은 반영하지 않았어요.`));
      box.appendChild(elText("p", "modal-desc2", "변경 이력 탭에 '엑셀 업로드' 기록으로 남았습니다." + (table === "members" ? " 이름 선택 목록에도 바로 반영됐어요." : "")));
      m.body.appendChild(box);
      const a2 = el("div", "form-actions2");
      const ok = elText("button", "btn-primary2", "확인"); ok.type = "button";
      ok.addEventListener("click", () => { m.close(); onDone && onDone(); });
      a2.appendChild(ok);
      m.body.appendChild(a2);
      onDone && onDone();
    });
    actions.append(go, cancel);
    m.body.appendChild(actions);
  }

  // 팀원 명단 등이 바뀌면 이름 선택 목록·연도 목록을 다시 받아 옴
  async function refreshMeta() {
    try { const meta = await callDb("meta"); if (meta.ok) { COLLAB.meta = meta; renderYearOptions(); } } catch (e) {}
  }
</script>
</body>
</html>
