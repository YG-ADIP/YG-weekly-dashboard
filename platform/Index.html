  // ============================================================
  // ⑤ 팀 일정 캘린더 (구글 캘린더)
  // ============================================================
  const TEAM_CAL_LABEL = PLATFORM_UI.sources.teamCalendarLabel; // 관리자 설정

  // 팀 일정 캘린더 헤더 아래 "다음 일정 AI 인사이트" 배지 — 이번 주 회의에서 다음 주 일정을
  // 미리 확인하는 용도라, "이번 주"가 아니라 오늘(실시간) 기준 이후 10일치를 본다.
  // 캘린더 그리드(어느 달을 보고 있든)와 별개로 항상 "실제 오늘" 기준으로 계산해서 보여준다.
  const UPCOMING_INSIGHT_KEYWORDS = PLATFORM_UI.teamCal.upcomingKeywords; // 관리자 설정
  const UPCOMING_INSIGHT_DAYS = PLATFORM_UI.teamCal.upcomingDays;         // 관리자 설정
  const UPCOMING_EMPTY_TEXT = `차주엔 ${UPCOMING_INSIGHT_KEYWORDS.join("·") || "주요"} 일정이 없어요.`;

  function upcomingInsightRange(base) {
    const start = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    const end = new Date(start); end.setDate(start.getDate() + UPCOMING_INSIGHT_DAYS - 1); // 오늘 포함 10일
    return { start, end };
  }

  // 오늘 이전에 시작해서 이 기간까지 걸쳐 있는 일정(예: 이미 시작된 다일간 출장)도 겹치기만
  // 하면 포함 — 시작일이 기간 안에 있어야만 잡는 게 아니라 r.end/r.start로 겹침 자체를 검사.
  function matchUpcomingKeywordEvents(events, range) {
    const matched = [];
    events.forEach(ev => {
      const r = eventDateRange(ev);
      if (!r) return;
      if (r.end < range.start || r.start > range.end) return; // 기간과 안 겹치면 제외
      const title = ev.summary || "";
      const hit = UPCOMING_INSIGHT_KEYWORDS.find(k => title.includes(k));
      if (hit) matched.push({ keyword: hit, title, startDate: r.start, endDate: r.end });
    });
    matched.sort((a, b) => a.startDate - b.startDate);
    return matched;
  }

  // 하루짜리는 "9/5", 여러 날에 걸치는 일정은 "9/5~9/9"처럼 범위로 표시해서 기간 전체가 눈에 보이게.
  function fmtEventDateSpan(m) {
    const pad2 = (mo, d) => `${mo + 1}/${d}`;
    const s = pad2(m.startDate.getMonth(), m.startDate.getDate());
    const sameDay = m.startDate.toDateString() === m.endDate.toDateString();
    if (sameDay) return s;
    return `${s}~${pad2(m.endDate.getMonth(), m.endDate.getDate())}`;
  }

  function buildUpcomingInsightText(matched) {
    if (!matched.length) return UPCOMING_EMPTY_TEXT;
    const names = matched.map(m => `${fmtEventDateSpan(m)} ${m.title}`).join(", ");
    return `차주엔 ${names}가 있어요.`;
  }

  // 일정끼리 붙어 보이지 않도록 이벤트 하나당 네모칸(칩) 하나로 렌더 — 텍스트는 buildUpcomingInsightText()와
  // 동일한 내용을 담되, 배지 안에서 각 이벤트가 시각적으로 구분되도록 DOM 노드로 조립.
  // 2026-09-11: 3개로 자르던 것 없앰 — 직접 선택 기능이 생기면서 4개 이상 골라도 전부 보여야 함.
  function buildUpcomingInsightNodes(matched) {
    const frag = document.createDocumentFragment();
    if (!matched.length) {
      frag.appendChild(document.createTextNode(UPCOMING_EMPTY_TEXT));
      return frag;
    }
    frag.appendChild(document.createTextNode("차주엔"));
    matched.forEach(m => {
      frag.appendChild(elText("span", "teamcal-insight-chip2", `${fmtEventDateSpan(m)} ${m.title}`));
    });
    frag.appendChild(document.createTextNode("일정이 있어요."));
    return frag;
  }

  // "차주엔~" 배지에 보여줄 일정을 자동(키워드) 대신 직접 체크박스로 골라 고정할 수 있는 기능
  // (2026-09-11). 이벤트 자체엔 안정적인 식별자가 없을 수 있어(백엔드가 id를 못 준 예외 상황),
  // id가 있으면 그걸 쓰고 없으면 "제목+시작시각" 조합을 대체 키로 쓴다.
  function upcomingEventKey(ev) {
    return ev.id || `${ev.title}|${ev.startDate.toISOString()}`;
  }

  // 앞으로 10일 범위 안에 있는 일정 전체(키워드 상관없이)를 가져옴 — 편집 패널의 체크리스트와
  // 자동/직접 선택 계산이 이 목록 하나를 공유한다.
  async function fetchUpcomingWindowEvents() {
    const range = upcomingInsightRange(new Date());
    const monthKeys = new Set([
      `${range.start.getFullYear()}-${range.start.getMonth() + 1}`,
      `${range.end.getFullYear()}-${range.end.getMonth() + 1}`,
    ]);
    const results = await Promise.all(Array.from(monthKeys).map(key => {
      const [y, m] = key.split("-").map(Number);
      return callBackend("teamCalendar", { year: y, month: m });
    }));
    const events = [];
    results.forEach(r => { if (r.ok) events.push(...(r.events || [])); });
    const inRange = [];
    events.forEach(ev => {
      const r = eventDateRange(ev);
      if (!r) return;
      if (r.end < range.start || r.start > range.end) return; // 기간과 안 겹치면 제외
      inRange.push({ id: ev.id || null, title: ev.summary || "", startDate: r.start, endDate: r.end });
    });
    inRange.sort((a, b) => a.startDate - b.startDate);
    return inRange;
  }

  let upcomingWindowEvents = []; // 앞으로 10일 안의 일정 전체(편집 패널용)
  let upcomingSelection = { mode: "auto", ids: [] }; // 백엔드에 저장된 현재 모드/선택
  let upcomingEditing = false;
  let upcomingLoaded = false;

  // 지금 배지에 실제로 보여줄 목록 — 'manual'이면 직접 고른 것만(그 중에서도 여전히 10일 범위
  // 안에 있는 것만, 날짜 지난 건 자동으로 빠짐), 'auto'면 기존처럼 키워드 매칭.
  function resolveUpcomingDisplayList() {
    if (upcomingSelection.mode === "manual") {
      const idSet = new Set(upcomingSelection.ids || []);
      return upcomingWindowEvents.filter(ev => idSet.has(upcomingEventKey(ev)));
    }
    return upcomingWindowEvents.filter(ev => UPCOMING_INSIGHT_KEYWORDS.some(k => ev.title.includes(k)));
  }

  async function loadWeeklyInsightBadge() {
    try {
      const [events, selRes] = await Promise.all([fetchUpcomingWindowEvents(), callBackend("upcomingSelection")]);
      upcomingWindowEvents = events;
      upcomingSelection = (selRes && selRes.ok && selRes.selection) ? selRes.selection : { mode: "auto", ids: [] };
      upcomingLoaded = true;
    } catch (err) {
      upcomingWindowEvents = [];
      upcomingLoaded = false;
    }
    renderUpcomingInsightArea();
  }

  async function saveUpcomingSelection(checkedKeys) {
    try {
      const res = await callBackend("saveUpcomingSelection", { mode: "manual", ids: JSON.stringify(checkedKeys) });
      if (!res.ok) throw new Error(res.message || res.error || "알 수 없는 오류");
    } catch (err) {
      alert("저장에 실패했어요: " + err.message);
      return;
    }
    upcomingEditing = false;
    await loadWeeklyInsightBadge();
  }

  async function resetUpcomingSelection() {
    try {
      const res = await callBackend("saveUpcomingSelection", { mode: "auto" });
      if (!res.ok) throw new Error(res.message || res.error || "알 수 없는 오류");
    } catch (err) {
      alert("되돌리기에 실패했어요: " + err.message);
      return;
    }
    upcomingEditing = false;
    await loadWeeklyInsightBadge();
  }

  function renderUpcomingEditPanel() {
    const panel = el("div", "teamcal-insight-panel2");
    panel.appendChild(elText("span", "insight-edit-label2", "차주 배지에 보여줄 일정 선택"));

    const preChecked = new Set(resolveUpcomingDisplayList().map(upcomingEventKey));
    const list = el("div", "teamcal-insight-checklist2");
    if (!upcomingWindowEvents.length) {
      list.appendChild(elText("p", "state-msg2", "앞으로 10일 안에 예정된 일정이 없어요."));
    } else {
      upcomingWindowEvents.forEach(ev => {
        const key = upcomingEventKey(ev);
        const label = el("label", "teamcal-insight-check-row2");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = key;
        cb.checked = preChecked.has(key);
        label.appendChild(cb);
        label.appendChild(elText("span", null, `${fmtEventDateSpan(ev)} ${ev.title}`));
        list.appendChild(label);
      });
    }
    panel.appendChild(list);

    const actions = el("div", "insight-edit-actions2");
    const saveBtn = elText("button", "insight-save-btn2", "저장");
    saveBtn.addEventListener("click", () => {
      const checked = Array.from(list.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.value);

  function eventDateRange(ev) {
    const s = ev.start && (ev.start.dateTime || ev.start.date);
    if (!s) return null;
    const isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
    const start = new Date(s);
    const eRaw = ev.end && (ev.end.dateTime || ev.end.date);
    let end = eRaw ? new Date(eRaw) : new Date(s);
    if (isAllDay) end = new Date(end.getTime() - 86400000); // end.date는 exclusive라 하루 뺌
    return { start, end, isAllDay };
  }

  function buildTeamCalWeeks(year, month, events) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, item) => { (byDay[day] = byDay[day] || []).push(item); };
    events.forEach(ev => {
      const range = eventDateRange(ev);
      if (!range) return;
      const title = ev.summary || "(제목 없음)";
      const timeLabel = range.isAllDay ? null : range.start.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
      let d = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
      const last = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
      let guard = 0;
      while (d <= last && guard < 366) {
        if (d.getFullYear() === year && d.getMonth() === month - 1) {
          push(d.getDate(), { title, time: timeLabel });
        }
        d.setDate(d.getDate() + 1);
        guard++;
      }
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dow: (firstDow + d - 1) % 7, entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  // ============================================================
  // 최상단 AI 인사이트 바 — 9월부터 하드코딩 대신, 이번 주 신규 실적 + 하반기 기여 상위 프로젝트를
  // 시트 데이터에서 자동으로 뽑아 문장으로 조합해서 보여줌(Apps Script "insight" 섹션 응답 사용).
  // 2026-09-11부터 KPI/AGENDA/트렌드와 같은 전체 주차 토글을 공유 — 과거 주차를 골라도 그 주차
  // 자신의 인사이트가 뜨고, "확정" 버튼으로 그 주차 화면 그대로를 고정해둘 수 있음.
  // ============================================================
  let insightData = null;
  let insightEditing = false; // 인사이트 문구 수동 수정

  function buildAutoInsightText(data) {
    if (!data || (!data.thisWeek.length && !data.topAnnual.length)) {
      return "데이터가 쌓이면 이번 주 신규 실적과 하반기 기여 상위 프로젝트를 자동으로 분석해서 보여드려요.";
    }
    const parts = [];
    if (data.thisWeek.length) {
      const items = data.thisWeek.map(w => `${w.project}(${fmtAmt(w.actual)}억)`).join(", ");
      parts.push(`${data.weekLabel} 신규 실적은 ${items}입니다.`);
    } else if (data.weekLabel) {
      parts.push(`${data.weekLabel}엔 새로 반영된 실적이 아직 없어요.`);
    }
    if (data.topAnnual.length) {
      const top = data.topAnnual.slice(0, 3).map(p => `${p.name}(${fmtAmt(p.amount)}억)`).join(", ");
      parts.push(`하반기 실적에 가장 큰 영향을 미치고 있는 프로젝트는 ${top} 순이에요.`);
    }
    return parts.join(" ");
  }

  // 사람이 저장해둔 수정본이 있으면(같은 주차일 때만 유효 — 백엔드에서 이미 주차 불일치 시 null로
  // 내려줌) 그걸 우선 보여주고, 없으면 AI 자동 분석 문구를 보여줌.
  function currentInsightText(data) {
    if (data && data.overrideText) return data.overrideText;
    return buildAutoInsightText(data);
  }

  function fmtEditedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())} 확정`;
  }

  // 빈 문자열을 넘기면(되돌리기 버튼) 백엔드가 확정 내용을 지우고 AI 자동 문구로 되돌림.
  // weekKey는 항상 "지금 화면에 뜬 주차" 기준 — 주차별로 독립 저장되므로 다른 주차로 넘어가도
  // 이 주차의 확정 내용은 그대로 유지된다.
  async function saveInsightEdit(text) {
    const trimmed = (text || "").trim();
    const weekKey = insightData ? insightData.weekKey : selectedWeekKey;
    try {
      const res = await callBackend("saveInsight", { text: trimmed, weekKey: weekKey || "" });

    } catch (err) { /* 캐시 갱신 실패해도 방금 저장은 이미 반영됐으니 무시 */ }

  // KPI/AGENDA/트렌드와 같은 by-week 패턴 — sectionCache.insight.byWeek[key]에서 그 주차 원본
  // 수치(thisWeek/topAnnual)와 확정본(overrideText)을 꺼내 렌더용 insightData로 조립.
  function loadInsightForWeek(key) {
    const entry = sectionCache.insight && sectionCache.insight.byWeek && sectionCache.insight.byWeek[key];
    if (!entry) {
      insightData = null;
    } else {
      insightData = {
        weekKey: key,
        weekLabel: weekLabel(entry, key),
        thisWeek: (entry.data && entry.data.thisWeek) || [],
        topAnnual: (entry.data && entry.data.topAnnual) || [],
        overrideText: entry.overrideText || null,
        overrideEditedAt: entry.overrideEditedAt || null,
      };

    insightEditing = false;
    renderInsightBar();

  // ============================================================
  // 전체 주차 토글 — KPI/팀 AGENDA/트렌드 리포트 3개 카드가 공유하는 단일 주차 선택
  // ============================================================
  const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  function weekOrder(monthAbbr, weekNum) { return MONTH_ABBR.indexOf(monthAbbr) * 100 + weekNum; }
  function krMonth(monthAbbr) { return MONTH_ABBR.indexOf(monthAbbr) + 1; }
  function weekLabel(entry, fallbackKey) {
    return entry ? `${krMonth(entry.monthAbbr)}월 ${entry.weekNum}주차` : (fallbackKey || "");
  }

  let GLOBAL_WEEKS = []; // [{key:"SEP_1", monthAbbr, weekNum, title}], 최신 순
  let selectedWeekKey = null;
  const sectionCache = { kpi: null, agenda: null, trend: null, insight: null };
  const globalWeekSelect = document.getElementById("globalWeekSelect");

  async function initGlobalWeeks() {
    // 로그인 검증 때 이미 kpi를 한 번 받았으면 그걸 재사용(중복 호출 방지, 리디자인 버그 4번).
    const kpiPromise = cachedKpiData ? Promise.resolve(cachedKpiData) : callBackend("kpi");
    cachedKpiData = null;
    const [kpiData, agendaData, trendData, insightData] = await Promise.all([
      kpiPromise, callBackend("agenda"), callBackend("trend"), callBackend("insight"),
    ]);
    if (!kpiData.ok) throw new Error(kpiData.message || kpiData.error || "알 수 없는 오류");
    sectionCache.kpi = kpiData;
    sectionCache.agenda = agendaData;
    sectionCache.trend = trendData;
    sectionCache.insight = insightData;
    KPI_GOAL = { goal: kpiData.goal, h2Goal: kpiData.h2Goal, goalBase: kpiData.goalBase, h2GoalBase: kpiData.h2GoalBase };

    // 네 섹션(KPI/AGENDA/트렌드/인사이트) 중 어느 하나라도 그 주차 시트가 있으면 토글에 포함 —
    // 월+주차 조합 키를 쓰기 때문에 다음 달 시트("SEP_1" 등)가 새로 생기면 코드 수정 없이
    // 자동으로 새 옵션이 나타난다.
    const keyMap = new Map();
    [kpiData, agendaData, trendData, insightData].forEach(d => {
      Object.keys(d.byWeek || {}).forEach(k => {
        const e = d.byWeek[k];
        keyMap.set(k, { monthAbbr: e.monthAbbr, weekNum: e.weekNum });
      });
    });
    GLOBAL_WEEKS = Array.from(keyMap.entries())
      .map(([key, v]) => ({ key, monthAbbr: v.monthAbbr, weekNum: v.weekNum, title: `${krMonth(v.monthAbbr)}월 ${v.weekNum}주차` }))
      .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
  }

  function renderGlobalWeekOptions() {
    globalWeekSelect.innerHTML = "";
    GLOBAL_WEEKS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w.key;
      opt.textContent = w.title;
      globalWeekSelect.appendChild(opt);
    });
  }

  function findDefaultWeekKey() {
    const kpiData = sectionCache.kpi;
    if (kpiData) {
      const sorted = Object.keys(kpiData.byWeek || {})
        .map(k => kpiData.byWeek[k])
        .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
      for (const e of sorted) {
        if (e.data && e.data.annual && !isNaN(e.data.annual.actual)) return `${e.monthAbbr}_${e.weekNum}`;
      }
    }
    return GLOBAL_WEEKS.length ? GLOBAL_WEEKS[0].key : null;
  }

    if (key == null) return;
    selectedWeekKey = key;
    globalWeekSelect.value = key;

    loadInsightForWeek(key);

  // ============================================================
  // 로딩 진행률 오버레이 — 7개 섹션이 각자 다른 속도로 채워지는 동안 "뭘 기다리는지"

  const DB_READ_ACTIONS = new Set(["meta", "list", "adminCheck"]);
  async function callDb(action, payload) {
    const body = JSON.stringify(Object.assign({}, payload || {}, COLLAB.adminPw ? { adminPw: COLLAB.adminPw } : {}));
    const canRetry = err => (DB_READ_ACTIONS.has(action) ? TRANSIENT_RE : PRE_EXEC_RE).test(err.message);
    const res = await withRetry(() => gsRun("dbApi", action, storedPw(), COLLAB.user, body).then(text => JSON.parse(text)), canRetry);
    if (res && res.error === "unknown_user") { // 퇴사 처리 등으로 명단에서 빠진 이름이면 다시 선택
      alert(res.message || "팀원 명단에 없는 이름입니다. 이름을 다시 골라 주세요.");

    }
    if (res && res.error === "busy" && !res.message) res.message = "다른 분이 큰 작업을 하고 있어요. 잠시 후 다시 시도해 주세요.";
    return res;
  }
  function tableDef(key) { return COLLAB.meta.tables.find(t => t.key === key); }
  function colDef(table, key) { return tableDef(table).cols.find(c => c.key === key); }

  function fmtNum(v) { return typeof v === "number" ? v.toLocaleString("ko-KR") : (v == null ? "" : String(v)); }

  function cellText(table, key, v) {
    if (v === "" || v == null) return "";
    if (key === "week") return weekTitle(v);
    if (key === "weight") return Math.round(v * 100) + "%";
    if (["amount", "kpiKrw", "weighted", "paidKrw", "rate"].includes(key)) return fmtNum(v);
    return String(v);
  }

  // ---------------- 탭 바 · 사용자 ----------------
  function setupCollabShell() {
    const header = document.querySelector(".dash-header2");
    const bar = el("nav", "app-tabs2");
    bar.id = "appTabs";
    [{ key: "dashboard", title: "대시보드" }].concat(DATA_VIEWS).forEach(v => {
      const b = elText("button", "app-tab2" + (v.key === "dashboard" ? " active2" : ""), v.title);
      b.type = "button"; b.dataset.view = v.key;
      b.addEventListener("click", () => switchView(v.key));
      bar.appendChild(b);
    });
    const userBtn = el("button", "user-chip2");
    userBtn.type = "button"; userBtn.id = "userChip";
    userBtn.addEventListener("click", () => openUserPicker(true));
    const yearSel = document.createElement("select");
    yearSel.className = "year-select2"; yearSel.id = "yearSelect"; yearSel.title = "보는 연도";
    yearSel.addEventListener("change", () => changeViewYear(parseInt(yearSel.value, 10)));
    bar.appendChild(yearSel);
    const adminBtn = el("button", "admin-chip2");
    adminBtn.type = "button"; adminBtn.id = "adminChip";
    adminBtn.addEventListener("click", () => (isAdminMode() ? exitAdminMode() : openAdminLogin()));
    bar.appendChild(adminBtn);
    bar.appendChild(userBtn);
    header.after(bar);
    const dash = el("div", null); dash.id = "dashView";
    const insight = document.getElementById("insightSlot");
    insight.before(dash);
    const alertSlot = el("div", null); alertSlot.id = "adminAlertSlot";
    dash.appendChild(alertSlot);
    dash.appendChild(insight);
    dash.appendChild(document.getElementById("sectionsRoot"));
    const data = el("div", null); data.id = "dataView"; data.hidden = true;
    dash.after(data);
    updateUserChip();
  }
  function updateAdminChip() {
    if (COLLAB.rows && COLLAB.rows.deals) setTimeout(() => renderAdminAlerts(COLLAB.rows.deals), 0);
    const chip = document.getElementById("adminChip");
    if (!chip) return;
    chip.textContent = isAdminMode() ? "\u{1F513} 관리자 모드 (끄기)" : "\u{1F512} 관리자 모드";
    chip.classList.toggle("on2", isAdminMode());
    document.body.classList.toggle("admin-mode2", isAdminMode());
  }
  function renderYearOptions() {
    const sel = document.getElementById("yearSelect");
    if (!sel || !COLLAB.meta) return;
    const years = (COLLAB.meta.years && COLLAB.meta.years.length ? COLLAB.meta.years : [PLATFORM_UI.general.year]).slice();
    if (!years.includes(CFG_YEAR)) years.push(CFG_YEAR);
    sel.innerHTML = "";
    years.sort((a, b) => b - a).forEach(y => sel.appendChild(new Option(y + "년" + (y === COLLAB.meta.operatingYear ? " (운영)" : " (조회)"), y)));
    sel.value = String(CFG_YEAR);
  }
  // 지난 연도는 조회용: 대시보드·입력 탭 모두 그 해 데이터로 바뀜(입력은 각 레코드의 연도 칸 기준)
  function changeViewYear(y) {
    CFG_YEAR = y;
    selectedWeekKey = null;
    Object.keys(COLLAB.filters).forEach(k => { COLLAB.filters[k].year = String(y); COLLAB.filters[k].week = ""; });
    if (COLLAB.view === "dashboard") loadAll(); else { COLLAB.dashDirty = true; renderDataView(COLLAB.view); }
  }
  function openAdminLogin(opts) {
    opts = opts || {};
    const m = openModal("관리자 모드", true, false, opts.onCancel || null);
    m.body.appendChild(elText("p", "modal-desc2", "관리자 비밀번호를 입력하면 이 창에서 KPI 목표·고정환율, 실적 반영(기준 선택·ON/OFF), 엑셀 업로드, 팀원, 기준 정보(운영 연도·진행 단계)를 바꿀 수 있습니다. 5회 틀리면 30분 잠깁니다."));
    const row = el("div", "user-free2");
    const input = document.createElement("input");
    input.type = "password"; input.placeholder = "관리자 비밀번호"; input.autocomplete = "current-password";
    const ok = elText("button", "btn-primary2", "확인"); ok.type = "button";
    const msg = el("p", "err2");
    ok.addEventListener("click", async () => {
      msg.textContent = "확인 중…";
      COLLAB.adminPw = input.value;
      const res = await callDb("adminCheck");
      if (!res.ok) { COLLAB.adminPw = ""; msg.textContent = res.message || "관리자 비밀번호가 틀렸습니다."; return; }
      try { sessionStorage.setItem("dashAdminPw", COLLAB.adminPw); } catch (e) {}
      m.close();
      ensureAdminUser();
      updateAdminChip();
      if (opts.onSuccess) opts.onSuccess();
      if (COLLAB.view !== "dashboard") renderDataView(COLLAB.view);
    });
    input.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });
    row.append(input, ok);
    m.body.append(row, msg);
    setTimeout(() => input.focus(), 50);
  }
  // 관리자 모드인데 이름이 없거나(명단 미등록) 명단에 없으면 임시 이름 '관리자'로 작업(저장 기록에 '관리자'로 남음, 브라우저에 기억하지 않음)
  const ADMIN_TEMP_USER = "관리자";
  function ensureAdminUser() {
    if (isAdminMode() && !rememberedUserValid(COLLAB.user)) { COLLAB.user = ADMIN_TEMP_USER; updateUserChip(); }
  }
  function exitAdminMode() {
    COLLAB.adminPw = "";
    try { sessionStorage.removeItem("dashAdminPw"); } catch (e) {}
    if (COLLAB.user === ADMIN_TEMP_USER && !rememberedUserValid(ADMIN_TEMP_USER)) { COLLAB.user = ""; updateUserChip(); openUserPicker(false); }
    updateAdminChip();
    if (COLLAB.view !== "dashboard") renderDataView(COLLAB.view);
  }
  function updateUserChip() {
    const chip = document.getElementById("userChip");
    if (chip) chip.textContent = "\u{1F464} " + (COLLAB.user || "이름 선택");
  }
  function switchView(key) {
    if (COLLAB.view === "deals" && key !== "deals" && COLLAB.kpiPending && COLLAB.kpiPending.size &&
      !confirm(`사업 원장에 반영 전 변경 ${COLLAB.kpiPending.size}건이 있어요. [일괄 반영]을 누르지 않으면 저장되지 않습니다.\n그래도 이동할까요? (변경 내용은 이 창을 닫기 전까지 유지)`)) return;
    COLLAB.view = key;
    document.querySelectorAll(".app-tab2").forEach(b => b.classList.toggle("active2", b.dataset.view === key));
    const isDash = key === "dashboard";
    document.getElementById("dashView").hidden = !isDash;
    document.getElementById("dataView").hidden = isDash;
    document.querySelectorAll(".header-actions2 label[for=globalWeekSelect], #globalWeekSelect").forEach(n => { n.style.visibility = isDash ? "" : "hidden"; });
    if (isDash) {
      if (COLLAB.dashDirty) { COLLAB.dashDirty = false; loadAll(); }
      return;
    }
    renderDataView(key);
  }

  async function initCollab() {
    setupCollabShell();
    try {
      const meta = await callDb("meta");
      if (!meta.ok) throw new Error(meta.message || meta.error);
      COLLAB.meta = meta;
    } catch (err) {
      COLLAB.meta = { ready: false, error: err.message };
    }
    let remembered = "";
    try { remembered = localStorage.getItem("dashUser") || ""; } catch (e) {}
    COLLAB.user = rememberedUserValid(remembered) ? remembered : ""; // 이 브라우저에서 고른 이름이 지금 명단에 있으면 자동 인식(퇴사 등으로 빠졌으면 다시 선택)
    // 같은 창에서 새로고침해도 관리자 모드 유지(창을 닫으면 해제)
    try {
      const saved = sessionStorage.getItem("dashAdminPw") || "";
      if (saved) { COLLAB.adminPw = saved; const chk = await callDb("adminCheck"); if (!chk.ok) { COLLAB.adminPw = ""; sessionStorage.removeItem("dashAdminPw"); } }
    } catch (e) {}
    updateUserChip();
    updateAdminChip();
    renderYearOptions();
    ensureAdminUser();
    if (!COLLAB.meta.error && !COLLAB.user) openUserPicker(false); // 첫 입장: 이름 선택(저장·승인 기록의 작성자)
  }

  // 등록된(사용 중) 팀원 이름인지. 명단이 아직 비어 있으면(최초 설정) 어떤 이름이든 허용.
  function rememberedUserValid(name) {
    if (!name) return false;
    const members = (COLLAB.meta && COLLAB.meta.members) || [];
    return !members.length || members.some(mb => mb.name === name);
  }
  // 이름 선택: 팀원 탭에 '사용'으로 등록된 사람만 고를 수 있음(직접 입력 없음). 명단이 비어 있을 때만 직접 입력.
  function openUserPicker(closable) {
    const members = (COLLAB.meta && COLLAB.meta.members) || [];
    const m = openModal("이름 선택", closable, members.length > 12);
    let recent = "";
    try { recent = localStorage.getItem("dashUser") || ""; } catch (e) {}
    if (!members.length) {
      m.body.appendChild(elText("p", "modal-desc2", "아직 팀원 명단이 없어 이름을 직접 입력합니다. 관리자 모드 → 팀원 탭에서 명단을 등록하면, 그 뒤로는 등록된 사람만 이름을 골라 들어올 수 있어요."));
      const row = el("div", "user-free2");
      const input = document.createElement("input");
      input.type = "text"; input.placeholder = "이름 입력"; input.maxLength = 20;
      const ok = elText("button", "btn-primary2", "확인"); ok.type = "button";
      ok.addEventListener("click", () => { if (input.value.trim()) { setUser(input.value.trim()); m.close(); } });
      input.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });
      row.append(input, ok);
      m.body.appendChild(row);
      setTimeout(() => input.focus(), 50);
      return;
    }
    m.body.appendChild(elText("p", "modal-desc2", "본인 이름을 골라 주세요. 저장한 내용에 작성자로 표시되고, 이 브라우저에서는 다음 접속부터 자동으로 인식됩니다. 이름이 없으면 관리자에게 팀원 등록을 요청해 주세요."));
    const pick = name => { setUser(name); m.close(); };
    let search = null;
    if (members.length > 12) {
      search = document.createElement("input");
      search.type = "search"; search.className = "data-search2 user-search2"; search.placeholder = "이름 검색";
      m.body.appendChild(search);
    }
    const wrap = el("div", "user-groups2");
    const button = (mb, cls, label) => { const b = elText("button", "user-pick2" + (cls ? " " + cls : ""), label); b.type = "button"; b.addEventListener("click", () => pick(mb.name)); return b; };
    const draw = () => {
      wrap.innerHTML = "";
      const q = search ? search.value.trim() : "";
      const shown = members.filter(mb => !q || mb.name.includes(q) || String(mb.part || "").includes(q));
      const rec = recent && shown.find(x => x.name === recent);
      if (rec) {
        const g = el("div", "user-grid2"); g.appendChild(button(rec, "recent2", rec.name + (rec.part ? " · " + rec.part : "")));
        wrap.append(elText("div", "user-part2", "최근 사용"), g);
      }
      Array.from(new Set(shown.map(mb => mb.part || "기타"))).forEach(pt => {
        const g = el("div", "user-grid2");
        shown.filter(mb => (mb.part || "기타") === pt).forEach(mb => g.appendChild(button(mb, "", mb.name)));
        wrap.append(elText("div", "user-part2", pt), g);
      });
      if (!shown.length) wrap.appendChild(elText("p", "state-msg2", "검색 결과가 없어요."));
    };
    if (search) search.addEventListener("input", draw);
    draw();
    m.body.appendChild(wrap);
    if (!isAdminMode()) {
      const adm = el("div", "user-admin2");
      adm.appendChild(elText("span", null, "관리자이신가요? 명단에 이름이 없어도 관리자 비밀번호로 들어가 팀원을 등록할 수 있어요."));
      const go = elText("button", "btn-line2", "\u{1F512} 관리자 모드로 시작"); go.type = "button";
      go.addEventListener("click", () => { m.close(); openAdminLogin({ onCancel: () => { if (!COLLAB.user) openUserPicker(false); } }); });
      adm.appendChild(go);
      m.body.appendChild(adm);
    }
    setTimeout(() => { const f = search || wrap.querySelector("button"); if (f) f.focus(); }, 50);
  }
  function setUser(name) {
    COLLAB.user = name;
    try { if (name) localStorage.setItem("dashUser", name); } catch (e) {}
    updateUserChip();
    if (name) setTimeout(() => (COLLAB.rows && COLLAB.rows.deals ? renderAdminAlerts(COLLAB.rows.deals) : loadAdminAlerts()), 0); // 이름이 정해진 뒤 관리자 알림
  }

  // ---------------- 모달 ----------------
  function openModal(title, closable = true, wide = false, onDismiss = null) {
    const back = el("div", "modal-back2");
    const box = el("div", "modal-box2" + (wide ? " wide2" : ""));
    const head = el("div", "modal-head2");
    head.appendChild(elText("h3", null, title));
    const close = () => back.remove();
    const dismiss = () => { close(); if (onDismiss) onDismiss(); }; // ×·바깥 클릭으로 닫을 때만
    if (closable) {
      const x = elText("button", "modal-x2", "×"); x.type = "button";
      x.addEventListener("click", dismiss);
      head.appendChild(x);
      back.addEventListener("click", e => { if (e.target === back) dismiss(); });
    }
    const body = el("div", "modal-body2");
    box.append(head, body);
    back.appendChild(box);
    document.body.appendChild(back);
    return { back, box, body, close };
  }

  // ---------------- 데이터 탭 ----------------
  async function renderDataView(viewKey) {
    const host = document.getElementById("dataView");
    const view = DATA_VIEWS.find(v => v.key === viewKey);
    host.innerHTML = "";
    const card = sectionShell(false, "data-card2");
    const head = el("div", "dashsec-head");
    const left = el("div", "kicker-left");
    left.appendChild(elText("span", "dashsec-num", "DATA"));
    left.appendChild(elText("h2", null, view.title));
    head.appendChild(left);
    card.appendChild(head);
    card.appendChild(elText("p", "data-desc2", view.desc));
    host.appendChild(card);
    if (!COLLAB.meta || !COLLAB.meta.ready) {
      if (COLLAB.meta && COLLAB.meta.error) { card.appendChild(elText("p", "state-msg2 err2", "협업 DB에 연결하지 못했어요: " + COLLAB.meta.error)); return; }
      card.appendChild(renderStartBox());
      return;
    }
    if (viewKey === "settings") { card.appendChild(renderSettingsView()); return; }
    if (viewKey === "kpi") { const fxBox = el("div", "fx-panel2"); card.appendChild(fxBox); renderFxPanel(fxBox); }
    for (const t of view.tables) {
      const section = el("div", "data-table-block2");
      card.appendChild(section);
      await renderTableBlock(section, t, view.tables.length > 1);
    }
  }

  // 팀원 여러 명을 표에 적고 한 번에 저장(관리자). 이미 있는 이름은 건너뜀.
  function openMembersBulk(existing, onDone) {
    const m = openModal("팀원 여러 명 추가", true, true);
    m.body.appendChild(elText("p", "modal-desc2", "한 줄에 한 명씩 입력하고 [모두 저장]을 누르세요. 이름이 빈 줄은 무시하고, 이미 등록된 이름은 건너뜁니다."));
    const have = new Set((existing || []).map(r => String(r.name).trim()));
    const t = el("table", "data-table2 bulk-table2");
    const hr = el("tr", null);
    ["이름 *", "파트", "역할", "사용여부", "비고"].forEach(h => hr.appendChild(elText("th", null, h)));
    const thead = el("thead", null); thead.appendChild(hr); t.appendChild(thead);
    const tbody = el("tbody", null); t.appendChild(tbody);
    const partEx = exampleFor("members", "part") || "예) 광고";
    const addRow = () => {
      const tr = el("tr", "bulk-row2");
      const mk = (key, ph) => { const td = el("td", null); const i = document.createElement("input"); i.type = "text"; i.dataset.k = key; i.placeholder = ph || ""; td.appendChild(i); tr.appendChild(td); return i; };
      const sel = (key, opts) => { const td = el("td", null); const s2 = document.createElement("select"); s2.dataset.k = key; opts.forEach(o => s2.appendChild(new Option(o, o))); td.appendChild(s2); tr.appendChild(td); return s2; };
      const name = mk("name", "예) 홍길동");
      mk("part", partEx);
      sel("role", codeNames("roles").length ? codeNames("roles") : ["팀원", "관리자"]);
      sel("active", codeNames("activeFlags").length ? codeNames("activeFlags") : ["사용", "중지"]);
      mk("note", "");
      name.addEventListener("input", () => { const dup = have.has(name.value.trim()); name.parentNode.classList.toggle("dup2", dup); name.title = dup ? "이미 등록된 이름(건너뜀)" : ""; });
      tbody.appendChild(tr);
      return name;
    };
    for (let i = 0; i < 5; i++) addRow();
    const wrap = el("div", "data-table-wrap2"); wrap.appendChild(t);
    m.body.appendChild(wrap);
    const msg = el("div", "form-msg2");
    const actions = el("div", "form-actions2");
    const more = elText("button", "btn-line2", "＋ 줄 추가"); more.type = "button";
    more.addEventListener("click", () => addRow().focus());
    const save = elText("button", "btn-primary2", "모두 저장"); save.type = "button";
    const cancel = elText("button", "btn-line2", "닫기"); cancel.type = "button"; cancel.addEventListener("click", m.close);
    save.addEventListener("click", async () => {
      if (!COLLAB.user) { openUserPicker(false); return; }
      const records = Array.from(tbody.querySelectorAll("tr")).map(tr => { const o = {}; tr.querySelectorAll("[data-k]").forEach(i => { o[i.dataset.k] = i.value; }); return o; }).filter(r => r.name.trim());
      if (!records.length) { msg.textContent = "이름을 한 명 이상 입력해 주세요."; return; }
      save.disabled = true; save.textContent = "저장 중…";
      let res;
      try { res = await callDb("addMembers", { records }); } catch (e) { res = { ok: false, message: e.message }; }
      save.disabled = false; save.textContent = "모두 저장";
      if (!res.ok) { msg.textContent = "저장 실패: " + (res.message || res.error); return; }
      await refreshMeta();
      COLLAB.dashDirty = true;
      m.body.innerHTML = "";
      const box = el("div", "import-done2");
      box.appendChild(elText("p", "ok-big2", `✅ 저장 완료 — 신규 ${res.added.length}명` + (res.skipped.length ? ` · 이미 있음 ${res.skipped.length}명` : "")));
      if (res.added.length) box.appendChild(elText("p", "modal-desc2", "추가: " + res.added.join(", ") + " — 이름 선택 목록에도 바로 반영됐어요."));
      if (res.skipped.length) box.appendChild(elText("p", "modal-desc2", "건너뜀(이미 등록): " + res.skipped.join(", ")));
      if (res.errors.length) box.appendChild(elText("p", "err2", "저장 못 함: " + res.errors.join(" / ")));
      m.body.appendChild(box);
      const a2 = el("div", "form-actions2");
      const ok = elText("button", "btn-primary2", "확인"); ok.type = "button";
      ok.addEventListener("click", () => { m.close(); onDone && onDone(); });
      a2.appendChild(ok); m.body.appendChild(a2);
      onDone && onDone();
    });
    actions.append(save, more, cancel);
    m.body.append(msg, actions);
    setTimeout(() => { const f = tbody.querySelector("input"); f && f.focus(); }, 50);
  }

  // KPI 고정환율 입력판: 연도를 고르고 통화별 환율을 한 번에 입력·저장(관리자 모드). 저장하면 사업 원장 KPI 금액이 다시 계산됨.
  async function renderFxPanel(box) {
    box.innerHTML = "";
    const admin = isAdminMode();
    const head = el("div", "fx-head2");
    head.appendChild(elText("h3", "data-table-title2", "KPI 고정환율"));
    const yearSel = document.createElement("select"); yearSel.className = "data-filter2";
    const years = Array.from(new Set([CFG_YEAR, COLLAB.meta.operatingYear, COLLAB.meta.operatingYear + 1].concat(COLLAB.meta.years || []))).sort((a, b) => b - a);
    years.forEach(y => yearSel.appendChild(new Option(y + "년", y)));
    yearSel.value = String(box.dataset.year || CFG_YEAR);
    yearSel.addEventListener("change", () => { box.dataset.year = yearSel.value; renderFxPanel(box); });

  async function loadRows(table, force) {
    if (!force && COLLAB.rows[table]) return COLLAB.rows[table];
    const res = await callDb("list", { table });
    if (!res.ok) throw new Error(res.message || res.error);
    COLLAB.rows[table] = res.rows;
    return res.rows;
  }

  function defaultFilters(table) {
    const f = COLLAB.filters[table] || (COLLAB.filters[table] = { q: "", year: String(CFG_YEAR), week: "", part: "", stage: "" });
    if ((table === "agenda" || table === "trend") && !f.week) f.week = COLLAB.meta.currentWeek;
    return f;
  }

  function filteredRows(table, rows) {
    const f = defaultFilters(table);
    const q = f.q.trim().toLowerCase();
    return rows.filter(r => {
      if (f.year && r.year !== undefined && r.year !== "" && String(r.year) !== f.year && table !== "log" && table !== "members") return false;
      if (f.week && r.week !== undefined && r.week !== f.week) return false;
      if (f.part && r.part !== f.part) return false;
      if (f.stage && r.stage !== f.stage) return false;
      if (f.approval && r.approval !== f.approval) return false;
      if (f.todo && table === "deals") {
        if (f.todo === "관리자 확인") { if (!needsAdminCheck(r)) return false; }
        else { const need = dealTodos(r).some(x => x.who === "작성자"); if ((f.todo === "확인 필요") !== need) return false; }
      }
      if (q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
      return true;
    });
  }

  async function renderTableBlock(section, table, showTitle) {

    section.innerHTML = "";

    section.appendChild(tableWrap);
    tableWrap.appendChild(elText("p", "state-msg2", "불러오는 중…"));
    let rows;
    try { rows = await loadRows(table, true); } catch (err) {
      tableWrap.innerHTML = ""; tableWrap.appendChild(elText("p", "state-msg2 err2", "불러오지 못했어요: " + err.message)); return;
    }
    const f = defaultFilters(table);
    const rerender = () => renderTableBlock(section, table, showTitle);
    const redraw = () => drawTable(tableWrap, summary, table, rows);

    // 필터
    const search = document.createElement("input");

    search.addEventListener("input", () => { f.q = search.value; redraw(); });

      bis.title = "광고팀: BIS 매출현황·진행현황 엑셀을 함께 올리면 확정/진행 기준으로 대조해 반영";

      up.addEventListener("click", () => pickExcel(table, rerender));

    if (table === "deals" && isAdminMode()) {
      const appr = elText("button", "btn-approve2", "확정 건 전체 실적 반영 ON"); appr.type = "button";

    // 선택(관리자 모드 · 사업 원장): 체크한 건 일괄 삭제

        if (table === "deals" && VIRTUAL_COLS[k]) { const td = el("td", "v-" + k + "2"); if (k === "kpiWhen" && COLLAB.user) td.dataset.editable = "1"; if (k === "counted" && pendOf(r)) td.classList.add("stale2"); dealVirtualCell(td, k, r); tr.appendChild(td); return; }

  // ---------------- 입력 양식 ----------------
  function newRecordDefaults(table) {
    const f = defaultFilters(table);
    const year = COLLAB.meta.operatingYear || COLLAB.meta.year;
    if (table === "deals") return { part: "광고", year, stage: codeNames("stages")[0], cur: "KRW", ctype: "신규계약" };
    if (table === "agenda") return { year, week: f.week || COLLAB.meta.currentWeek, kind: "WIN" };
    if (table === "trend") return { year, week: f.week || COLLAB.meta.currentWeek, kind: "외부" };
    if (table === "kpiGoals") return { year, part: "전체", period: "연간" };
    if (table === "fx") return { year, unit: 1 };
    if (table === "members") return { role: "팀원", active: "사용" };

  }

  // ---- KPI 인정 시기 · 실적 반영 · 기준: 목록에서 고친 뒤 [일괄 반영]으로 한 번에 저장 ----
  function kpiPend() { return COLLAB.kpiPending || (COLLAB.kpiPending = new Map()); }
  function pendOf(r) { return kpiPend().get(r.id) || null; }
  function setPend(r, key, value, original) {
    const m = kpiPend();
    const p = m.get(r.id) || { id: r.id, baseUpdatedAt: r.updatedAt || "" };
    if (String(value) === String(original)) delete p[key]; else p[key] = value;
    if (Object.keys(p).some(k => !["id", "baseUpdatedAt"].includes(k))) m.set(r.id, p); else m.delete(r.id);
    if (COLLAB.onPendChange) COLLAB.onPendChange();
  }
  function autoHalfOf(r) { const m = /^(\d{4})-(\d{2})/.exec(String(r.startDate || "")); return m ? (Number(m[2]) <= 6 ? "상반기" : "하반기") : ""; }
  function effApproval(r) { const p = pendOf(r); return p && p.approval !== undefined ? p.approval : r.approval; }
  function effBasis(r) { const p = pendOf(r); const b = p && p.kpiBasis !== undefined ? p.kpiBasis : r.kpiBasis; return b === "실입금액" || b === "확정 금액" ? b : "KPI 고정환율"; }
  function kpiWhenSelect(r) {
    const p = pendOf(r) || {};
    const year = Number(p.year !== undefined ? p.year : r.year) || (COLLAB.meta.operatingYear || CFG_YEAR);
    const half = p.kpiHalfManual !== undefined ? p.kpiHalfManual : (r.kpiHalfManual || "");
    const sel = document.createElement("select");
    sel.className = "kpi-when-sel2" + (p.year !== undefined || p.kpiHalfManual !== undefined ? " pend2" : "");
    sel.title = "KPI 인정 시기 — 바꾼 뒤 [일괄 반영]을 눌러야 저장됩니다";
    const op = COLLAB.meta.operatingYear || CFG_YEAR;
    const years = Array.from(new Set([op - 1, op, op + 1, Number(r.year) || op, year])).sort((a, b) => a - b);
    const ah = autoHalfOf(r);
    years.forEach(y => {
      sel.appendChild(new Option(`${y} 자동(${ah || "시작일 미정"})`, `${y}|`));
      sel.appendChild(new Option(`${y} 상반기`, `${y}|상반기`));
      sel.appendChild(new Option(`${y} 하반기`, `${y}|하반기`));
    });
    sel.value = `${year}|${half}`;
    sel.addEventListener("click", e => e.stopPropagation());
    sel.addEventListener("change", e => {
      e.stopPropagation();
      if (!COLLAB.user) { openUserPicker(false); return; }
      const [y, h] = sel.value.split("|");
      setPend(r, "year", Number(y), Number(r.year) || op);
      setPend(r, "kpiHalfManual", h, r.kpiHalfManual || "");
      const q = pendOf(r) || {};
      sel.classList.toggle("pend2", q.year !== undefined || q.kpiHalfManual !== undefined);
    });
    return sel;
  }
  function pendBar(rerender) {
    const bar = el("div", "pend-bar2");
    const paint = () => {
      const n = kpiPend().size;
      bar.hidden = !n; bar.innerHTML = "";
      if (!n) return;
      bar.appendChild(elText("b", null, `반영 전 변경 ${n}건`));
      bar.appendChild(elText("span", null, " · KPI 인정 시기·실적 반영·기준을 고친 건입니다. [일괄 반영]을 눌러야 저장돼요."));
      const go = elText("button", "btn-primary2 small2", "일괄 반영"); go.type = "button";
      const undo = elText("button", "btn-line2 small2", "되돌리기"); undo.type = "button";
      go.addEventListener("click", async () => {
        go.disabled = undo.disabled = true; go.textContent = "반영 중…";
        const changes = Array.from(kpiPend().values());
        let res;
        try { res = await callDb("bulkKpi", { changes }); } catch (err) { res = { ok: false, message: err.message }; }
        if (!res.ok) { alert("반영 실패: " + (res.message || res.error) + "\n(변경 내용은 그대로 남아 있어요)"); go.disabled = undo.disabled = false; go.textContent = "일괄 반영"; return; }
        kpiPend().clear(); COLLAB.dashDirty = true;
        alert(`${res.done}건 반영했습니다.` + (res.approvalReset ? `\n실적 반영 ON이던 ${res.approvalReset}건은 시기가 바뀌어 '승인 대기'로 돌아갔어요(관리자 확인 필요).` : "") + (res.skipped && res.skipped.length ? `\n\n반영하지 못한 ${res.skipped.length}건:\n` + res.skipped.slice(0, 12).join("\n") : ""));
        rerender();
      });
      undo.addEventListener("click", () => { if (!confirm(`반영 전 변경 ${n}건을 모두 되돌릴까요?`)) return; kpiPend().clear(); rerender(); });
      bar.append(go, undo);
    };
    COLLAB.onPendChange = paint;
    paint();
    return bar;
  }
  window.addEventListener("beforeunload", e => { if (COLLAB.kpiPending && COLLAB.kpiPending.size) { e.preventDefault(); e.returnValue = ""; } });

  // 실적 반영 토글(관리자) — 켜면 KPI 실적으로 집계, 끄면 제외. 기존 'KPI 승인'과 같은 값(승인/승인 대기)을 씀.
  function countSwitch(r, onDone) {
    const on = r.approval === "승인";
    const sw = el("button", "switch2" + (on ? " on2" : ""));
    sw.type = "button"; sw.setAttribute("role", "switch"); sw.setAttribute("aria-checked", on ? "true" : "false");
    sw.title = on ? "실적 반영 중 — 누르면 끔" : "실적 미반영 — 누르면 켬";
    sw.appendChild(el("span", "knob2"));
    sw.appendChild(elText("span", "switch-label2", on ? "ON" : "OFF"));
    sw.addEventListener("click", async e => {
      e.stopPropagation();
      if (!COLLAB.user) { openUserPicker(false); return; }
      sw.disabled = true;
      const res = await callDb("approve", { ids: [r.id], approve: !on });
      sw.disabled = false;
      if (!res.ok) { alert("실패: " + (res.message || res.error)); return; }
      if (res.skipped && res.skipped.length) { alert("실적 반영을 켤 수 없어요:\n" + res.skipped.join("\n")); return; }
      COLLAB.dashDirty = true; onDone && onDone();
    });
    return sw;
  }
  function basisSelect(r, onDone) {
    const sel = document.createElement("select");
    sel.className = "basis-select2";
    sel.title = "실적 인정 기준";
    [["KPI 고정환율", "고정환율 기준"], ["실입금액", "실입금액 기준"], ["확정 금액", "확정 금액 기준"]].forEach(([v, t]) => sel.appendChild(new Option(t, v)));
    sel.value = r.kpiBasis === "실입금액" || r.kpiBasis === "확정 금액" ? r.kpiBasis : "KPI 고정환율";
    sel.addEventListener("click", e => e.stopPropagation());
    sel.addEventListener("change", async e => {
      e.stopPropagation();
      if (!COLLAB.user) { openUserPicker(false); return; }
      sel.disabled = true;
      const res = await callDb("setBasis", { ids: [r.id], basis: sel.value });
      sel.disabled = false;
      if (!res.ok) { alert("실패: " + (res.message || res.error)); return; }
      COLLAB.dashDirty = true; onDone && onDone();
    });
    return sel;
  }
  // 사업 원장 목록의 계산 칸: 실입금(3단계) · 계약기간 · KPI 인정 시기 · 인정 실적
  const VIRTUAL_COLS = { todo: "다음 할 일", paid: "실입금", period: "계약기간", kpiWhen: "KPI 인정 시기", counted: "인정 실적(KRW)" };

    }

      if (!wide) return;
      const headRow = table.querySelector("thead tr");
      if (!headRow) return;
      let left = 0;
      Array.from(headRow.children).slice(0, freezeCount).forEach((th, i) => {
        const w = th.getBoundingClientRect().width;
        table.querySelectorAll(`tr > :nth-child(${i + 1})`).forEach(c => { c.classList.add("freeze2"); c.style.left = left + "px"; });

      const n = headRow.children.length;
      let right = 0;

  let xlsxLoading = null;
  const XLSX_SOURCES = [
    ["cdnjs", "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"],
    ["jsDelivr", "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"],
    ["unpkg", "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"],
  ];
  function loadXlsx(onStatus) {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxLoading) xlsxLoading = (async () => {
      const tried = [];
      for (const [name, url] of XLSX_SOURCES) {
        if (onStatus) onStatus(`엑셀 도구 불러오는 중 (${name})…`);
        const ok = await new Promise(resolve => {
          const sc = document.createElement("script");
          let settled = false;
          const fin = v => { if (!settled) { settled = true; clearTimeout(t); resolve(v); } };
          const t = setTimeout(() => fin(false), 15000);
          sc.src = url;
          sc.onload = () => fin(!!window.XLSX);
          sc.onerror = () => fin(false);
          document.head.appendChild(sc);
        });
        if (ok && window.XLSX) return window.XLSX;
        tried.push(name);
      }
      xlsxLoading = null;
      throw new Error("엑셀 도구를 불러오지 못했어요(" + tried.join(", ") + " 모두 응답 없음). 회사 네트워크에서 외부 사이트가 막혔을 수 있어요 — 다른 네트워크(휴대폰 테더링 등)에서 다시 시도하거나 관리자에게 알려 주세요.");
    })();
    return xlsxLoading;
  }
  function sheetFor(XLSX, table, rows) {
    const cols = tableDef(table).cols;
    const aoa = [cols.map(c => c.label)].concat(rows.map(r => cols.map(c => (r[c.key] === undefined ? "" : r[c.key]))));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = cols.map(c => ({ wch: Math.max(10, Math.min(40, c.label.length * 2 + 2)) }));
    ws["!freeze"] = { xSplit: 0, ySplit: 1 };
    return ws;
  }
  async function downloadExcel(tables, rowsOverride) {
    try {
      const XLSX = await loadXlsx();
      const wb = XLSX.utils.book_new();
      for (const t of tables) {
        const rows = rowsOverride && tables.length === 1 ? rowsOverride : await loadRows(t, true);
        XLSX.utils.book_append_sheet(wb, sheetFor(XLSX, t, rows), tableDef(t).sheet.slice(0, 31));
      }
      const stamp = new Date().toISOString().slice(0, 10);
      saveWorkbook(XLSX, wb, `${PLATFORM_UI.general.title.replace(/\s+/g, "_")}_${tables.length === 1 ? tableDef(tables[0]).sheet : "전체DB"}_${stamp}.xlsx`);
    } catch (err) { alert("다운로드 실패: " + err.message); }
  }
  // 파일 이름이 확실히 붙도록 Blob + download 링크로 직접 저장
  function saveWorkbook(XLSX, wb, fileName) {
    const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const url = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // 엑셀 업로드(관리자): 파일 선택 즉시 진행 창을 띄워 "읽는 중 → 서버 확인 중 → 미리보기 → 반영 결과"를 단계별로 보여줌.
  // 어느 단계에서 실패해도 창 안에 원인을 표시(멈춘 듯 보이지 않게).
  // 업로드 진행 상황: ① 읽기 ② 서버 확인 ③ 미리보기 ④ 반영 — 각 단계 상태와 경과 시간을 실시간 표시
  function uploadProgress() {
    const steps = [["read", "① 엑셀 파일 읽기"], ["check", "② 서버에서 내용 확인"], ["preview", "③ 미리보기 확인"], ["commit", "④ 반영"]];
    const box = el("div", "up-steps2"), rows = {};
    steps.forEach(([k, t]) => {
      const r = el("div", "up-step2 wait2");
      r.append(elText("span", "up-ico2", "○"), elText("span", "up-txt2", t), elText("span", "up-sub2", ""), elText("span", "up-time2", ""));
      rows[k] = r; box.appendChild(r);
    });
    let timer = null;
    const stopTimer = () => { if (timer) clearInterval(timer); timer = null; };
    const mark = (k, state, sub) => {
      const r = rows[k]; if (!r) return;
      r.className = "up-step2 " + state + "2";
      r.querySelector(".up-ico2").textContent = { wait: "○", run: "⏳", ok: "✔", fail: "✖", hold: "●" }[state];
      if (sub !== undefined) r.querySelector(".up-sub2").textContent = sub;
    };
    return {
      box,
      start(k, sub) {
        stopTimer(); mark(k, "run", sub);
        const t0 = Date.now(), tm = rows[k].querySelector(".up-time2");
        timer = setInterval(() => {
          const sec = Math.round((Date.now() - t0) / 1000);
          tm.textContent = sec + "초" + (sec >= 40 ? " · 오래 걸리고 있어요(행이 많거나 연결이 느림) — 창을 닫지 말고 기다려 주세요" : "");
        }, 1000);
      },
      sub(k, text) { rows[k].querySelector(".up-sub2").textContent = text; },
      done(k, sub) { stopTimer(); mark(k, "ok", sub); },
      hold(k, sub) { stopTimer(); mark(k, "hold", sub); },
      fail(k, sub) { stopTimer(); mark(k, "fail", sub); },
      stop: stopTimer,
    };
  }

  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(",")[1] || "");
      fr.onerror = () => reject(new Error("파일을 읽지 못했어요(파일이 열려 있거나 손상됐을 수 있어요)."));
      fr.readAsDataURL(file);
    });
  }
  // 날짜 셀 → 'YYYY-MM-DD' (시간대와 무관하게 가장 가까운 자정 기준)
  function dateCell(v) { return v instanceof Date ? new Date(Math.round(v.getTime() / 864e5) * 864e5).toISOString().slice(0, 10) : v; }
  // 엑셀 파일 → [{name, aoa}] : .xlsx는 서버가 직접 읽고(브라우저·네트워크 영향 없음), 실패하거나 .xls·.csv면 브라우저 엑셀 도구로
  async function readSheetsFromFile(file, onStatus) {
    // 회사 문서보안 프로그램(OfficeKeeper 등)이 업로드를 막으면 실제 파일 대신 차단 안내 파일이 들어옴
    if (/OfficeKeeper|File\s*Block/i.test(file.name || "")) throw new Error("회사 보안 프로그램(OfficeKeeper)이 브라우저 파일 업로드를 막았어요. BIS 파일은 드라이브의 'BIS 업로드 폴더'에 넣고 [BIS 업로드] → [드라이브에서 가져오기]를 이용해 주세요.");
    let serverErr = null;
    if (/\.xlsx$/i.test(file.name)) {
      try {
        onStatus && onStatus("서버로 파일 보내는 중…");
        const b64 = await readAsBase64(file);
        onStatus && onStatus("서버에서 엑셀 읽는 중…");
        const res = await callDb("parseFile", { b64 });
        if (res.ok && res.sheets && res.sheets.length) return res.sheets;
        serverErr = new Error(res.message || res.error || "서버에서 읽지 못함");
      } catch (e) { serverErr = e; }
    }
    try {
      const XLSX = await loadXlsx(onStatus);
      onStatus && onStatus("브라우저에서 엑셀 읽는 중…");
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
      return wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }).map(r => r.map(dateCell)) }));
    } catch (e) {
      throw new Error((serverErr ? "서버: " + serverErr.message + " / " : "") + e.message);
    }
  }
  // 표(aoa) → 머리글 행 찾기 + 행 객체 (처음 10행 중 글자 칸이 가장 많은 행 = 머리글)
  function rowsFromAoa(aoa) {
    if (!aoa || !aoa.length) throw new Error("빈 시트예요.");
    let hIdx = 0, best = -1;
    aoa.slice(0, 10).forEach((r, i) => { const n = (r || []).filter(v => typeof v === "string" && v.trim()).length; if (n > best) { best = n; hIdx = i; } });
    const header = (aoa[hIdx] || []).map(h => String(h).trim());
    const rows = aoa.slice(hIdx + 1).filter(r => r && r.some(v => v !== "" && v != null))
      .map(r => { const o = {}; header.forEach((h, j) => { if (h) o[h] = r[j] === undefined ? "" : r[j]; }); return o; });
    return { header, rows, headerLine: hIdx + 1 };
  }

  function pickExcel(table, onDone) {

  async function previewImport(table, rows, m, onDone, headerLine, opts) {
    opts = opts || {};
    const prog = m.prog || uploadProgress();
    const lineOf = x => (opts.bis ? `${x.file} ${x.line}행` : String(x.line - 1 + headerLine));
    m.body.innerHTML = "";

    let res;
    try { res = await callDb(opts.bis ? "bisPreview" : "importPreview", opts.bis ? opts.payload : { table, rows }); }
    catch (err) { prog.fail("check", "오류"); showUploadError(m, table, "서버 확인 중 오류 — " + err.message); return; }
    if (!res.ok) { prog.fail("check", "오류"); showUploadError(m, table, res.message || res.error); return; }
    const r = res.result;
    prog.done("check", `신규 ${r.added} · 변경 ${r.updated} · 변경 없음 ${r.unchanged} · 오류 ${r.errors}`);
    if (r.added + r.updated) prog.hold("preview", "아래 내용을 확인한 뒤 [반영하기]를 눌러 주세요 — 아직 반영 전");

    m.body.appendChild(elText("p", "modal-desc2", opts.bis ? "③ 미리보기 — 아직 반영 전입니다. 매출현황(확정 기준)과 진행현황(최종 압축·진행 중·불발 기준)을 대조한 결과예요." : `③ 미리보기 — 아직 반영 전입니다. 머리글: ${headerLine}번째 줄`));
    if (opts.bis) {
      const cats = el("div", "import-sum2 bis-cats2");
      Object.entries(r.categories || {}).forEach(([k, n]) => { const b = el("span", "import-pill2 " + (/확인|정정/.test(k) ? "warn-pill2" : "same2")); b.appendChild(elText("b", null, String(n))); b.appendChild(document.createTextNode(" " + k)); cats.appendChild(b); });
      if ((r.excluded || []).length) { const b = el("span", "import-pill2 same2"); b.appendChild(elText("b", null, String(r.excluded.length))); b.appendChild(document.createTextNode(" 반영 안 함(중복·과거 건)")); cats.appendChild(b); }
      m.body.appendChild(cats);
      const check = r.rows.filter(x => /확인|정정/.test(x.category) || (x.notes || []).some(n => /확인/.test(n)));
      if (check.length) {
        const cb = el("div", "import-errbox2 warn-box2");
        cb.appendChild(elText("p", null, `확인이 필요한 ${check.length}건 — 반영은 되고, 사업 원장 '다음 할 일'에도 표시됩니다.`));
        const ul = el("ul", null);
        check.forEach(x => ul.appendChild(elText("li", null, `${lineOf(x)} · ${x.summary.split(" · ").slice(1, 4).join(" · ")} → ${x.category}${(x.notes || []).length ? " — " + x.notes.join(" / ") : ""}`)));
        cb.appendChild(ul); m.body.appendChild(cb);
      }
      if ((r.excluded || []).length) {
        const det = document.createElement("details"); det.className = "bis-ex2";

    }

    cols.appendChild(elText("span", "ok2", "인식한 열: " + (r.columns.matched.join(", ") || "없음")));

    if (r.columns.defaults.length) cols.appendChild(elText("span", null, "자동으로 채운 칸: " + r.columns.defaults.join(", ")));
    m.body.appendChild(cols);
    const sum = el("div", "import-sum2");
    [["신규", r.added, "new2"], ["변경", r.updated, "upd2"], ["변경 없음", r.unchanged, "same2"], ["오류", r.errors, "err2"]].concat(table === "deals" ? [["자동 인식(이름 표기 다름)", r.autoMatched || 0, "same2"], ["중복 의심 → 관리자 확인", r.suspects || 0, "warn-pill2"]] : []).filter(([k, n]) => n || !/자동 인식|중복 의심/.test(k)).forEach(([k, n, c]) => {

      const ul = el("ul", null);

      m.body.appendChild(elText("p", "err2", "모든 행에 오류가 있어 반영할 수 없어요. 아래 오류 내용과 필요한 머리글을 확인해 주세요."));

    }
    if (opts.bis) m.body.appendChild(elText("p", "modal-desc2", "BIS가 갱신하는 칸: 진행 단계·통화·금액·계약 기간·실입금액·최종 압축일·확정/불발일·불발 사유. 플랫폼에서 정한 KPI 인정 시기·실적 반영·실적 인정 기준·확정 금액·비고·담당자는 그대로 유지됩니다."));
    else if (table === "deals") m.body.appendChild(elText("p", "modal-desc2", "같은 사업 판단: 사업ID가 있으면 ID로, 없으면 '브랜드 + 아티스트 그룹 + 계약구분 + 시작 월'로 찾습니다. 엑셀의 빈 칸은 기존 값을 유지합니다. 간편 양식의 '실적 반영(O/X)·실적 연도·반기·KPI 인정 금액'도 반영됩니다."));
    const t = el("table", "data-table2 import-table2");
    const hr = el("tr", null);
    (opts.bis ? ["파일·행", "분류", "결과", "내용", "변경·오류"] : ["엑셀 행", "결과", "내용", "변경·오류"]).forEach(h => hr.appendChild(elText("th", null, h)));
    const thead = el("thead", null); thead.appendChild(hr); t.appendChild(thead);
    const tbody = el("tbody", null);
    const label = { new: "신규", update: "변경", same: "변경 없음", error: "오류" };
    r.rows.slice(0, 300).forEach(x => {
      const tr = el("tr", "st-" + x.status + "2");
      tr.appendChild(elText("td", null, lineOf(x)));
      if (opts.bis) tr.appendChild(elText("td", null, x.category || ""));
      tr.appendChild(elText("td", null, label[x.status] + (x.id ? ` (${x.id})` : "")));
      tr.appendChild(elText("td", "long2", x.summary));
      const detail = x.errors.length ? x.errors.join(" / ") : x.changes.map(c => `${c.field}: ${c.before || "(빈칸)"} → ${c.after}`).join(" / ") + (x.changeCount > x.changes.length ? ` 외 ${x.changeCount - x.changes.length}건` : "");
      tr.appendChild(elText("td", "long2", detail + (x.notes && x.notes.length ? (detail ? " / " : "") + "※ " + x.notes.join(" / ") : "")));
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    const wrap = el("div", "data-table-wrap2"); wrap.appendChild(t);
    m.body.appendChild(wrap);
    const actions = el("div", "form-actions2");
    const go = elText("button", "btn-primary2", `반영하기 (신규 ${r.added} · 변경 ${r.updated}${r.errors ? ` · 오류 ${r.errors}건 제외` : ""})`); go.type = "button";
    go.disabled = !(r.added + r.updated);
    const cancel = elText("button", "btn-line2", "취소"); cancel.type = "button"; cancel.addEventListener("click", m.close);
    go.addEventListener("click", async () => {
      go.disabled = true; cancel.disabled = true; go.textContent = "④ 반영 중… (창을 닫지 마세요)";
      prog.done("preview", "확인 완료");
      prog.start("commit", `신규 ${r.added} · 변경 ${r.updated} 저장 중…`);
      let done;
      try { done = await callDb(opts.bis ? "bisCommit" : "importCommit", opts.bis ? opts.payload : { table, rows }); }
      catch (err) { done = { ok: false, message: err.message }; }
      if (!done.ok) { prog.fail("commit", "실패 — 아래 내용 확인"); go.disabled = false; cancel.disabled = false; go.textContent = "다시 반영하기"; m.body.appendChild(elText("p", "err2", "반영 실패: " + (done.message || done.error))); return; }
      prog.done("commit", `신규 ${done.result.added} · 변경 ${done.result.updated} 저장 완료`);
      COLLAB.dashDirty = true;
      if (table === "members") await refreshMeta();
      m.body.innerHTML = "";
      const box = el("div", "import-done2");
      box.appendChild(elText("p", "ok-big2", `✅ 반영 완료 — 신규 ${done.result.added}건 · 변경 ${done.result.updated}건`));
      if (done.result.errors) box.appendChild(elText("p", "err2", `오류 ${done.result.errors}건은 반영하지 않았어요.`));
      box.appendChild(elText("p", "modal-desc2", (opts.bis ? "확인이 필요한 건은 사업 원장 '다음 할 일'에 표시됩니다. " : "") + "변경 이력 탭에 '엑셀 업로드' 기록으로 남았습니다." + (table === "members" ? " 이름 선택 목록에도 바로 반영됐어요." : "")));
      m.body.appendChild(box);
      const a2 = el("div", "form-actions2");
      const ok = elText("button", "btn-primary2", "확인"); ok.type = "button";
      ok.addEventListener("click", () => { m.close(); onDone && onDone(); });
      a2.appendChild(ok);
      m.body.appendChild(a2);
      onDone && onDone();
    });
    actions.append(go, cancel);
    m.body.appendChild(actions);
  }

  // 팀원 명단 등이 바뀌면 이름 선택 목록·연도 목록을 다시 받아 옴
  async function refreshMeta() {
    try { const meta = await callDb("meta"); if (meta.ok) { COLLAB.meta = meta; renderYearOptions(); } } catch (e) {}
  }
</script>
</body>
</html>
