<!doctype html>
<html lang="ko">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간회의 대시보드 (개발 서버)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* ================= 디자인 토큰 (Industry 디자인 시스템, 카카오톡 핸드오프 반영) ================= */
  :root {
    --ground: #ffffff;
    --ink: #1d1f20;
    --soft: #5d5d60;
    --faint: #7a7a7d;
    --accent: #5980a6;
    --accent-700: #416180;
    --accent-300: #94bce3;
    --accent-900: #2c455d;
    --accent-tint: rgba(238,246,255,0.55);
    --good: #2f6b52;
    --good-dark: #6fbf9a;
    --warn: #8a6420;
    --warn-dark: #d9ab5a;
    --bad: #a2453c;
    --hairline: rgba(29,31,32,0.16);
    --header-strip: #e7e7ea;
    --out-of-month: rgba(29,31,32,0.03);
    --shadow-pop: 0 12px 32px rgba(43,43,45,0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', 'Noto Sans KR', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--ground);
    font-size: 13px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; font-weight: 600; margin: 0; letter-spacing: 0; }
  a { color: var(--accent-700); }
  a:hover { color: var(--accent-900); }
  ::selection { background: #d6ebff; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 32px 32px 64px; }

  /* ---- blueprint 카드 + 코너 마크 (전 카드 필수) ---- */
  .blueprint { position: relative; border: 1px solid var(--hairline); border-radius: 0; background: var(--ground); }
  .blueprint > .corner { position: absolute; width: 11px; height: 11px; color: rgba(29,31,32,0.55); }
  .blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
  .blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
  .blueprint > .corner::after { top: 5px; left: 0; width: 100%; height: 1px; }
  .blueprint > .corner.tl { top: -6px; left: -6px; }
  .blueprint > .corner.tr { top: -6px; right: -6px; }
  .blueprint > .corner.bl { bottom: -6px; left: -6px; }
  .blueprint > .corner.br { bottom: -6px; right: -6px; }
  .dashsec.dark-section > .corner { color: rgba(255,255,255,0.6); }

  /* ---- 헤더 ---- */
  .dash-header2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--hairline); margin-bottom: 24px; }
  .dash-header2 .eyebrow2 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-700); margin: 0 0 2px; }
  .dash-header2 h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; }
  .header-actions2 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-actions2 label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
  .week-select2 { font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 10px; border-radius: 0; border: 1px solid rgba(29,31,32,0.28); background: #fff; color: var(--ink); }
  .conn-state2 { font-size: 11px; color: var(--soft); }
  .btn-primary2 { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 7px 14px; border-radius: 0; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .btn-primary2:hover { background: var(--accent-700); border-color: var(--accent-700); }

  /* ---- 인사이트 바 ---- */
  .insight-bar2 { display: flex; align-items: flex-start; gap: 14px; border: 1px solid var(--hairline); border-left: 3px solid var(--accent); padding: 14px 18px; margin-bottom: 28px; background: var(--accent-tint); }
  .insight-bar2 .insight-kicker2 { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-700); padding-top: 2px; white-space: nowrap; }
  .insight-bar2 .insight-body2 { margin: 0; font-size: 13px; line-height: 1.6; color: #424244; white-space: pre-wrap; }
  .insight-main2 { flex: 1; min-width: 0; }
  .insight-actions2 { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .insight-edit-toggle2 { display: inline-flex; align-items: center; gap: 5px; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; padding: 4px 10px 4px 8px; border-radius: 0; border: 1px solid var(--accent-300); background: transparent; color: var(--accent-700); cursor: pointer; white-space: nowrap; }
  .insight-edit-toggle2:hover { background: rgba(89,128,166,0.12); border-color: var(--accent-700); }
  .insight-edit-toggle2 svg { flex-shrink: 0; }
  .insight-meta2 { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .insight-meta2 .insight-edited2 { font-size: 11px; color: var(--faint); }
  .insight-reset-btn2 { font-family: inherit; font-size: 11px; font-weight: 600; border: none; background: transparent; color: var(--faint); padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; transition: text-decoration-color .12s; }
  .insight-reset-btn2:hover { color: var(--accent-700); text-decoration-color: var(--accent-700); }
  .insight-edit-panel2 { border: 1px solid var(--accent-300); background: #fff; }
  .insight-edit-label2 { display: flex; align-items: center; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-700); padding: 8px 10px 0; }
  .insight-edit-textarea2 { display: block; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px; line-height: 1.6; color: var(--ink); padding: 8px 10px; border: none; background: transparent; resize: vertical; min-height: 64px; }
  .insight-edit-textarea2:focus { outline: none; }
  .insight-edit-actions2 { display: flex; align-items: center; gap: 10px; padding: 0 10px 9px; }
  .insight-save-btn2 { font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 5px 14px; border-radius: 0; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .insight-save-btn2:hover { background: var(--accent-700); border-color: var(--accent-700); }
  .insight-cancel-btn2 { font-family: inherit; font-size: 11px; font-weight: 600; border: none; background: transparent; color: var(--faint); padding: 0; cursor: pointer; }
  .insight-cancel-btn2:hover { color: var(--ink); }

  /* ---- 섹션 셸 ---- */
  .dashsec { padding: 20px 22px 22px; margin-bottom: 28px; }
  .dashsec.dark-section { background: #1d1f20; color: #ffffff; border-color: #1d1f20; }
  .dashsec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); margin-bottom: 18px; }
  .dark-section .dashsec-head { border-bottom-color: rgba(255,255,255,0.22); }
  .dashsec-head .kicker-left { display: flex; align-items: baseline; gap: 10px; }
  .dashsec-num { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint); }
  .dark-section .dashsec-num { color: #9a9a9e; }
  .dashsec-head h2 { font-size: 20px; }
  .dashsec-head-right { display: flex; align-items: center; gap: 10px; }
  .badge-outline2 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--soft); border: 1px solid rgba(29,31,32,0.2); padding: 2px 9px; white-space: nowrap; }
  .dark-section .badge-outline2 { color: #b9b9bc; border-color: rgba(255,255,255,0.3); }
  .link-detail2 { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; }
  .link-detail2, .dark-section .link-detail2 { color: var(--accent-700); border-bottom: 1px solid var(--accent-700); }
  .dark-section .link-detail2 { color: #94bce3; border-bottom-color: #94bce3; }
  .btn-outline-toggle2 { font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 11px; border-radius: 0; border: 1px solid #94bce3; background: transparent; color: #94bce3; cursor: pointer; }
  .btn-outline-toggle2:hover { background: rgba(148,188,227,0.2); }
  .state-msg2 { margin: 0; padding: 28px 0; font-size: 13px; color: var(--faint); }
  .dark-section .state-msg2 { color: #b9b9bc; }
  .state-msg2.err2 { color: var(--bad); font-weight: 700; padding: 10px 0; }

  /* ---- 타일 그리드(다크 섹션 전용) ---- */
  .tile-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.22); margin-bottom: 18px; }
  .tile-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.22); }
  .tile-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.22); }
  .tile { background: #1d1f20; padding: 12px 12px 13px; }
  .tile .tile-label { font-size: 11px; color: #b9b9bc; margin-bottom: 5px; white-space: nowrap; }
  .tile .tile-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; white-space: nowrap; color: #fff; }
  .tile .tile-value .unit2 { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; margin-left: 2px; }
  .tile.tile-sm .tile-value { font-size: 18px; line-height: 1; }
  .tile.tile-sm { padding: 9px 10px; }
  .tile.tile-sm .tile-label { margin-bottom: 3px; }
  .kpi-block-kicker2 { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9e; margin: 0 0 8px; }

  /* ---- KPI 히어로 + 스파크라인 ---- */
  .kpi-hero2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 32px; align-items: start; }
  .spark-head2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .spark-legend2 { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #b9b9bc; }
  .spark-legend2 .dot3 { width: 8px; height: 8px; background: #94bce3; display: inline-block; }
  .spark-box2 { position: relative; border: 1px solid rgba(255,255,255,0.22); padding: 8px 6px 4px; }
  .spark-overlay2 { position: absolute; inset: 8px 6px 4px; pointer-events: none; }
  .spark-badge2 { position: absolute; background: #94bce3; color: #1d1f20; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; white-space: nowrap; }
  .spark-label2 { position: absolute; bottom: 0; color: #9a9a9e; font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; }

  /* ---- 월별 트래킹 ---- */
  .mt-headline2 { font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; font-weight: 600; font-size: 20px; margin: 0 0 16px; }
  .mt-overview2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: end; }
  .mt-big-row2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .mt-big-num2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 44px; line-height: 1; }
  .mt-big-goal2 { font-size: 13px; color: #b9b9bc; }
  .mt-big-rate2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; }
  .mt-bar-track3 { position: relative; height: 10px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); }
  .mt-bar-fill3 { position: absolute; left: 0; top: 0; bottom: 0; transition: width .3s; }
  .mt-bar-caption2 { display: flex; justify-content: space-between; font-size: 11px; color: #9a9a9e; margin-top: 5px; }
  .mt-detail-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .mt-detail-card2 { border: 1px solid rgba(255,255,255,0.22); padding: 13px 14px 14px; }
  .mt-detail-top2 { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .mt-detail-cat2 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #94bce3; border: 1px solid #94bce3; padding: 1px 7px; }
  .mt-detail-week2 { font-size: 11px; color: #9a9a9e; }
  .mt-detail-proj2 { font-size: 13px; font-weight: 500; line-height: 1.45; margin-bottom: 11px; min-height: 38px; }

  /* ---- 팀 AGENDA ---- */
  .agenda-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1px; background: var(--hairline); margin: 0 -18px; }
  .agenda-col2 { background: var(--ground); min-width: 0; padding: 0 18px 4px; }
  .agenda-col-head2 { display: flex; align-items: center; gap: 7px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 2px solid; }
  .agenda-col-head2 .label2 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; }
  .agenda-col-head2 .count2 { font-size: 11px; color: var(--faint); }
  .agenda-item2 { display: flex; gap: 10px; padding: 0 0 14px; margin-bottom: 14px; border-bottom: 1px solid rgba(29,31,32,0.1); }
  .agenda-item2 .badge2 { flex-shrink: 0; height: fit-content; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 1px 7px; border: 1px solid; white-space: nowrap; }
  .agenda-item2 .body2 { min-width: 0; }
  .agenda-item2 .proj2 { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .agenda-item2 .content2 { font-size: 12px; color: var(--soft); line-height: 1.55; }
  .agenda-empty2 { margin: 0; font-size: 12px; color: var(--faint); padding: 14px 0; }

  /* ---- 사업 캘린더 / 팀 일정 캘린더 공통 ---- */
  .split-row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(620px, 1fr)); gap: 28px; margin-bottom: 28px; align-items: start; }
  .cal-nav-row2 { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .nav-btn2 { width: 28px; height: 28px; border: 1px solid rgba(29,31,32,0.28); background: transparent; color: var(--ink); cursor: pointer; border-radius: 0; font-size: 12px; font-family: inherit; }
  .nav-btn2:hover { background: #eef6ff; border-color: var(--accent); }
  .nav-month-label2 { font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; font-weight: 600; font-size: 18px; min-width: 128px; text-align: center; }

  .cal-legend2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .legend-btn2 { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 0; border: 1px solid rgba(29,31,32,0.2); background: transparent; color: var(--soft); cursor: pointer; font-family: inherit; opacity: 1; }
  .legend-btn2 .dot2 { width: 8px; height: 8px; display: inline-block; }
  .legend-btn2.active-early2 { border-color: var(--accent); background: rgba(89,128,166,0.12); color: var(--accent-900); }
  .legend-btn2.active-mid2 { border-color: var(--warn); background: rgba(138,100,32,0.1); color: #6b4d18; }
  .legend-btn2.active-urgent2 { border-color: var(--bad); background: rgba(162,69,60,0.1); color: #8a3a32; }
  .legend-btn2.dimmed2 { opacity: 0.45; }

  .cal-grid2, .teamcal-grid2 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 24px; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); }
  .cal-grid2 { grid-auto-rows: 110px; }
  .teamcal-grid2 { grid-auto-rows: 114px; }
  .cal-dow2 { background: var(--header-strip); height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .cal-cell2, .teamcal-cell2 { position: relative; background: #ffffff; min-width: 0; }
  .cal-cell2.empty2, .teamcal-cell2.empty2 { background: var(--out-of-month); }
  .cal-cell-inner2 { position: absolute; inset: 0; overflow: hidden; padding: 5px 5px 6px; display: flex; flex-direction: column; gap: 3px; }
  .teamcal-cell-inner2 { position: absolute; inset: 0; overflow: hidden; padding: 6px 6px 7px; display: flex; flex-direction: column; gap: 3px; }
  .cal-daynum2 { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; }

  .cal-entry2 { flex-shrink: 0; cursor: pointer; padding: 2px 4px; transition: opacity .12s; border-left: 3px solid; }
  .cal-entry2 .proj2line { font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-entry2 .detail2line { font-size: 11px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-entry2.dimmed2 { opacity: 0.25; }
  .cal-entry2.kind-early2 { border-left-color: var(--accent); background: rgba(89,128,166,0.08); color: var(--accent-900); }
  .cal-entry2.kind-mid2 { border-left-color: var(--warn); background: rgba(138,100,32,0.07); color: #6b4d18; }
  .cal-entry2.kind-urgent2 { border-left-color: var(--bad); background: rgba(162,69,60,0.07); color: #8a3a32; }
  .cal-more2 { flex-shrink: 0; align-self: flex-start; font-size: 11px; line-height: 1.3; font-weight: 700; white-space: nowrap; color: var(--accent-700); background: transparent; border: none; border-bottom: 1px solid #94bce3; padding: 0; cursor: pointer; font-family: inherit; }
  .cal-expand-panel2 { position: absolute; top: 0; left: 0; right: 0; min-height: 100%; background: #ffffff; border: 1px solid #1d1f20; box-shadow: var(--shadow-pop); padding: 5px 5px 6px; display: flex; flex-direction: column; gap: 3px; z-index: 50; }

  .cal-summary2 { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline); }
  .summary-title2 { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
  .summary-empty2 { margin: 0; font-size: 12px; color: var(--faint); }
  .summary-table2 { width: 100%; border-collapse: collapse; border: 1px solid var(--hairline); font-size: 12px; }
  .summary-table2 thead tr { background: var(--header-strip); }
  .summary-table2 th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); padding: 7px 8px; border-right: 1px solid var(--hairline); white-space: nowrap; }
  .summary-table2 tbody tr { border-top: 1px solid var(--hairline); }
  .summary-table2 td { padding: 7px 8px; vertical-align: top; border-right: 1px solid var(--hairline); color: #424244; }
  .summary-table2 td:last-child, .summary-table2 th:last-child { border-right: none; }
  .summary-table2 td.proj-cell2 { font-weight: 700; width: 22%; color: var(--ink); }
  .stage-badge2 { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent-700); border: 1px solid #94bce3; padding: 1px 7px; white-space: nowrap; }

  /* ---- 팀 일정 캘린더 이벤트 + 호버 패널 ---- */
  .teamcal-event2 { flex-shrink: 0; font-size: 11px; line-height: 1.4; padding: 2px 5px; border-left: 2px solid var(--accent); background: rgba(238,246,255,0.9); color: var(--accent-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .teamcal-event2 b { color: var(--accent-700); }
  .teamcal-more2 { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--faint); }
  .teamcal-caption2 { margin: 10px 0 0; font-size: 11px; color: var(--faint); }
  .teamcal-hover-panel2 {
    position: absolute; top: 0; left: 0; right: 0; min-height: 100%;
    background: var(--accent-900); box-shadow: var(--shadow-pop);
    padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 3px;
    z-index: 50; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s;
  }
  .teamcal-hover-panel2 .cal-daynum2 { color: #fff; }
  .teamcal-hover-panel2 .teamcal-hp-event2 { font-size: 11px; line-height: 1.4; padding: 3px 6px; background: rgba(255,255,255,0.14); color: #fff; font-weight: 500; }
  .teamcal-hover-panel2 .teamcal-hp-event2 b { color: #b5d9fd; }
  .teamcal-cell2.has-events2:hover { z-index: 40; overflow: visible; }
  .teamcal-cell2.has-events2:hover .teamcal-hover-panel2 { opacity: 1; visibility: visible; pointer-events: auto; }

  /* ---- 트렌드 리포트 ---- */
  .trend-block2 { padding: 12px 14px 4px; margin-bottom: 14px; border-left: 3px solid; }
  .trend-block2:last-child { margin-bottom: 0; }

  /* ---- 오류 카드 ---- */

  .popover2 .pop-v2 { display: block; font-size: 12px; line-height: 1.55; color: #424244; }

  /* ---- 푸터 ---- */
  footer.note2 { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--hairline); font-size: 11px; line-height: 1.6; color: var(--faint); }

  /* ---- 비밀번호 게이트 ---- */
  #pwGate { position: fixed; inset: 0; z-index: 100; background: rgba(29,31,32,0.72); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #pwGate .pw-box2 { width: 100%; max-width: 348px; background: #ffffff; padding: 30px 28px 26px; }
  #pwGate .pw-kicker2 { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-700); margin: 0 0 4px; }
  #pwGate h2 { font-size: 26px; margin: 0 0 6px; }

  #pwGate input { width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 0; border: 1px solid rgba(29,31,32,0.28); background: #fff; color: var(--ink); margin-bottom: 10px; }
  #pwGate input.err-input2 { border-color: var(--bad); }
  #pwGate button { width: 100%; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; padding: 11px 12px; border-radius: 0; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  #pwGate button:hover { background: var(--accent-700); border-color: var(--accent-700); }
  #pwGate .pw-err2 { margin: 10px 0 0; min-height: 17px; font-size: 12px; color: var(--bad); }

  body { padding-top: 36px; }
</style>
</head>
<body class="locked">

<div id="devBanner">🔧 개발 서버 — 팀원 공유용 아님 (엘라 확인 전용)</div>

<div id="pwGate">
  <div class="blueprint pw-box2">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

<div class="wrap">

    <div>
      <p class="eyebrow2">광고IP사업팀 · AD/IP BUSINESS</p>

  </footer>

<script>
  // ⚠️ Apps Script 배포 후 여기에 웹 앱 URL(.../exec)을 붙여넣을 것 — 절대 값 변경 금지.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyF12lwBJbJHFF5af15lNBIhCxMxBDzGbG8m8c1PWXJLLvT23dOL92GKcNivl9QHaOn/exec";

  const KPI_RAW_URL = "https://docs.google.com/spreadsheets/d/1HlGmNBPK69IWX3OqfVV6Q-MezsXQAG6rC6tdi7cgJmA/edit?usp=sharing";
  // 목표(연간/하반기) 숫자는 코드에 안 두고 Apps Script 응답에서 받아옴(비공개 저장소에만 두려고).
  let KPI_GOAL = { goal: null, h2Goal: null };

  // el(): 신뢰할 수 있는 마크업(직접 쓴 아이콘 SVG 등)에만 사용 — innerHTML 사용.
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  // elText(): 구글시트에서 온 자유입력 텍스트는 전부 이걸로 렌더 — textContent라 <, & 등이
  // 그대로 안전하게 보이고 레이아웃이 안 깨짐(리디자인 버그 3번 수정).
  function elText(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---- 포맷 헬퍼 — 금액은 소수점 둘째 자리까지만, 그 아래로 떨어지는 0은 표시 안 함
  // (200 → "200", 200.1 → "200.1", 200.12 → "200.12", 200.126 → "200.13"로 반올림).
  // Math.round로 소수 2자리에서 반올림한 뒤 숫자 그대로 반환하면, 템플릿 문자열에 꽂힐 때
  // JS가 숫자→문자열 변환을 하면서 트레일링 0을 자동으로 없애준다 — 별도 트리밍 코드 불필요.
  // 퍼센트는 기존대로 정수(리디자인 버그 2번 수정 유지).
  // null/undefined/NaN은 전부 0 취급(Apps Script가 빈 값을 NaN→JSON 직렬화 시 null로 보내는
  // 문제 대응, 기존 numOr0 로직은 그대로 유지).
  function numOr0(n) { return (n === null || n === undefined || isNaN(n)) ? 0 : n; }
  function fmtAmt(n) { return (n === null || n === undefined || isNaN(n)) ? 0 : Math.round(n * 100) / 100; }
  function fmtPct(n) { return (n === null || n === undefined || isNaN(n)) ? 0 : Math.round(n); }

  // ---- 비밀번호 게이트 + 데이터 레이어 ----
  function storedPw() { try { return sessionStorage.getItem("dashPw") || ""; } catch { return ""; } }
  function setStoredPw(pw) { try { sessionStorage.setItem("dashPw", pw); } catch {} }

  async function callBackend(section, extraParams) {
    const params = new URLSearchParams(Object.assign({ section, password: storedPw() }, extraParams || {}));
    const res = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
    return res.json();
  }

  // 로그인 검증 때 받은 kpi 응답을 1회용으로 캐시해뒀다가 initGlobalWeeks에서 재사용 —
  // 로그인 직후 kpi를 두 번 호출하던 문제 수정(리디자인 버그 4번).
  let cachedKpiData = null;

  document.getElementById("pwSubmit").addEventListener("click", submitPw);
  document.getElementById("pwInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") submitPw(); });
  async function submitPw() {
    const pw = document.getElementById("pwInput").value;
    const errEl = document.getElementById("pwErr");
    const inputEl = document.getElementById("pwInput");
    errEl.textContent = "확인 중…";
    inputEl.classList.remove("err-input2");
    setStoredPw(pw);
    try {
      const data = await callBackend("kpi");
      if (!data.ok) {
        setStoredPw("");
        // 서버 오류(server_error 등)까지 "비밀번호 틀림"으로 오인하지 않도록 구분
        // (리디자인 버그 1번 수정).
        if (data.error === "unauthorized") {
          inputEl.classList.add("err-input2");
          errEl.textContent = "비밀번호가 틀렸어요.";
        } else {
          errEl.textContent = "서버 오류: " + (data.message || data.error || "알 수 없는 오류");
        }
        return;
      }
      cachedKpiData = data;
      document.body.classList.remove("locked");
      document.getElementById("pwGate").remove();
      boot();
    } catch (err) {
      setStoredPw("");
      errEl.textContent = "서버에 연결할 수 없어요.";
    }
  }

  // ============================================================
  // ① 2026 KPI 현황
  // ============================================================
  function sectionHead(num, title, dark, badgeText, rightExtra) {
    const head = el("div", "dashsec-head");
    const left = el("div", "kicker-left");
    left.appendChild(elText("span", "dashsec-num", num));
    left.appendChild(elText("h2", null, title));
    head.appendChild(left);
    const right = el("div", "dashsec-head-right");
    if (badgeText != null) right.appendChild(elText("span", "badge-outline2", badgeText));
    if (rightExtra) right.appendChild(rightExtra);
    head.appendChild(right);
    return head;
  }
  function sectionShell(dark, extraCls) {
    const section = el("section", "blueprint dashsec" + (dark ? " dark-section" : "") + (extraCls ? " " + extraCls : ""));
    ["tl", "tr", "bl", "br"].forEach(pos => section.appendChild(el("i", "corner " + pos)));
    return section;
  }

  function kpiHeader(badgeText) {
    const card = sectionShell(true);
    const rawLink = document.createElement("a");
    rawLink.className = "link-detail2";
    rawLink.href = KPI_RAW_URL;
    rawLink.target = "_blank";
    rawLink.rel = "noopener noreferrer";
    rawLink.textContent = "상세보기 ↗";
    card.appendChild(sectionHead("01", "2026 KPI 현황", true, badgeText, rawLink));
    return card;
  }

  function tileGrid(gridCls, tiles, small) {
    const grid = el("div", gridCls);
    tiles.forEach(t => {
      const tile = el("div", "tile" + (small ? " tile-sm" : ""));
      tile.appendChild(elText("div", "tile-label", t.label));
      const val = el("div", "tile-value");
      val.style.color = t.color || "#ffffff";
      val.appendChild(document.createTextNode(t.num));
      if (t.unit) val.appendChild(elText("span", "unit2", t.unit));
      tile.appendChild(val);
      grid.appendChild(tile);
    });
    return grid;
  }

  let sparkChartUid = 0;
  // 스파크라인: SVG엔 그리드/면/선/점만 그리고, %뱃지·주차라벨은 HTML 오버레이로 얹는다
  // (SVG <text>는 리사이즈 시 폰트가 왜곡되므로 이 구조를 유지).
  function sparkChart(points) {
    const W = 520, H = 172, padX = 30, padTop = 34, baseY = 138, plotH = baseY - padTop;
    const n = points.length;
    const vals = points.map(p => p.actual);
    let vMin = Math.min(...vals), vMax = Math.max(...vals);
    if (vMax - vMin < 0.03) { const m = (vMax + vMin) / 2; vMin = m - 0.015; vMax = m + 0.015; }
    const pad = (vMax - vMin) * 0.35;
    const dMin = Math.max(0, vMin - pad), dMax = Math.min(1, vMax + pad);
    const xAt = i => padX + (n === 1 ? (W - 2 * padX) / 2 : (i / (n - 1)) * (W - 2 * padX));
    const yAt = v => padTop + (1 - (Math.max(dMin, Math.min(dMax, v)) - dMin) / (dMax - dMin)) * plotH;
    const coords = points.map((p, i) => [xAt(i), yAt(p.actual)]);
    const line = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
    const area = n ? line + " L" + coords[n - 1][0].toFixed(1) + "," + baseY + " L" + coords[0][0].toFixed(1) + "," + baseY + " Z" : "";
    const gridYs = [padTop, (padTop + baseY) / 2, baseY];
    const gid = "sparkFade" + (sparkChartUid++);
    const gridLines = gridYs.map(y => `<line x1="24" y1="${y}" x2="496" y2="${y}" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>`).join("");
    const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="#94bce3"/>`).join("");
    const svgHtml = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;aspect-ratio:${W}/${H};">` +
      `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0%" stop-color="#94bce3" stop-opacity="0.26"/>` +
      `<stop offset="100%" stop-color="#94bce3" stop-opacity="0"/>` +
      `</linearGradient></defs>` +
      gridLines +
      `<path d="${area}" fill="url(#${gid})"/>` +
      `<path d="${line}" fill="none" stroke="#94bce3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
      dots + `</svg>`;
    const wrap = el("div", "spark-box2", svgHtml);
    const overlay = el("div", "spark-overlay2");
    points.forEach((p, i) => {
      const xp = (coords[i][0] / W) * 100;
      const badgeShift = i === 0 ? "translate(0, -100%)" : i === n - 1 ? "translate(-100%, -100%)" : "translate(-50%, -100%)";
      const labelShift = i === 0 ? "translateX(0)" : i === n - 1 ? "translateX(-100%)" : "translateX(-50%)";
      const badge = elText("span", "spark-badge2", fmtPct(p.actual * 100) + "%");
      badge.style.left = xp.toFixed(2) + "%";
      badge.style.top = (((coords[i][1] - 8) / H) * 100).toFixed(2) + "%";
      badge.style.transform = badgeShift;
      overlay.appendChild(badge);
      const lab = elText("span", "spark-label2", p.label);
      lab.style.left = xp.toFixed(2) + "%";
      lab.style.transform = labelShift;
      overlay.appendChild(lab);
    });
    wrap.appendChild(overlay);
    return wrap;
  }

  function kpiHeroBody(annualTiles, h2Tiles, chartPoints) {
    const body = el("div", "kpi-hero2");
    const left = el("div", null);
    left.appendChild(elText("p", "kpi-block-kicker2", "2026년 전체"));
    left.appendChild(tileGrid("tile-grid-4", annualTiles));
    left.appendChild(elText("p", "kpi-block-kicker2", "하반기"));
    left.appendChild(tileGrid("tile-grid-3", h2Tiles));
    body.appendChild(left);

    const right = el("div", null);
    const sh = el("div", "spark-head2");
    sh.appendChild(elText("p", "kpi-block-kicker2", "주별 달성률 추이"));
    const legend = el("span", "spark-legend2");
    legend.appendChild(el("i", "dot3"));
    legend.appendChild(document.createTextNode("실제 달성률"));
    sh.appendChild(legend);
    right.appendChild(sh);
    if (chartPoints && chartPoints.length >= 2) {
      right.appendChild(sparkChart(chartPoints));
    } else {
      right.appendChild(elText("p", "state-msg2", "데이터가 쌓이는 중입니다 — 매주 새 파일을 올리면 추이가 표시됩니다 (현재 " + (chartPoints ? chartPoints.length : 0) + "건)."));
    }
    body.appendChild(right);
    return body;
  }

  function renderKpiPlaceholder() {
    const card = kpiHeader("예시");
    const demo = [0.1, 0.14, 0.2, 0.25, 0.28, 0.3, 0.32, 0.34].map((v, i) => ({ actual: v, label: (i + 1) + "주" }));
    card.appendChild(kpiHeroBody(
      [
        { label: "2026 KPI 목표", num: "00", unit: "억원", color: "#b9b9bc" },
        { label: "실적", num: "00", unit: "억원", color: "#b9b9bc" },
        { label: "달성률", num: "00%", unit: "", color: "#b9b9bc" },
        { label: "잔여 KPI", num: "00", unit: "억원", color: "#b9b9bc" },
      ],
      [
        { label: "하반기 KPI 목표", num: "00", unit: "억원", color: "#b9b9bc" },
        { label: "하반기 실적", num: "00", unit: "억원", color: "#b9b9bc" },
        { label: "달성률", num: "00%", unit: "", color: "#b9b9bc" },
      ],
      demo,
    ));
    return card;
  }

  function formatRemainKpi(goal, actual) {
    const diff = goal - actual;
    if (diff > 0) return fmtAmt(diff) + "억원";
    if (diff < 0) return "+" + fmtAmt(Math.abs(diff)) + "억원";
    return "0억원";
  }

  // 목표(goal/h2Goal)는 KPI_GOAL(서버에서 받은 값) 사용, 실적(actual/h2Actual)만 status에서 사용.
  function computeKpiFromStatus(status) {
    if (!status.annual || isNaN(status.annual.actual)) return null;
    const goal = KPI_GOAL.goal, h2Goal = KPI_GOAL.h2Goal;
    const actual = status.annual.actual;
    const h2Actual = status.h2 && !isNaN(status.h2.actual) ? status.h2.actual : null;
    return {
      goal, actual,
      ach: (actual / goal) * 100,
      remainLabel: formatRemainKpi(goal, actual),
      h2Goal, h2Actual,
      h2Ach: h2Actual != null ? (h2Actual / h2Goal) * 100 : null,
    };
  }

  // 주차가 쌓일수록(연말엔 20주 넘음) 스파크라인 한 줄에 점이 다 안 들어가고 %뱃지/라벨이
  // 겹치므로, 선택 주차 기준 최근 TREND_WINDOW_WEEKS개만 보여주는 이동 구간 방식으로 제한한다.
  const TREND_WINDOW_WEEKS = 6;

  function buildKpiTrendPoints(uptoKey) {
    const byWeek = (sectionCache.kpi && sectionCache.kpi.byWeek) || {};
    const target = byWeek[uptoKey];
    if (!target) return [];
    const uptoOrder = weekOrder(target.monthAbbr, target.weekNum);
    const entries = Object.keys(byWeek).map(k => byWeek[k])
      .filter(e => weekOrder(e.monthAbbr, e.weekNum) <= uptoOrder)
      .sort((a, b) => weekOrder(a.monthAbbr, a.weekNum) - weekOrder(b.monthAbbr, b.weekNum));
    const points = [];
    for (const e of entries) {
      const status = e.data;
      if (!status || !status.annual || isNaN(status.annual.actual)) continue;
      points.push({ actual: status.annual.actual / KPI_GOAL.goal, label: e.monthAbbr + "_" + e.weekNum });
    }
    return points.slice(-TREND_WINDOW_WEEKS);
  }

  function loadKpiForWeek(key) {
    const entry = sectionCache.kpi && sectionCache.kpi.byWeek[key];
    const label = weekLabel(entry, key);
    const slotEl = document.getElementById("kpiSlot");
    const status = entry && entry.data;
    if (!status) {
      slotEl.innerHTML = "";
      const card = kpiHeader(label);
      card.appendChild(elText("p", "state-msg2", "이 주차 자료가 아직 없어요."));
      slotEl.appendChild(card);
      return;
    }
    const computed = computeKpiFromStatus(status);
    if (!computed) {
      slotEl.innerHTML = "";
      const card = kpiHeader(label);
      card.appendChild(elText("p", "state-msg2", "이 주차엔 아직 실적이 입력되지 않았어요."));
      slotEl.appendChild(card);
      return;
    }
    const trendPoints = buildKpiTrendPoints(key);
    const achColor = computed.ach >= 100 ? "#6fbf9a" : computed.ach < 60 ? "#d9ab5a" : "#94bce3";
    const annualTiles = [
      { label: "2026 KPI 목표", num: fmtAmt(computed.goal), unit: "억원", color: "#ffffff" },
      { label: "실적", num: fmtAmt(computed.actual), unit: "억원", color: "#ffffff" },
      { label: "달성률", num: computed.ach.toFixed(0) + "%", unit: "", color: achColor },
      { label: "잔여 KPI", num: computed.remainLabel, unit: "", color: "#94bce3" },
    ];
    let h2Tiles;
    if (computed.h2Actual != null) {
      const h2Color = computed.h2Ach >= 100 ? "#6fbf9a" : computed.h2Ach < 60 ? "#d9ab5a" : "#94bce3";
      h2Tiles = [
        { label: "하반기 KPI 목표", num: fmtAmt(computed.h2Goal), unit: "억원", color: "#ffffff" },
        { label: "하반기 실적", num: fmtAmt(computed.h2Actual), unit: "억원", color: "#ffffff" },
        { label: "달성률", num: computed.h2Ach.toFixed(0) + "%", unit: "", color: h2Color },
      ];
    } else {
      h2Tiles = [{ label: "하반기 실적", num: "-", unit: "", color: "#b9b9bc" }];
    }
    const card = kpiHeader(label);
    card.appendChild(kpiHeroBody(annualTiles, h2Tiles, trendPoints));
    slotEl.innerHTML = "";
    slotEl.appendChild(card);
  }

  const CAL_DOW = ["일", "월", "화", "수", "목", "금", "토"];

  function isDateInMonth(d, year, month) {
    return !!d && d.year === year && d.month === month;
  }

  function closeActionPopover() {
    const existing = document.querySelector(".popover2");
    if (existing) existing.remove();
  }
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest(".popover2")) closeActionPopover();
  });
  function popRow(k, v) {
    const row = el("div", "pop-row2");
    row.appendChild(elText("span", "pop-k2", k));
    row.appendChild(elText("span", "pop-v2", v || "-"));
    return row;
  }
  function fmtDateYMD(d) {
    if (!d) return "-";
    const pad = n => String(n).padStart(2, "0");
    return `${d.year}-${pad(d.month)}-${pad(d.day)}`;
  }
  function fmtContractPeriod(item) {
    const period = `${fmtDateYMD(item.startDate)} ~ ${fmtDateYMD(item.endDate)}`;
    return item.months ? `${period} (${item.months}개월)` : period;
  }
  function fmtDDay(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return n >= 0 ? `D-${n}` : `D+${-n}`;
  }

  function showActionPopover(anchorEl, item) {
    closeActionPopover();
    const pop = el("div", "popover2");
    const closeBtn = document.createElement("button");
    closeBtn.className = "pop-close2";
    closeBtn.textContent = "×";
    closeBtn.addEventListener("click", (ev) => { ev.stopPropagation(); closeActionPopover(); });
    pop.appendChild(closeBtn);
    pop.appendChild(elText("p", "pop-title2", item.project));
    pop.appendChild(popRow("계약기간", fmtContractPeriod(item)));
    pop.appendChild(popRow("D- 값", fmtDDay(item.dDay)));
    pop.appendChild(popRow("ACTION 알림", item.actionAlert));
    document.body.appendChild(pop);
    const rect = anchorEl.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
    if (top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
    pop.style.left = Math.max(8, left) + "px";
    pop.style.top = Math.max(8, top) + "px";
  }

  const MARKER_LABEL = { early: "3개월 전", mid: "2개월 전", urgent: "1개월 전" };

  function buildTrackerCalendarWeeks(year, month, items) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, entry) => { (byDay[day] = byDay[day] || []).push(entry); };
    items.forEach(it => {
      (it.markers || []).forEach(m => {
        if (isDateInMonth(m.date, year, month)) {
          push(m.date.day, { kind: m.kind, project: it.project, detail: `${MARKER_LABEL[m.kind]} · ${it.actionAlert || "-"}`, item: it });
        }
      });
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dow: (firstDow + d - 1) % 7, entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  const CAL_MAX_VISIBLE = 2;

  function renderTrackerCalendarGrid(weeks, activeFilter, onFilterChange) {
    const wrap = document.createElement("div");
    const legend = el("div", "cal-legend2");
    [["early", "#5980a6", "3개월 전", "active-early2"], ["mid", "#8a6420", "2개월 전", "active-mid2"], ["urgent", "#a2453c", "1개월 전", "active-urgent2"]].forEach(([kind, dot, label, activeCls]) => {

      btn.className = "legend-btn2" + (activeFilter === kind ? " " + activeCls : "") + (activeFilter && activeFilter !== kind ? " dimmed2" : "");
      const dotEl = el("i", "dot2"); dotEl.style.background = dot;
      btn.appendChild(dotEl);
      btn.appendChild(document.createTextNode(label));
      btn.addEventListener("click", () => onFilterChange(kind));
      legend.appendChild(btn);
    });
    wrap.appendChild(legend);

    const grid = el("div", "cal-grid2");
    CAL_DOW.forEach(d => grid.appendChild(elText("div", "cal-dow2", d)));
    const makeEntry = (e) => {
      const tag = el("div", "cal-entry2 kind-" + e.kind + "2" + (activeFilter && activeFilter !== e.kind ? " dimmed2" : ""));
      tag.appendChild(elText("div", "proj2line", e.project));

      tag.addEventListener("click", (ev) => { ev.stopPropagation(); showActionPopover(tag, e.item); });

    };
    weeks.forEach(week => {
      week.forEach(cellData => {
        if (!cellData) { grid.appendChild(el("div", "cal-cell2 empty2")); return; }
        const cell = el("div", "cal-cell2");
        const inner = el("div", "cal-cell-inner2");
        const dayEl = elText("div", "cal-daynum2", String(cellData.day));
        dayEl.style.color = cellData.dow === 0 ? "#a2453c" : cellData.dow === 6 ? "#416180" : "#5d5d60";
        inner.appendChild(dayEl);
        const shown = cellData.entries.slice(0, CAL_MAX_VISIBLE);
        const hidden = cellData.entries.length - CAL_MAX_VISIBLE;
        shown.forEach(e => inner.appendChild(makeEntry(e)));
        const expanded = cellData.expandedRef.value;
        if (hidden > 0 && !expanded) {
          const moreBtn = document.createElement("button");
          moreBtn.type = "button"; moreBtn.className = "cal-more2";
          moreBtn.textContent = "+" + hidden + "건";
          moreBtn.addEventListener("click", (ev) => { ev.stopPropagation(); cellData.expandedRef.value = true; cellData.onExpandChange(); });
          inner.appendChild(moreBtn);
        }
        cell.appendChild(inner);
        if (expanded) {
          const panel = el("div", "cal-expand-panel2");
          const dayEl2 = elText("div", "cal-daynum2", String(cellData.day));
          dayEl2.style.color = dayEl.style.color;
          panel.appendChild(dayEl2);
          cellData.entries.forEach(e => panel.appendChild(makeEntry(e)));
          const foldBtn = document.createElement("button");
          foldBtn.type = "button"; foldBtn.className = "cal-more2";
          foldBtn.textContent = "접기";
          foldBtn.addEventListener("click", (ev) => { ev.stopPropagation(); cellData.expandedRef.value = false; cellData.onExpandChange(); });
          panel.appendChild(foldBtn);
          cell.appendChild(panel);
          cell.style.zIndex = "50";
        }
        grid.appendChild(cell);
      });
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderTrackerSummary(items, year, month) {

  function eventDateRange(ev) {
    const s = ev.start && (ev.start.dateTime || ev.start.date);
    if (!s) return null;
    const isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
    const start = new Date(s);
    const eRaw = ev.end && (ev.end.dateTime || ev.end.date);
    let end = eRaw ? new Date(eRaw) : new Date(s);
    if (isAllDay) end = new Date(end.getTime() - 86400000); // end.date는 exclusive라 하루 뺌
    return { start, end, isAllDay };
  }

  function buildTeamCalWeeks(year, month, events) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, item) => { (byDay[day] = byDay[day] || []).push(item); };
    events.forEach(ev => {
      const range = eventDateRange(ev);
      if (!range) return;
      const title = ev.summary || "(제목 없음)";
      const timeLabel = range.isAllDay ? null : range.start.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
      let d = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
      const last = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
      let guard = 0;
      while (d <= last && guard < 366) {
        if (d.getFullYear() === year && d.getMonth() === month - 1) {
          push(d.getDate(), { title, time: timeLabel });
        }
        d.setDate(d.getDate() + 1);
        guard++;
      }
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dow: (firstDow + d - 1) % 7, entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  let insightData = null;

  // 전체 주차 토글 — KPI/팀 AGENDA/트렌드 리포트 3개 카드가 공유하는 단일 주차 선택
  // ============================================================
  const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  function weekOrder(monthAbbr, weekNum) { return MONTH_ABBR.indexOf(monthAbbr) * 100 + weekNum; }
  function krMonth(monthAbbr) { return MONTH_ABBR.indexOf(monthAbbr) + 1; }
  function weekLabel(entry, fallbackKey) {
    return entry ? `${krMonth(entry.monthAbbr)}월 ${entry.weekNum}주차` : (fallbackKey || "");
  }

  let GLOBAL_WEEKS = []; // [{key:"SEP_1", monthAbbr, weekNum, title}], 최신 순
  let selectedWeekKey = null;
  const sectionCache = { kpi: null, agenda: null, trend: null };
  const globalWeekSelect = document.getElementById("globalWeekSelect");

  async function initGlobalWeeks() {
    // 로그인 검증 때 이미 kpi를 한 번 받았으면 그걸 재사용(중복 호출 방지, 리디자인 버그 4번).
    const kpiPromise = cachedKpiData ? Promise.resolve(cachedKpiData) : callBackend("kpi");
    cachedKpiData = null;
    const [kpiData, agendaData, trendData] = await Promise.all([kpiPromise, callBackend("agenda"), callBackend("trend")]);
    if (!kpiData.ok) throw new Error(kpiData.message || kpiData.error || "알 수 없는 오류");
    sectionCache.kpi = kpiData;
    sectionCache.agenda = agendaData;
    sectionCache.trend = trendData;
    KPI_GOAL = { goal: kpiData.goal, h2Goal: kpiData.h2Goal };

    // 세 섹션(KPI/AGENDA/트렌드) 중 어느 하나라도 그 주차 시트가 있으면 토글에 포함 —
    // 월+주차 조합 키를 쓰기 때문에 다음 달 시트("SEP_1" 등)가 새로 생기면 코드 수정 없이
    // 자동으로 새 옵션이 나타난다.
    const keyMap = new Map();
    [kpiData, agendaData, trendData].forEach(d => {
      Object.keys(d.byWeek || {}).forEach(k => {
        const e = d.byWeek[k];
        keyMap.set(k, { monthAbbr: e.monthAbbr, weekNum: e.weekNum });
      });
    });
    GLOBAL_WEEKS = Array.from(keyMap.entries())
      .map(([key, v]) => ({ key, monthAbbr: v.monthAbbr, weekNum: v.weekNum, title: `${krMonth(v.monthAbbr)}월 ${v.weekNum}주차` }))
      .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
  }

  function renderGlobalWeekOptions() {
    globalWeekSelect.innerHTML = "";
    GLOBAL_WEEKS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w.key;
      opt.textContent = w.title;
      globalWeekSelect.appendChild(opt);
    });
  }

  function findDefaultWeekKey() {
    const kpiData = sectionCache.kpi;
    if (kpiData) {
      const sorted = Object.keys(kpiData.byWeek || {})
        .map(k => kpiData.byWeek[k])
        .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
      for (const e of sorted) {
        if (e.data && e.data.annual && !isNaN(e.data.annual.actual)) return `${e.monthAbbr}_${e.weekNum}`;
      }
    }
    return GLOBAL_WEEKS.length ? GLOBAL_WEEKS[0].key : null;
  }

    kpiSlot.appendChild(renderKpiPlaceholder());
    monthlyTrackSlot.appendChild(renderMonthlyTrackPlaceholder());
    agendaSlot.appendChild(renderAgendaPlaceholder());
    calSlot.appendChild(renderCalPlaceholder());
    trendSlot.appendChild(renderTrendPlaceholder());
  }

  async function loadAll() {
    document.getElementById("connState").textContent = "불러오는 중…";
    const tasks = [];
    tasks.push((async () => {
      try {
        await initGlobalWeeks();
        renderGlobalWeekOptions();
        let target = (selectedWeekKey != null && GLOBAL_WEEKS.some(w => w.key === selectedWeekKey))
          ? selectedWeekKey
          : findDefaultWeekKey();
        renderForWeek(target);
      } catch (err) {
        const kpiSlot = document.getElementById("kpiSlot");
        kpiSlot.innerHTML = "";
        const errCard = kpiHeader("오류");
        errCard.classList.add("error-card2");
        errCard.appendChild(elText("p", "err-title2", "불러오지 못했어요: " + err.message));
        errCard.appendChild(elText("p", "err-sub2", "시트 구조가 바뀌었을 수 있어요. 새로고침해도 같으면 담당자에게 알려주세요."));
        kpiSlot.appendChild(errCard);
      }
    })());
    tasks.push(loadInsight());
    tasks.push(loadCalSection(document.getElementById("calSlot")));
    tasks.push(loadMonthlyTracking());
    tasks.push(loadTeamCalSection(document.getElementById("teamCalSlot")));
    await Promise.all(tasks);
    document.getElementById("connState").textContent = "";
  }

  function boot() {
    renderAllPlaceholders();
    loadAll();
  }

  document.getElementById("refreshBtn").addEventListener("click", () => loadAll());

  // 페이지 로드 시 이미 입력된 비밀번호가 있으면 바로 시도.
  (async function initGate() {
    if (storedPw()) {
      try {
        const data = await callBackend("kpi");
        if (data.ok) {
          cachedKpiData = data;
          document.body.classList.remove("locked");
          document.getElementById("pwGate").remove();
          boot();
          return;
        }
      } catch (err) {}
    }
    document.getElementById("pwInput").focus();
  })();
</script>
</body>
</html>
