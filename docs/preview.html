<!doctype html>
<html lang="ko">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간회의 대시보드 (개발 서버)</title>
<style>
  :root {
    --bg: #f3f2f7;
    --surface: #ffffff;
    --surface-2: #f1eff7;
    --ink: #1c1a24;
    --ink-soft: #5c5868;
    --ink-faint: #918da0;
    --border: #e6e3ef;
    --accent: #7c5cd6;
    --accent-soft: #ece7fa;
    --accent-ink: #4a3a8c;
    --good: #2e7d5b; --good-bg: #dcece3;
    --bad: #b0463c; --bad-bg: #f4dcd9;
    --warn: #e0973f; --warn-bg: #f7e6d1;
    --shadow: 0 1px 2px rgba(28,26,40,0.05), 0 12px 30px -16px rgba(28,26,40,0.18);
    --dark-card: #17151e;
    --dark-item: #211f2b;
    --dark-border: rgba(255,255,255,0.08);
    --dark-ink: #f1efFA;
    --dark-ink-soft: #a8a3bd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; line-height: 1.5; -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 75% 55% at 12% 18%, rgba(191,222,251,0.65) 0%, rgba(191,222,251,0) 62%),
      radial-gradient(ellipse 65% 55% at 88% 12%, rgba(255,214,232,0.65) 0%, rgba(255,214,232,0) 58%),
      radial-gradient(ellipse 75% 65% at 82% 88%, rgba(220,201,251,0.6) 0%, rgba(220,201,251,0) 62%),
      radial-gradient(ellipse 70% 60% at 15% 90%, rgba(200,225,251,0.55) 0%, rgba(200,225,251,0) 58%);
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 30px 26px 80px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  header.top h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  header.top .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .week-select-label { font-size: 11px; font-weight: 700; color: var(--ink-faint); }
  select.global-week-select { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .btn-refresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); color: var(--ink); cursor: pointer; box-shadow: var(--shadow); }
  .btn-refresh:hover { background: var(--surface-2); }
  .conn-state { font-size: 11px; color: var(--ink-faint); }

  .row { display: flex; gap: 20px; margin-bottom: 20px; align-items: stretch; }
  .row .col-half { flex: 1; display: flex; }
  @media (max-width: 980px) { .row { flex-direction: column; } }
  .row-single { margin-bottom: 20px; }

  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; width: 100%; }
  .card .card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 6px; }
  .card .card-head .htitle { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 800; }
  .card .card-head .htitle .icon-badge { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .card .card-head .badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-faint); }
  .card-head-right { display: flex; align-items: center; gap: 8px; }
  .btn-detail { font-size: 10px; font-weight: 800; padding: 3px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); text-decoration: none; white-space: nowrap; }
  .btn-detail:hover { filter: brightness(1.08); }
  .card .card-body { padding: 8px 20px 20px; flex: 1; }

  .kpi-hero { display: flex; gap: 28px; align-items: center; }
  .kpi-hero .kpi-stats { flex: 1.15; min-width: 0; }
  .kpi-hero .kpi-chart { flex: 1; min-width: 0; }
  @media (max-width: 900px) { .kpi-hero { flex-direction: column; align-items: stretch; } }
  .sublabel { font-size: 11px; font-weight: 700; color: var(--ink-faint); margin: 12px 0 8px; }
  .sublabel:first-child { margin-top: 4px; }
  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 100px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .stat-box .slabel { font-size: 10.5px; color: var(--ink-faint); margin-bottom: 4px; }
  .stat-box .sval { font-size: 16px; font-weight: 800; color: var(--ink); }
  .stat-box.placeholder .sval { color: var(--ink-faint); }
  .stat-box.bad .sval { color: var(--bad); }
  .stat-box.good .sval { color: var(--good); }
  .stat-box.accent .sval { color: var(--accent); }

  .month-kpi-headline { font-size: 20px; font-weight: 800; color: var(--ink); margin: 6px 0 14px; }

  .btn-toggle { font-size: 10px; font-weight: 800; padding: 3px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-toggle:hover { filter: brightness(1.08); }

  .mt-bar-track { background: rgba(255,255,255,0.14); }
  .mt-bar-fill { background: var(--accent); }

  .mt-week-range { font-size: 11px; font-weight: 700; color: var(--ink-faint); margin-bottom: 6px; }
  .mt-week-toprow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .mt-week-num { font-size: 22px; font-weight: 800; color: var(--ink); }
  .mt-week-goal { font-size: 12px; font-weight: 700; color: var(--ink-faint); }
  .mt-week-rate { font-size: 13px; font-weight: 800; color: var(--accent-ink); }
  .mt-week-bar-track-big { position: relative; height: 18px; max-width: 340px; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .mt-week-bar-fill-big { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; transition: width 0.3s; }

  .mt-breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .mt-breakdown-card { background: var(--surface-2); border-radius: 14px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .mt-breakdown-toprow { display: flex; align-items: center; gap: 8px; }
  .mt-breakdown-cat { flex-shrink: 0; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); white-space: nowrap; }
  .mt-breakdown-week { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); }
  .mt-breakdown-title { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.4; }

  .chart-legend { display: flex; gap: 14px; font-size: 10.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .chart-legend .lg-item { display: flex; align-items: center; gap: 5px; }
  .lg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .kpi-example-tag { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-faint); vertical-align: middle; }

  .dark-card {
    background: var(--dark-card); color: var(--dark-ink);
    --surface: var(--dark-card); --surface-2: var(--dark-item); --border: var(--dark-border);
    --ink: var(--dark-ink); --ink-soft: var(--dark-ink-soft); --ink-faint: var(--dark-ink-soft);
    --accent: #b6a3f5; --accent-soft: rgba(124,92,214,0.25); --accent-ink: #b6a3f5;
  }

  .agenda-cols { display: flex; gap: 22px; }
  @media (max-width: 760px) { .agenda-cols { flex-direction: column; } }
  .agenda-col { flex: 1; min-width: 0; }
  .agenda-col .colhead { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 10px; }
  .agenda-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; }
  .agenda-item .cat-badge { flex-shrink: 0; height: fit-content; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); white-space: nowrap; margin-top: 1px; }
  .agenda-item .body-txt { min-width: 0; }
  .agenda-item .title { font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }
  .agenda-item .title.placeholder { color: var(--ink-faint); font-weight: 600; }
  .agenda-item .desc { font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
  .agenda-col .colhead { display: flex; align-items: center; gap: 5px; }
  .agenda-col.col-wins .colhead { color: var(--good); }
  .agenda-col.col-wins .agenda-item { border-left: 3px solid var(--good); }
  .agenda-col.col-wins .agenda-item .cat-badge { color: var(--good); border-color: var(--good); }
  .agenda-col.col-share .colhead { color: var(--accent-ink); }
  .agenda-col.col-share .agenda-item { border-left: 3px solid var(--accent); }
  .agenda-col.col-share .agenda-item .cat-badge { color: var(--accent-ink); border-color: var(--accent); }
  .agenda-col.col-challenges .colhead { color: #a15a2a; }
  .agenda-col.col-challenges .agenda-item { border-left: 3px solid #a15a2a; }
  .agenda-col.col-challenges .agenda-item .cat-badge { color: #a15a2a; border-color: #a15a2a; }

  .cal-placeholder, .img-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 50px 20px; min-height: 260px; }
  .cal-placeholder .picon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .cal-placeholder .ptitle { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .cal-placeholder .psub { font-size: 11px; color: var(--ink-faint); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: 10px; font-weight: 800; color: var(--ink-faint); text-align: center; padding: 4px 0; }
  .cal-cell { background: var(--surface-2); border-radius: 8px; padding: 5px 5px 6px; height: 68px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-cell.empty { background: transparent; }
  .cal-cell.is-expanded { height: auto; overflow: visible; }
  .cal-daynum { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); margin-bottom: 2px; flex-shrink: 0; }
  .cal-entries { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-cell.is-expanded .cal-entries { overflow: visible; }
  .cal-entries-extra { display: none; flex-direction: column; gap: 2px; }
  .cal-more { display: inline-block; align-self: flex-start; font-size: 8px; font-weight: 800; color: var(--ink-soft); background: var(--border); border-radius: 999px; padding: 2px 7px; flex-shrink: 0; cursor: pointer; transition: filter .12s; }
  .cal-more:hover { filter: brightness(0.96); }
  .cal-entry { font-size: 8.5px; line-height: 1.35; border-radius: 5px; padding: 2px 4px; font-weight: 700; flex-shrink: 0; transition: opacity .12s, filter .12s; }
  .cal-entry.c-red { background: var(--bad-bg); color: var(--bad); }
  .cal-entry.c-yellow { background: #f5e6d6; color: #a15a2a; }
  .cal-entry.c-green { background: var(--good-bg); color: var(--good); }
  .cal-entry.c-none { background: var(--border); color: var(--ink-soft); }
  .cal-entry.is-dimmed { opacity: .28; filter: grayscale(.5); }
  .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 10px; color: var(--ink-soft); margin-bottom: 10px; }
  .cal-legend .legend-btn { cursor: pointer; border-radius: 999px; transition: box-shadow .12s; }
  .cal-legend .legend-btn.is-active { box-shadow: 0 0 0 2px var(--accent); }
  pre.raw-fallback { white-space: pre-wrap; font-size: 11px; color: var(--ink-soft); font-family: inherit; max-height: 380px; overflow: auto; }

  .cal-entry { cursor: pointer; transition: filter .1s; }
  .cal-entry:hover { filter: brightness(1.08); }
  .cal-entry .cal-entry-project { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .cal-entry .cal-entry-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .82; font-weight: 600; margin-top: 1px; }

  .stage-badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }

  .cal-action-popover { position: fixed; z-index: 60; width: 230px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 12px 14px 11px; }
  .cal-action-popover .cap-close { position: absolute; top: 5px; right: 7px; border: none; background: transparent; color: var(--ink-faint); font-size: 15px; line-height: 1; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  .cal-action-popover .cap-close:hover { background: var(--surface-2); color: var(--ink); }
  .cal-action-popover .cap-title { font-size: 13px; font-weight: 800; color: var(--ink); margin: 0 20px 6px 0; line-height: 1.4; }
  .cal-action-popover .cap-row { font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; }
  .cal-action-popover .cap-row + .cap-row { margin-top: 3px; }
  .cal-action-popover .cap-row b { display: block; font-size: 9px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; width: fit-content; letter-spacing: .03em; margin-bottom: 3px; }

  .cal-summary { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .cal-summary-empty { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .cal-summary-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .cal-summary-table tr.head { background: var(--surface-2); }
  .cal-summary-table tr.head td { font-size: 9.5px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; padding: 7px 8px; white-space: nowrap; }
  .cal-summary-table tr:not(.head) { border-top: 1px solid var(--border); }
  .cal-summary-table td { padding: 7px 8px; font-size: 11.5px; vertical-align: top; border-right: 1px solid var(--border); }
  .cal-summary-table td:last-child { border-right: none; }
  .cal-summary-table .cal-summary-name { width: 22%; font-weight: 700; color: var(--ink); }
  .cal-summary-empty-cell { color: var(--ink-faint); font-style: italic; }

  .card-teamcal .card-body { padding-top: 4px; }
  .teamcal-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .teamcal-navbtn { border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); width: 30px; height: 30px; border-radius: 50%; font-size: 13px; cursor: pointer; }
  .teamcal-navbtn:hover { background: var(--accent-soft); color: var(--accent-ink); }
  .teamcal-monthlabel { font-size: 16px; font-weight: 800; min-width: 110px; text-align: center; }
  .teamcal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .teamcal-cell { position: relative; min-width: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 8px 9px; height: 112px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .teamcal-cell.empty { background: transparent; }
  .teamcal-event { display: block; font-size: 10.5px; line-height: 1.4; border-radius: 6px; padding: 3px 6px; font-weight: 700; background: var(--surface); color: var(--accent-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .teamcal-event .t { font-weight: 800; opacity: 0.85; margin-right: 2px; }
  .teamcal-more { display: block; font-size: 10px; font-weight: 800; color: var(--ink-faint); padding: 1px 6px; flex-shrink: 0; }
  @media (max-width: 760px) { .teamcal-cell { height: 90px; } }

  /* 팀 일정 캘린더: 클릭 대신 마우스를 올리면 그 칸이 카드처럼 커지면서 전체 일정이 보임.
     칸 자체 높이는 그대로 두고(그리드 행이 늘어나 다른 칸이 밀리는 걸 방지), 확장 패널만
     absolute로 그 위에 겹쳐 보여준다. */
  .teamcal-hover-panel {
    position: absolute; top: 0; left: 0; right: 0; min-height: 100%;
    background: var(--accent); border-radius: 10px; box-shadow: var(--shadow);
    padding: 8px 8px 9px; display: flex; flex-direction: column; gap: 3px;
    z-index: 40; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .12s ease;
  }
  .teamcal-hover-panel .cal-daynum { color: #fff; }
  .teamcal-hover-panel .teamcal-event { white-space: normal; text-overflow: clip; background: rgba(255,255,255,0.18); color: #fff; }
  .teamcal-hover-panel .teamcal-event .t { color: #fff; }
  .teamcal-cell.has-events:hover { z-index: 30; overflow: visible; }
  .teamcal-cell.has-events:hover .teamcal-hover-panel { opacity: 1; visibility: visible; pointer-events: auto; max-height: none; overflow: visible; }

  .card-news .card-head { border-bottom: 2px solid var(--border); padding: 16px 20px 10px; align-items: flex-end; }
  .card-news .news-eyebrow { font-size: 10px; letter-spacing: .18em; font-weight: 700; color: var(--ink-faint); margin-bottom: 3px; }
  .card-news .htitle { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .card-news .badge { background: transparent; color: var(--ink-faint); }
  .news-section { margin-bottom: 10px; border-radius: 14px; padding: 12px 15px 3px; }
  .news-section:last-child { margin-bottom: 0; }
  .news-section .ns-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; display: inline-block; margin-bottom: 7px; padding: 2px 9px; border-radius: 999px; }
  .news-headline { padding: 7px 0; border-top: 1px solid var(--border); }
  .news-headline:first-of-type { border-top: none; padding-top: 0; }
  .news-headline.placeholder { font-style: italic; font-weight: 600; }
  .news-headline .nh-artist { display: block; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .news-headline .nh-content { display: block; font-size: 12.5px; line-height: 1.42; font-weight: 700; }
  .news-headline .voc { display: block; font-size: 10.5px; font-style: italic; line-height: 1.4; margin-top: 6px; padding: 7px 9px; border-radius: 9px; }

  .news-section.chance { background: var(--dark-card); color: var(--dark-ink); }
  .news-section.chance .ns-label { color: #b6a3f5; background: rgba(124,92,214,.28); }
  .news-section.chance .news-headline { border-top-color: var(--dark-border); }
  .news-section.chance .nh-artist { color: #b6a3f5; }
  .news-section.chance .nh-content { color: var(--dark-ink); }
  .news-section.chance .news-headline.placeholder { color: var(--dark-ink-soft); }
  .news-section.chance .voc { background: rgba(255,255,255,.07); color: var(--dark-ink-soft); }

  .news-section.risk { background: var(--bad-bg); }
  .news-section.risk .ns-label { color: var(--bad); background: rgba(176,70,60,.14); }
  .news-section.risk .news-headline { border-top-color: rgba(176,70,60,.18); }
  .news-section.risk .nh-artist { color: var(--bad); }
  .news-section.risk .nh-content { color: var(--ink); }
  .news-section.risk .news-headline.placeholder { color: var(--ink-faint); }
  .news-section.risk .voc { background: rgba(176,70,60,.09); color: var(--ink-soft); }

  .news-section.extra1 { background: #fdf1dc; }
  .news-section.extra1 .ns-label { color: #a15a2a; background: rgba(161,90,42,.16); }
  .news-section.extra1 .news-headline { border-top-color: rgba(161,90,42,.18); }
  .news-section.extra1 .nh-artist { color: #a15a2a; }
  .news-section.extra1 .nh-content { color: var(--ink); }
  .news-section.extra1 .news-headline.placeholder { color: var(--ink-faint); }
  .news-section.extra1 .voc { background: rgba(161,90,42,.09); color: var(--ink-soft); }

  .news-section.extra2 { background: #dcf1ee; }
  .news-section.extra2 .ns-label { color: #1e7b74; background: rgba(30,123,116,.16); }
  .news-section.extra2 .news-headline { border-top-color: rgba(30,123,116,.18); }
  .news-section.extra2 .nh-artist { color: #1e7b74; }
  .news-section.extra2 .nh-content { color: var(--ink); }
  .news-section.extra2 .news-headline.placeholder { color: var(--ink-faint); }

  .insight-bar .insight-text { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  @media (max-width: 700px) { .insight-bar { border-radius: 20px; align-items: flex-start; } }

  /* ---- 비밀번호 게이트 ---- */
  #pwGate { position: fixed; inset: 0; background: rgba(23,21,30,.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }

  #pwGate .pw-box h2 { font-size: 15px; margin: 0 0 6px; }
  #pwGate .pw-box p { font-size: 12px; color: var(--ink-faint); margin: 0 0 16px; }
  #pwGate input { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; text-align: center; }

  #pwGate button:hover { filter: brightness(1.06); }
  #pwGate .pw-err { color: var(--bad); font-size: 11.5px; margin-top: 8px; min-height: 14px; }

  /* 개발 서버 표시 — 운영(index.html)과 구분되도록 항상 최상단에 고정 */

  body { padding-top: 36px; }
</style>
</head>
<body class="locked">

<div id="devBanner">🔧 개발 서버 — 팀원 공유용 아님 (엘라 확인 전용)</div>

<div id="pwGate">
  <div class="pw-box">
    <h2>주간회의 대시보드</h2>
    <p>팀 공용 비밀번호를 입력하세요</p>
    <input type="password" id="pwInput" placeholder="비밀번호">
    <button id="pwSubmit">입장</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">광고IP사업팀</p>
      <h1>주간회의 대시보드</h1>
    </div>
    <div class="top-actions">
      <label class="week-select-label" for="globalWeekSelect">주차</label>
      <select class="global-week-select" id="globalWeekSelect"></select>
      <span class="conn-state" id="connState"></span>
      <button class="btn-refresh" id="refreshBtn">↻ 새로고침</button>
    </div>
  </header>

  <div id="insightSlot"></div>
  <div class="row-single" id="kpiSlot"></div>
  <div class="row-single" id="monthlyTrackSlot"></div>
  <div class="row-single" id="agendaSlot"></div>
  <div class="row">
    <div class="col-half" id="calSlot"></div>
    <div class="col-half" id="trendSlot"></div>
  </div>
  <div class="row-single" id="teamCalSlot"></div>

  <footer class="note">
    데이터 출처: Google Drive · DB대시보드/주간회의 폴더, Google Calendar · 광고 IP 사업팀 캘린더 (Apps Script를 통해 조회, 팀 공용 비밀번호로만 접근 가능) · 원본 파일이 바뀌면 새로고침 시 자동으로 최신 자료가 반영됩니다.
  </footer>
</div>

<script>
  // ⚠️ Apps Script 배포 후 여기에 웹 앱 URL(.../exec)을 붙여넣을 것
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyF12lwBJbJHFF5af15lNBIhCxMxBDzGbG8m8c1PWXJLLvT23dOL92GKcNivl9QHaOn/exec";

  const KPI_RAW_URL = "https://docs.google.com/spreadsheets/d/1HlGmNBPK69IWX3OqfVV6Q-MezsXQAG6rC6tdi7cgJmA/edit?usp=sharing";
  // 목표(연간/하반기) 숫자는 코드에 안 두고 Apps Script 응답에서 받아옴(비공개 저장소에만 두려고).
  let KPI_GOAL = { goal: null, h2Goal: null };

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  // ---- 비밀번호 게이트 + 데이터 레이어 ----
  function storedPw() { try { return sessionStorage.getItem("dashPw") || ""; } catch { return ""; } }
  function setStoredPw(pw) { try { sessionStorage.setItem("dashPw", pw); } catch {} }

  async function callBackend(section, extraParams) {
    const params = new URLSearchParams(Object.assign({ section, password: storedPw() }, extraParams || {}));
    const res = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
    return res.json();
  }

  document.getElementById("pwSubmit").addEventListener("click", submitPw);
  document.getElementById("pwInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") submitPw(); });
  async function submitPw() {
    const pw = document.getElementById("pwInput").value;
    const errEl = document.getElementById("pwErr");
    errEl.textContent = "확인 중…";
    setStoredPw(pw);
    try {
      const data = await callBackend("kpi");
      if (!data.ok) { setStoredPw(""); errEl.textContent = "비밀번호가 틀렸어요."; return; }
      document.body.classList.remove("locked");
      document.getElementById("pwGate").remove();
      boot();
    } catch (err) {
      setStoredPw("");
      errEl.textContent = "서버에 연결할 수 없어요.";
    }
  }

  // ============================================================
  // ① KPI 현황
  // ============================================================
  function kpiHeader(badgeText) {
    const card = el("div", "card dark-card");
    const head = el("div", "card-head");
    head.appendChild(el("span", "htitle", `<span class="icon-badge">📊</span> 2026 KPI 현황`));
    const right = el("div", "card-head-right");
    right.appendChild(el("span", "badge", badgeText));
    const rawLink = document.createElement("a");
    rawLink.className = "btn-detail";
    rawLink.href = KPI_RAW_URL;
    rawLink.target = "_blank";
    rawLink.rel = "noopener noreferrer";
    rawLink.textContent = "상세보기 ↗";
    right.appendChild(rawLink);
    head.appendChild(right);
    card.appendChild(head);
    return card;
  }

  function statBox(label, value, cls) {
    const box = el("div", "stat-box" + (cls ? " " + cls : ""));
    box.appendChild(el("div", "slabel", label));
    box.appendChild(el("div", "sval", value));
    return box;
  }

  let sparkChartUid = 0;
  function sparkChart(points, width) {
    const W = width || 260, H = 100, padX = 14, padTop = 24, padBottom = 22;
    const plotH = H - padTop - padBottom;
    const n = points.length;
    const baseY = padTop + plotH;
    const vals = points.map(p => p.actual);
    let vMin = Math.min(...vals), vMax = Math.max(...vals);
    if (vMax - vMin < 0.03) { const mid = (vMax + vMin) / 2; vMin = mid - 0.015; vMax = mid + 0.015; }
    const domPad = (vMax - vMin) * 0.3;
    const domMin = Math.max(0, vMin - domPad), domMax = Math.min(1, vMax + domPad);
    const xAt = i => padX + (n === 1 ? (W - 2 * padX) / 2 : (i / (n - 1)) * (W - 2 * padX));
    const yAt = v => padTop + (1 - (Math.max(domMin, Math.min(domMax, v)) - domMin) / (domMax - domMin)) * plotH;
    const actualPts = points.map((p, i) => [xAt(i), yAt(p.actual)]);
    const line = pts => pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const areaPath = line(actualPts)
      + ` L${actualPts[n - 1][0].toFixed(1)},${baseY.toFixed(1)} L${actualPts[0][0].toFixed(1)},${baseY.toFixed(1)} Z`;
    const dots = actualPts.map((p, i) => {
      const last = i === n - 1;
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last ? 3.4 : 2.2}" style="fill:var(--accent)"/>`;
    }).join("");
    const labels = points.map((p, i) => {
      const anchor = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
      return `<text x="${xAt(i).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" style="font-size:8px;fill:var(--ink-faint)">${p.label}</text>`;
    }).join("");
    const badges = points.map((p, i) => {
      const pct = Math.round(p.actual * 100) + "%";
      const bw = 7 + pct.length * 4, bh = 11;
      const bx = Math.max(1, Math.min(W - bw - 1, xAt(i) - bw / 2));
      const by = Math.max(1, yAt(p.actual) - bh - 6);
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh}" rx="3.5" style="fill:var(--accent)"/>`
        + `<text x="${(bx + bw / 2).toFixed(1)}" y="${(by + bh / 2 + 2.3).toFixed(1)}" text-anchor="middle" style="font-size:6.5px;font-weight:800;fill:#fff">${pct}</text>`;
    }).join("");
    const gid = "sparkFade" + (sparkChartUid++);
    return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.32"/>
          <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/>
        </linearGradient>
      </defs>
      <line x1="${padX}" y1="${baseY}" x2="${W - padX}" y2="${baseY}" style="stroke:var(--border);stroke-width:1"/>
      <path d="${areaPath}" style="fill:url(#${gid});stroke:none"/>
      <path d="${line(actualPts)}" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/>
      ${dots}${badges}${labels}
    </svg>`;
  }

  function kpiStatsBlock(rows) {
    const wrap = el("div", "kpi-stats");
    rows.forEach(r => {
      wrap.appendChild(el("div", "sublabel", r.sublabel));
      const row = el("div", "stat-row");
      r.tiles.forEach(t => row.appendChild(statBox(t.label, t.value, t.cls)));
      wrap.appendChild(row);
    });
    return wrap;
  }
  function kpiChartBlock(points, dim) {
    const wrap = el("div", "kpi-chart");
    wrap.appendChild(el("div", "sublabel", "주별 달성률 추이" + (dim ? ` <span class="kpi-example-tag">예시</span>` : "")));
    if (points && points.length >= 2) {
      const legend = el("div", "chart-legend");
      legend.innerHTML = `<span class="lg-item"><span class="lg-dot"></span>실제 달성률</span>`;
      wrap.appendChild(legend);
      const chartEl = el("div", null, sparkChart(points));
      if (dim) chartEl.style.opacity = "0.35";
      wrap.appendChild(chartEl);
    } else {
      wrap.appendChild(el("div", "state-msg", "데이터가 쌓이는 중입니다 — 매주 새 파일을 올리면 추이가 표시됩니다 (현재 " + (points ? points.length : 0) + "건)."));
    }
    return wrap;
  }
  function kpiHeroBody(statsRows, chartPoints, dimChart) {
    const body = el("div", "card-body");
    const hero = el("div", "kpi-hero");
    hero.appendChild(kpiStatsBlock(statsRows));
    hero.appendChild(kpiChartBlock(chartPoints, dimChart));
    body.appendChild(hero);
    return body;
  }

  function renderKpiPlaceholder() {
    const card = kpiHeader("예시");
    const demo = [0.1,0.14,0.2,0.25,0.28,0.3,0.32,0.34].map((v,i)=>({actual:v,label:(i+1)+"주"}));
    card.appendChild(kpiHeroBody([
      { sublabel: "2026년 전체", tiles: [
        { label: "2026 KPI 목표", value: "00억원", cls: "placeholder" },
        { label: "달성률", value: "00%", cls: "placeholder" },
        { label: "잔여 KPI", value: "00억원", cls: "placeholder" },
      ] },
      { sublabel: "하반기", tiles: [
        { label: "하반기 KPI 목표", value: "00억원", cls: "placeholder" },
        { label: "달성률", value: "00%", cls: "placeholder" },
      ] },
    ], demo, true));
    return card;
  }

  function formatRemainKpi(goal, actual) {
    const diff = goal - actual;
    if (diff > 0) return diff.toFixed(1) + "억원";
    if (diff < 0) return "+" + Math.abs(diff).toFixed(1) + "억원";
    return "0억원";
  }
  function stripUnit(s) {
    if (s == null) return NaN;
    const m = String(s).match(/-?[\d.]+/);
    return m ? parseFloat(m[0]) : NaN;
  }

  // 목표(goal/h2Goal)는 KPI_GOAL(서버에서 받은 값) 사용, 실적(actual/h2Actual)만 status에서 사용.
  function computeKpiFromStatus(status) {
    if (!status.annual || isNaN(status.annual.actual)) return null;
    const goal = KPI_GOAL.goal, h2Goal = KPI_GOAL.h2Goal;
    const actual = status.annual.actual;
    const h2Actual = status.h2 && !isNaN(status.h2.actual) ? status.h2.actual : null;
    return {
      goal, actual,
      ach: (actual / goal) * 100,
      remainLabel: formatRemainKpi(goal, actual),
      h2Goal, h2Actual,
      h2Ach: h2Actual != null ? (h2Actual / h2Goal) * 100 : null,
    };
  }

  function buildKpiTrendPoints(uptoKey) {
    const byWeek = (sectionCache.kpi && sectionCache.kpi.byWeek) || {};
    const target = byWeek[uptoKey];
    if (!target) return [];
    const uptoOrder = weekOrder(target.monthAbbr, target.weekNum);
    const entries = Object.keys(byWeek).map(k => byWeek[k])
      .filter(e => weekOrder(e.monthAbbr, e.weekNum) <= uptoOrder)
      .sort((a, b) => weekOrder(a.monthAbbr, a.weekNum) - weekOrder(b.monthAbbr, b.weekNum));
    const points = [];
    for (const e of entries) {
      const status = e.data;
      if (!status || !status.annual || isNaN(status.annual.actual)) continue;
      points.push({ actual: status.annual.actual / KPI_GOAL.goal, label: e.monthAbbr + "_" + e.weekNum });
    }
    return points;
  }

  function loadKpiForWeek(key) {
    const entry = sectionCache.kpi && sectionCache.kpi.byWeek[key];
    const label = weekLabel(entry, key);
    const slotEl = document.getElementById("kpiSlot");
    const status = entry && entry.data;
    if (!status) {
      slotEl.innerHTML = "";
      const card = kpiHeader(label);
      const body = el("div", "card-body");
      body.appendChild(el("div", "state-msg", "이 주차 자료가 아직 없어요."));
      card.appendChild(body);
      slotEl.appendChild(card);
      return;
    }
    const computed = computeKpiFromStatus(status);
    if (!computed) {
      slotEl.innerHTML = "";
      const card = kpiHeader(label);
      const body = el("div", "card-body");
      body.appendChild(el("div", "state-msg", "이 주차엔 아직 실적이 입력되지 않았어요."));
      card.appendChild(body);
      slotEl.appendChild(card);
      return;
    }
    const trendPoints = buildKpiTrendPoints(key);
    const card = kpiHeader(label);
    card.appendChild(kpiHeroBody([
      { sublabel: "2026년 전체", tiles: [
        { label: "2026 KPI 목표", value: computed.goal.toFixed(0) + "억원" },
        { label: "실적", value: computed.actual.toFixed(1) + "억원" },
        { label: "달성률", value: computed.ach.toFixed(0) + "%", cls: computed.ach >= 100 ? "good" : computed.ach < 60 ? "bad" : "accent" },
        { label: "잔여 KPI", value: computed.remainLabel, cls: "accent" },
      ] },
      { sublabel: "하반기", tiles: computed.h2Actual != null ? [
        { label: "하반기 KPI 목표", value: computed.h2Goal.toFixed(0) + "억원" },
        { label: "하반기 실적", value: computed.h2Actual.toFixed(1) + "억원" },
        { label: "달성률", value: computed.h2Ach.toFixed(0) + "%", cls: computed.h2Ach >= 100 ? "good" : computed.h2Ach < 60 ? "bad" : "accent" },
      ] : [
        { label: "하반기 실적", value: "-", cls: "placeholder" },
      ] },
    ], trendPoints, false));
    slotEl.innerHTML = "";
    slotEl.appendChild(card);
  }

  // ============================================================
  // ①-2 월별 트래킹
  // ============================================================
  let monthlyTrackExpanded = false;

  function monthlyTrackHeader(badgeText, onToggleClick, toggleLabel) {
    const card = el("div", "card dark-card");
    const head = el("div", "card-head");
    head.appendChild(el("span", "htitle", `<span class="icon-badge">📈</span> 월별 트래킹`));
    const right = el("div", "card-head-right");
    right.appendChild(el("span", "badge", badgeText));
    if (onToggleClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn-toggle";
      btn.textContent = toggleLabel;
      btn.addEventListener("click", onToggleClick);
      right.appendChild(btn);
    }
    head.appendChild(right);
    card.appendChild(head);
    return card;
  }

  function mtFillColor(rateNum) {
    return rateNum >= 100 ? "var(--accent)" : "var(--warn)";
  }

  // 이번 달 KPI 전체(목표/실적/달성률)를 보여주는 기본 뷰.
  // 값이 비어있으면 0으로 표기 — null/대시(-) 대신 0을 보여달라는 요청.
  // Apps Script에서 NaN을 JSON으로 보내면 JSON.stringify가 NaN을 null로 바꿔버리기 때문에
  // null도 반드시 같이 걸러줘야 함(isNaN(null)은 false라서 NaN 체크만으로는 안 잡힘).
  function numOr0(n) { return (n === null || n === undefined || isNaN(n)) ? 0 : n; }

  function monthlyOverallBody(data, isPlaceholder) {
    const goalNum = isPlaceholder ? 0 : numOr0(data.goal);
    const actualNum = isPlaceholder ? 0 : numOr0(data.actual);
    const adNum = isPlaceholder ? 0 : numOr0(data.adActual);
    const ipNum = isPlaceholder ? 0 : numOr0(data.ipActual);
    const rateNum = goalNum > 0 ? (actualNum / goalNum) * 100 : 0;
    const colorVar = mtFillColor(rateNum);
    const fillPct = Math.max(0, Math.min(100, rateNum));

    const wrap = el("div", "mt-week-big");
    const top = el("div", "mt-week-toprow");
    const numEl = el("span", "mt-week-num", isPlaceholder ? "00억" : `${actualNum}억`);
    numEl.style.color = colorVar;
    top.appendChild(numEl);
    top.appendChild(el("span", "mt-week-goal", `/ 목표 ${isPlaceholder ? "00" : goalNum}억`));
    const rateEl = el("span", "mt-week-rate", `${Math.round(rateNum)}%`);
    rateEl.style.color = colorVar;
    top.appendChild(rateEl);
    wrap.appendChild(top);

    const track = el("div", "mt-week-bar-track-big mt-bar-track");
    const fill = el("div", "mt-week-bar-fill-big mt-bar-fill");
    fill.style.cssText = `width:${fillPct}%; background:${colorVar};`;
    track.appendChild(fill);
    wrap.appendChild(track);

    const row = el("div", "stat-row");

  const CAL_DOW = ["일", "월", "화", "수", "목", "금", "토"];

  function isDateInMonth(d, year, month) {
    return !!d && d.year === year && d.month === month;

  function closeActionPopover() {
    const existing = document.querySelector(".cal-action-popover");

    closeActionPopover();

    const popRect = pop.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
    if (top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
    pop.style.left = Math.max(8, left) + "px";
    pop.style.top = Math.max(8, top) + "px";
  }

  function buildTrackerCalendarWeeks(year, month, items) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, entry) => { (byDay[day] = byDay[day] || []).push(entry); };
    items.forEach(it => {
      if (isDateInMonth(it.reviewDate, year, month)) {
        push(it.reviewDate.day, { kind: "review", colorCls: "c-yellow", project: it.project, detail: null, item: it });
      }
      if (isDateInMonth(it.nextDue, year, month)) {
        push(it.nextDue.day, { kind: "duedate", colorCls: "c-red", project: it.project, detail: it.action || "Next Due", item: it });
      }
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dateObj: new Date(year, month - 1, d), entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  const CAL_MAX_VISIBLE = 1;

  function renderTrackerCalendarGrid(weeks) {
    const wrap = document.createElement("div");
    const legend = el("div", "cal-legend");
    let activeKind = null;
    const applyFilter = () => {
      wrap.querySelectorAll(".cal-entry[data-kind]").forEach(t => {
        t.classList.toggle("is-dimmed", !!activeKind && t.dataset.kind !== activeKind);
      });
      wrap.querySelectorAll(".legend-btn[data-kind]").forEach(b => {
        b.classList.toggle("is-active", activeKind === b.dataset.kind);
      });
    };
    [["review", "c-yellow", "Review 예정"], ["duedate", "c-red", "Next Due (금월 Action 마감)"]].forEach(([kind, cls, label]) => {
      const btn = el("span", `cal-entry ${cls} legend-btn`, label);
      btn.dataset.kind = kind;
      btn.style.padding = "2px 8px";
      btn.addEventListener("click", () => { activeKind = activeKind === kind ? null : kind; applyFilter(); });
      legend.appendChild(btn);
    });
    wrap.appendChild(legend);
    const grid = el("div", "cal-grid");
    CAL_DOW.forEach(d => grid.appendChild(el("div", "cal-dow", d)));
    const makeTag = e => {
      const tag = el("div", "cal-entry " + e.colorCls);
      tag.dataset.kind = e.kind;
      tag.appendChild(el("div", "cal-entry-project", e.project));
      if (e.detail) tag.appendChild(el("div", "cal-entry-detail", e.detail));
      tag.title = e.detail ? `${e.project} / ${e.detail}` : e.project;
      tag.addEventListener("click", (ev) => { ev.stopPropagation(); showActionPopover(tag, e.item); });
      return tag;
    };
    weeks.forEach(week => {
      week.forEach(cellData => {
        if (!cellData) { grid.appendChild(el("div", "cal-cell empty")); return; }
        const cell = el("div", "cal-cell");
        cell.appendChild(el("div", "cal-daynum", String(cellData.day)));
        const entriesWrap = el("div", "cal-entries");
        cellData.entries.slice(0, CAL_MAX_VISIBLE).forEach(e => entriesWrap.appendChild(makeTag(e)));
        const hiddenEntries = cellData.entries.slice(CAL_MAX_VISIBLE);
        if (hiddenEntries.length > 0) {
          const extraWrap = el("div", "cal-entries-extra");
          hiddenEntries.forEach(e => extraWrap.appendChild(makeTag(e)));
          const moreBtn = el("span", "cal-more", "더보기");
          moreBtn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const expanded = cell.classList.toggle("is-expanded");
            extraWrap.style.display = expanded ? "flex" : "none";
            moreBtn.textContent = expanded ? "접기" : "더보기";
          });
          entriesWrap.appendChild(extraWrap);
          entriesWrap.appendChild(moreBtn);
        }
        cell.appendChild(entriesWrap);
        grid.appendChild(cell);
      });
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderTrackerSummary(items, year, month) {
    const list = items.filter(it => isDateInMonth(it.reviewDate, year, month) || isDateInMonth(it.nextDue, year, month));
    const earliestDay = it => Math.min(
      ...[isDateInMonth(it.reviewDate, year, month) ? it.reviewDate.day : null,
          isDateInMonth(it.nextDue, year, month) ? it.nextDue.day : null].filter(d => d != null));
    list.sort((a, b) => earliestDay(a) - earliestDay(b));

    const wrap = el("div", "cal-summary");
    if (!list.length) {
      wrap.appendChild(el("div", "cal-summary-empty", "이번 달 Review 예정 또는 Next Due 도래 프로젝트가 없어요."));
      return wrap;
    }
    const table = document.createElement("table");
    table.className = "cal-summary-table";
    const thead = document.createElement("tr");
    thead.className = "head";
    ["프로젝트", "현재 단계", "금월 Action", "Next Due", "Next Plan"].forEach(h => {
      const th = document.createElement("td");
      th.textContent = h;
      thead.appendChild(th);
    });
    table.appendChild(thead);
    list.forEach(it => {
      const tr = document.createElement("tr");
      const vals = [
        it.project,
        it.stage,
        it.action,
        it.nextDue ? `${it.nextDue.month}/${it.nextDue.day}` : "",
        it.nextPlan,
      ];
      vals.forEach((v, i) => {
        const td = document.createElement("td");
        if (i === 0) td.className = "cal-summary-name";
        if (!v) td.innerHTML = `<span class="cal-summary-empty-cell">-</span>`;
        else if (i === 1) td.innerHTML = `<span class="stage-badge">${v}</span>`;
        else td.textContent = v;
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  async function loadCalSection(slotEl) {
    slotEl.innerHTML = "";

    try {
      const data = await callBackend("calendar");
      if (!data.ok) throw new Error(data.message || data.error || "알 수 없는 오류");
      const currentItems = data.items || [];
      const card = calCard("검토 Tracker");

      const today = new Date();
      let navYear = today.getFullYear(), navMonth = today.getMonth() + 1;
      const nav = el("div", "teamcal-nav");
      const prevBtn = document.createElement("button");
      prevBtn.type = "button"; prevBtn.className = "teamcal-navbtn"; prevBtn.textContent = "◀";
      const nextBtn = document.createElement("button");
      nextBtn.type = "button"; nextBtn.className = "teamcal-navbtn"; nextBtn.textContent = "▶";

      nav.appendChild(prevBtn); nav.appendChild(navLabel); nav.appendChild(nextBtn);

      body.appendChild(nav);
      body.appendChild(gridSlot);
      renderMonthView();
      card.appendChild(body);
      slotEl.innerHTML = "";
      slotEl.appendChild(card);

  function trendHeadline(item, isPlaceholder) {
    const div = el("div", "news-headline" + (isPlaceholder ? " placeholder" : ""));

      return div;
    }
    const splitLines = s => s.split(/\s*\/\/\s*/).filter(Boolean).join("<br>");
    const body = splitLines(item.content || "");
    let html = "";
    if (item.label) html += `<span class="nh-artist">${item.label}</span>`;
    html += `<span class="nh-content">${body}</span>`;
    if (item.voc) {
      const vocParts = item.voc.split(/\s*\/\/\s*/).filter(Boolean);
      const vocLines = (vocParts.length ? vocParts : [item.voc.trim()]).map(v => `“${v}”`).join("<br>");
      html += `<div class="voc">${vocLines}</div>`;
    }
    div.innerHTML = html;
    return div;
  }

    const card = el("div", "card card-teamcal");
    const head = el("div", "card-head");
    head.appendChild(el("span", "htitle", `<span class="icon-badge">🗓️</span> 팀 일정 캘린더`));
    head.appendChild(el("span", "badge", TEAM_CAL_LABEL));
    card.appendChild(head);
    return card;
  }

  function eventDateRange(ev) {
    const s = ev.start && (ev.start.dateTime || ev.start.date);
    if (!s) return null;
    const isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
    const start = new Date(s);
    const eRaw = ev.end && (ev.end.dateTime || ev.end.date);
    let end = eRaw ? new Date(eRaw) : new Date(s);
    if (isAllDay) end = new Date(end.getTime() - 86400000);
    return { start, end, isAllDay };
  }

  function buildTeamCalWeeks(year, month, events) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow = new Date(year, month - 1, 1).getDay();
    const byDay = {};
    const push = (day, item) => { (byDay[day] = byDay[day] || []).push(item); };
    events.forEach(ev => {
      const range = eventDateRange(ev);
      if (!range) return;
      const title = ev.summary || "(제목 없음)";
      const timeLabel = range.isAllDay ? null : range.start.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
      let d = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate());
      const last = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate());
      let guard = 0;
      while (d <= last && guard < 366) {
        if (d.getFullYear() === year && d.getMonth() === month - 1) {
          push(d.getDate(), { title, time: timeLabel });
        }
        d.setDate(d.getDate() + 1);
        guard++;
      }
    });
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, dateObj: new Date(year, month - 1, d), entries: byDay[d] || [] });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  const TEAMCAL_MAX_VISIBLE = 3;

  function renderTeamCalGrid(weeks) {
    const grid = el("div", "teamcal-grid");
    CAL_DOW.forEach(d => grid.appendChild(el("div", "cal-dow", d)));
    weeks.forEach(week => {
      week.forEach(cellData => {
        if (!cellData) { grid.appendChild(el("div", "teamcal-cell empty")); return; }
        const hasEvents = cellData.entries.length > 0;
        const cell = el("div", "teamcal-cell" + (hasEvents ? " has-events" : ""));
        cell.appendChild(el("div", "cal-daynum", String(cellData.day)));
        cellData.entries.slice(0, TEAMCAL_MAX_VISIBLE).forEach(e => {
          const item = el("div", "teamcal-event", (e.time ? `<span class="t">${e.time}</span> ` : "") + e.title);
          item.title = e.title;
          cell.appendChild(item);
        });
        const hidden = cellData.entries.length - TEAMCAL_MAX_VISIBLE;
        if (hidden > 0) cell.appendChild(el("span", "teamcal-more", `+${hidden}개 더`));
        if (hasEvents) {
          // 클릭 대신 마우스를 올리면(hover) 이 칸이 카드처럼 커지면서 전체 일정을 보여줌.
          const panel = el("div", "teamcal-hover-panel");
          panel.appendChild(el("div", "cal-daynum", String(cellData.day)));
          cellData.entries.forEach(e => {
            panel.appendChild(el("div", "teamcal-event", (e.time ? `<span class="t">${e.time}</span> ` : "") + e.title));
          });
          cell.appendChild(panel);
        }
        grid.appendChild(cell);
      });
    });
    return grid;
  }

  async function loadTeamCalSection(slotEl) {
    const card = teamCalCard();
    const body = el("div", "card-body");
    const nav = el("div", "teamcal-nav");
    const prevBtn = document.createElement("button");
    prevBtn.type = "button"; prevBtn.className = "teamcal-navbtn"; prevBtn.textContent = "◀";
    const nextBtn = document.createElement("button");
    nextBtn.type = "button"; nextBtn.className = "teamcal-navbtn"; nextBtn.textContent = "▶";
    const label = el("div", "teamcal-monthlabel", "");
    nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
    const gridSlot = el("div", null);
    body.appendChild(nav);
    body.appendChild(gridSlot);
    card.appendChild(body);

    const today = new Date();
    let year = today.getFullYear(), month = today.getMonth() + 1;

    async function render() {
      label.textContent = `${year}년 ${month}월`;
      gridSlot.innerHTML = "";
      gridSlot.appendChild(el("div", "state-msg", "불러오는 중…"));
      try {
        const data = await callBackend("teamCalendar", { year, month });
        if (!data.ok) throw new Error(data.message || data.error || "알 수 없는 오류");
        const events = data.events || [];
        gridSlot.innerHTML = "";
        gridSlot.appendChild(renderTeamCalGrid(buildTeamCalWeeks(year, month, events)));
      } catch (err) {
        gridSlot.innerHTML = "";
        gridSlot.appendChild(el("div", "state-msg err", "불러오지 못했어요: " + err.message));
      }
    }
    prevBtn.onclick = () => { month--; if (month < 1) { month = 12; year--; } render(); };
    nextBtn.onclick = () => { month++; if (month > 12) { month = 1; year++; } render(); };

    slotEl.innerHTML = "";
    slotEl.appendChild(card);
    await render();
  }

  // ============================================================
  // 최상단 AI 인사이트 바 — 9월부터 하드코딩 대신, 이번 주 신규 실적 + 연간 기여 상위 프로젝트를
  // 시트 데이터에서 자동으로 뽑아 문장으로 조합해서 보여줌(Apps Script "insight" 섹션 응답 사용).
  // ============================================================
  let insightData = null;

  function buildInsightText(data) {
    if (!data || (!data.thisWeek.length && !data.topAnnual.length)) {
      return "데이터가 쌓이면 이번 주 신규 실적과 연간 기여 상위 프로젝트를 자동으로 분석해서 보여드려요.";
    }
    const parts = [];
    if (data.thisWeek.length) {
      const items = data.thisWeek
        .map(w => `${w.project}(${numOr0(w.actual)}억, 목표 기여 ${numOr0(w.contribPct)}%)`)
        .join(", ");
      parts.push(`${data.weekLabel} 신규 실적은 ${items}입니다.`);
    } else if (data.weekLabel) {
      parts.push(`${data.weekLabel}엔 새로 반영된 실적이 아직 없어요.`);
    }
    if (data.topAnnual.length) {
      const top = data.topAnnual.slice(0, 3).map(p => `${p.name}(${p.amount}억)`).join(", ");
      parts.push(`연간 실적에 가장 큰 영향을 미치고 있는 프로젝트는 ${top} 순이에요.`);
    }
    return parts.join(" ");
  }

  function renderInsightBar() {
    const slot = document.getElementById("insightSlot");
    slot.innerHTML = "";
    const bar = el("div", "insight-bar");
    bar.appendChild(el("span", "insight-icon", "✨"));
    bar.appendChild(el("div", "insight-text", buildInsightText(insightData)));
    slot.appendChild(bar);
  }

  async function loadInsight() {
    try {
      const data = await callBackend("insight");
      if (!data.ok) throw new Error(data.message || data.error || "알 수 없는 오류");
      insightData = data;
    } catch (err) {
      insightData = null;
    }
    renderInsightBar();
  }

  // ============================================================
  // 전체 주차 토글 — KPI/팀 AGENDA/트렌드 리포트 3개 카드가 공유하는 단일 주차 선택
  // ============================================================
  const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  function weekOrder(monthAbbr, weekNum) { return MONTH_ABBR.indexOf(monthAbbr) * 100 + weekNum; }
  function krMonth(monthAbbr) { return MONTH_ABBR.indexOf(monthAbbr) + 1; }
  function weekLabel(entry, fallbackKey) {
    return entry ? `${krMonth(entry.monthAbbr)}월 ${entry.weekNum}주차` : (fallbackKey || "");
  }

  let GLOBAL_WEEKS = []; // [{key:"SEP_1", monthAbbr, weekNum, title}], 최신 순
  let selectedWeekKey = null;
  const sectionCache = { kpi: null, agenda: null, trend: null };
  const globalWeekSelect = document.getElementById("globalWeekSelect");

  async function initGlobalWeeks() {
    const [kpiData, agendaData, trendData] = await Promise.all([
      callBackend("kpi"), callBackend("agenda"), callBackend("trend"),
    ]);
    if (!kpiData.ok) throw new Error(kpiData.message || kpiData.error || "알 수 없는 오류");
    sectionCache.kpi = kpiData;
    sectionCache.agenda = agendaData;
    sectionCache.trend = trendData;
    KPI_GOAL = { goal: kpiData.goal, h2Goal: kpiData.h2Goal };

    // 세 섹션(KPI/AGENDA/트렌드) 중 어느 하나라도 그 주차 시트가 있으면 토글에 포함 —
    // 월+주차 조합 키를 쓰기 때문에 다음 달 시트("SEP_1" 등)가 새로 생기면 코드 수정 없이
    // 자동으로 새 옵션이 나타난다.
    const keyMap = new Map();
    [kpiData, agendaData, trendData].forEach(d => {
      Object.keys(d.byWeek || {}).forEach(k => {
        const e = d.byWeek[k];
        keyMap.set(k, { monthAbbr: e.monthAbbr, weekNum: e.weekNum });
      });
    });
    GLOBAL_WEEKS = Array.from(keyMap.entries())
      .map(([key, v]) => ({ key, monthAbbr: v.monthAbbr, weekNum: v.weekNum, title: `${krMonth(v.monthAbbr)}월 ${v.weekNum}주차` }))
      .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
  }

  function renderGlobalWeekOptions() {
    globalWeekSelect.innerHTML = "";
    GLOBAL_WEEKS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w.key;
      opt.textContent = w.title;
      globalWeekSelect.appendChild(opt);
    });
  }

  function findDefaultWeekKey() {
    const kpiData = sectionCache.kpi;
    if (kpiData) {
      const sorted = Object.keys(kpiData.byWeek || {})
        .map(k => kpiData.byWeek[k])
        .sort((a, b) => weekOrder(b.monthAbbr, b.weekNum) - weekOrder(a.monthAbbr, a.weekNum));
      for (const e of sorted) {
        if (e.data && e.data.annual && !isNaN(e.data.annual.actual)) return `${e.monthAbbr}_${e.weekNum}`;
      }
    }
    return GLOBAL_WEEKS.length ? GLOBAL_WEEKS[0].key : null;
  }

  function renderForWeek(key) {
    if (key == null) return;
    selectedWeekKey = key;
    globalWeekSelect.value = key;
    loadKpiForWeek(key);
    loadAgendaForWeek(key);
    loadTrendForWeek(key);
  }

  globalWeekSelect.addEventListener("change", () => {
    renderForWeek(globalWeekSelect.value);
  });

  // ============================================================
  // 초기화
  // ============================================================
  function renderAllPlaceholders() {
    renderInsightBar();
    const kpiSlot = document.getElementById("kpiSlot");
    const monthlyTrackSlot = document.getElementById("monthlyTrackSlot");
    const agendaSlot = document.getElementById("agendaSlot");
    const calSlot = document.getElementById("calSlot");
    const trendSlot = document.getElementById("trendSlot");
    const teamCalSlot = document.getElementById("teamCalSlot");
    kpiSlot.innerHTML = ""; monthlyTrackSlot.innerHTML = ""; agendaSlot.innerHTML = ""; calSlot.innerHTML = "";
    trendSlot.innerHTML = ""; teamCalSlot.innerHTML = "";
    kpiSlot.appendChild(renderKpiPlaceholder());
    monthlyTrackSlot.appendChild(renderMonthlyTrackPlaceholder());
    agendaSlot.appendChild(renderAgendaPlaceholder());
    calSlot.appendChild(renderCalPlaceholder());
    trendSlot.appendChild(renderTrendPlaceholder());
  }

  async function loadAll() {
    document.getElementById("connState").textContent = "불러오는 중…";
    const tasks = [];
    tasks.push((async () => {
      try {
        await initGlobalWeeks();
        renderGlobalWeekOptions();
        let target = (selectedWeekKey != null && GLOBAL_WEEKS.some(w => w.key === selectedWeekKey))
          ? selectedWeekKey
          : findDefaultWeekKey();
        renderForWeek(target);
      } catch (err) {
        const kpiSlot = document.getElementById("kpiSlot");
        kpiSlot.innerHTML = "";
        const errCard = kpiHeader("오류");
        const body = el("div", "card-body");
        body.appendChild(el("div", "state-msg err", "불러오지 못했어요: " + err.message));
        errCard.appendChild(body);
        kpiSlot.appendChild(errCard);
      }
    })());
    tasks.push(loadInsight());
    tasks.push(loadCalSection(document.getElementById("calSlot")));
    tasks.push(loadMonthlyTracking());
    tasks.push(loadTeamCalSection(document.getElementById("teamCalSlot")));
    await Promise.all(tasks);
    document.getElementById("connState").textContent = "";
  }

  function boot() {
    renderAllPlaceholders();
    loadAll();
  }

  document.getElementById("refreshBtn").addEventListener("click", () => loadAll());

  // 페이지 로드 시 이미 입력된 비밀번호가 있으면 바로 시도.
  (async function initGate() {
    if (storedPw()) {
      try {
        const data = await callBackend("kpi");
        if (data.ok) {
          document.body.classList.remove("locked");
          document.getElementById("pwGate").remove();
          boot();
          return;
        }
      } catch (err) {}
    }
    document.getElementById("pwInput").focus();
  })();
</script>
